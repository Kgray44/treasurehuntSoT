<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bridgewatch Mission Control</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <p class="eyebrow">PRIVATE / READ ONLY / KEEP THE WATCH</p>
        <div class="masthead-row">
          <div>
            <h1>BRIDGEWATCH</h1>
            <p id="meta" class="meta">Loading governed observation state...</p>
          </div>
          <a class="admin-link" href="/admin">Return to Admiralty</a>
        </div>
      </header>

      <nav class="station-nav" aria-label="Mission control stations">
        <a href="#/" data-station="overview">Overview</a>
        <a href="#/program" data-station="program">Program</a>
        <a href="#/projects" data-station="projects">Projects</a>
        <a href="#/operations" data-station="operations">Operations</a>
        <a href="#/github" data-station="github">GitHub</a>
        <a href="#/attention" data-station="attention">Attention</a>
        <a href="#/history" data-station="history">History</a>
        <a href="#/sources" data-station="sources">Sources</a>
        <a href="#/data" data-station="data">Data & Coverage</a>
      </nav>

      <section id="route" class="station" aria-live="polite"></section>
      <footer>
        Bridgewatch records observed evidence; it does not manage projects, workers, merges, or deployments.
      </footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
