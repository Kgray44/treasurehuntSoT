# Active automation template. The Device Lab publishes this only on an owned
# temporary validation branch; every job checks out the bound product candidate.
name: Landfall Device Lab __CANDIDATE_SHA__
on:
  push:
    branches: ["codex/landfall-lab-*"]
permissions:
  contents: read
concurrency:
  group: landfall-device-lab-__CANDIDATE_SHA__
  cancel-in-progress: false
jobs:
  providers:
    name: Providers / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: __CANDIDATE_SHA__
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install prisma generate --schema prisma/schema.sqlite.prisma
      - run: npm run landfall:device-lab -- --platform provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landfall-${{ matrix.os }}-__CANDIDATE_SHA__
          path: artifacts/landfall-device-lab
          retention-days: 14
  apple:
    name: Native / iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: __CANDIDATE_SHA__
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: brew install xcodegen
      - run: npx --no-install tsx scripts/landfall/device-lab/apple-build.ts
      - run: npm run landfall:device-lab -- --platform ios --scenario gps-perfect-walk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landfall-ios-__CANDIDATE_SHA__
          path: artifacts/landfall-device-lab
          retention-days: 14
  android:
    name: Native / Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: __CANDIDATE_SHA__
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: npm ci --ignore-scripts
      - run: gradle -p native/android --console plain assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: npm run landfall:device-lab -- --platform android --scenario gps-perfect-walk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landfall-android-__CANDIDATE_SHA__
          path: artifacts/landfall-device-lab
          retention-days: 14
