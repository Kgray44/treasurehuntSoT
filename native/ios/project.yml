name: LandfallCompanion
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2.git
    revision: e69e354c4f31ea07b7816b8cbe2ddb28e897d073
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    LANDFALL_ORIGIN: ""
    LANDFALL_HOST: ""
targets:
  LandfallCompanion:
    type: application
    platform: iOS
    sources:
      - LandfallCompanion
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    info:
      path: LandfallCompanion/Info.plist
      properties:
        CFBundleDisplayName: VoyageWright Landfall
        LandfallOrigin: $(LANDFALL_ORIGIN)
        WKAppBoundDomains: [$(LANDFALL_HOST)]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Your position helps check arrival at a released physical waypoint. The chart and readable fallback remain available without location.
        NSLocationAlwaysAndWhenInUseUsageDescription: Optional broad arrival reminders can wake this journey. A fresh foreground reading is still required to confirm arrival.
        NSMotionUsageDescription: Optional movement hints help interpret uncertain navigation while this journey is open.
        NSBluetoothAlwaysUsageDescription: Optional configured nearby providers can supply proximity hints. Bluetooth never completes a waypoint by itself.
        NSNearbyInteractionUsageDescription: Optional paired devices can share short-lived distance hints while this journey is open. A range cannot confirm a visit by itself.
        NFCReaderUsageDescription: Read an optional signed journey token. Unsigned tags and links cannot change Voyage progress.
        NSCameraUsageDescription: Optional Chronicle Lens placement and signed QR tokens use the camera while this journey is open. Camera images are not stored or uploaded.
        NSLocalNetworkUsageDescription: Connect to your local VoyageWright server to load released 3D objects for the current journey.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voyagewright.landfall
        CODE_SIGN_ENTITLEMENTS: LandfallCompanion/Landfall.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [LandfallCompanionTests, LandfallCompanionUiTests]
      environmentVariables:
        LANDFALL_LAB_ORIGIN: $(LANDFALL_LAB_ORIGIN)
        LANDFALL_LAB_PRESENTATION: $(LANDFALL_LAB_PRESENTATION)
  LandfallCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LandfallCompanionTests
      - path: ../../tests/fixtures/parallax
        buildPhase: resources
      - path: ../../public/parallax/sc02/models/treasure-chest.glb
        buildPhase: resources
      - path: ../../public/parallax/sc02/models/brass-compass.glb
        buildPhase: resources
    dependencies: [{ target: LandfallCompanion }, { package: GLTFKit2 }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voyagewright.landfall.tests
        GENERATE_INFOPLIST_FILE: YES
  LandfallCompanionUiTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LandfallCompanionUiTests]
    dependencies: [{ target: LandfallCompanion }]
    info:
      path: LandfallCompanionUiTests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voyagewright.landfall.ui-tests
