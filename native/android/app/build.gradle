plugins { id 'com.android.application' }
android {
  namespace 'com.voyagewright.landfall'
  compileSdk 36
  defaultConfig {
    applicationId 'com.voyagewright.landfall'
    minSdk 28
    targetSdk 36
    versionCode 1
    versionName '1.0.0'
    def origin = providers.gradleProperty('landfallOrigin').getOrElse('')
    if (origin && !origin.matches('https://[A-Za-z0-9.-]+(:[0-9]+)?')) throw new GradleException('landfallOrigin must be one HTTPS origin')
    buildConfigField 'String', 'LANDFALL_ORIGIN', '"' + origin + '"'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  buildFeatures { buildConfig true }
  sourceSets { androidTest.assets.srcDirs += '../../../tests/fixtures/parallax' }
  buildTypes {
    debug {
      // An explicit compile-time loopback origin lets an owned guest prove a
      // notification cold start after reboot, without persisting runtime extras.
      def labOrigin=providers.gradleProperty('landfallLabOrigin').getOrElse('')
      if(labOrigin && !labOrigin.matches('http://127\\.0\\.0\\.1:[0-9]{2,5}'))throw new GradleException('landfallLabOrigin must be a debug loopback origin')
      if(labOrigin)buildConfigField 'String','LANDFALL_ORIGIN','"'+labOrigin+'"'
    }
    release { minifyEnabled false }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'com.google.ar:core:1.54.0'
  implementation 'androidx.webkit:webkit:1.12.1'
  implementation 'com.google.android.gms:play-services-location:21.3.0'
  implementation 'androidx.activity:activity:1.9.3'
  implementation 'androidx.camera:camera-camera2:1.4.1'
  implementation 'androidx.camera:camera-lifecycle:1.4.1'
  implementation 'androidx.camera:camera-view:1.4.1'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  // ML Kit brings Guava at runtime; CameraX exposes ListenableFuture in its API.
  implementation 'com.google.guava:guava:32.0.1-android'
  implementation 'androidx.core.uwb:uwb:1.0.0'
  implementation 'androidx.core.uwb:uwb-rxjava3:1.0.0'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test:rules:1.6.1'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
