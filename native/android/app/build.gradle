plugins { id 'com.android.application' }
android {
  namespace 'com.voyagewright.landfall'
  compileSdk 36
  defaultConfig {
    applicationId 'com.voyagewright.landfall'
    minSdk 28
    targetSdk 36
    versionCode 1
    versionName '1.0.0'
    def origin = providers.gradleProperty('landfallOrigin').getOrElse('')
    if (origin && !origin.matches('https://[A-Za-z0-9.-]+(:[0-9]+)?')) throw new GradleException('landfallOrigin must be one HTTPS origin')
    buildConfigField 'String', 'LANDFALL_ORIGIN', '"' + origin + '"'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  buildFeatures { buildConfig true }
  buildTypes { release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'androidx.webkit:webkit:1.12.1'
  implementation 'com.google.android.gms:play-services-location:21.3.0'
  implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
  implementation 'androidx.core.uwb:uwb:1.0.0'
  implementation 'androidx.core.uwb:uwb-rxjava3:1.0.0'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test:rules:1.6.1'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
