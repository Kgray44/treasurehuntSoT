plugins { id 'com.android.application' }
android {
  namespace 'com.voyagewright.landfall.lab'
  compileSdk 36
  defaultConfig {
    applicationId 'com.voyagewright.landfall.lab'
    minSdk 28
    targetSdk 36
    versionCode 1
    versionName '1.0.0'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
androidComponents { beforeVariants(selector().withBuildType('release')) { variantBuilder -> variantBuilder.enable = false } }
dependencies { implementation 'com.google.android.gms:play-services-location:21.3.0' }
