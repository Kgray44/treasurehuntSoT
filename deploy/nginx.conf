map $request_uri $bridgewatch_browser_route {
  default 0;
  ~^/bridgewatch/$ 1;
  ~^/bridgewatch/(app\.js|style\.css)$ 1;
  ~^/bridgewatch/api/(summary|pull-requests|actions|workers|tests|attention|activity|sources)$ 1;
  ~^/bridgewatch/api/projects(/[A-Za-z0-9][A-Za-z0-9._-]{0,127})?$ 1;
  ~^/bridgewatch/api/activity\?since=[0-9A-Za-z%._:+-]+$ 1;
}

upstream forever_treasure_app {
  server 127.0.0.1:3000;
}

upstream bridgewatch_internal {
  # Keep this synchronized with BRIDGEWATCH_PORT in the private Bridgewatch service environment.
  server 127.0.0.1:4318;
  keepalive 4;
}

server {
  listen 443 ssl http2;
  server_name forevertreasure.absoluterelativesystems.com;
  client_max_body_size 64m;
  client_body_timeout 60s;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  # Canonical Wayfarer/Admiralty authorization for the direct Bridgewatch proxy.
  location = /_bridgewatch_authorize {
    internal;
    proxy_pass http://forever_treasure_app/api/internal/bridgewatch/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # The exact canonical path remains on Next.js for authorization and root HTML
  # mount rewriting. Mounted subpaths go directly to the standalone service.
  location ^~ /bridgewatch/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($bridgewatch_browser_route = 0) { return 404; }

    auth_request /_bridgewatch_authorize;
    error_page 401 403 =404 @bridgewatch_not_found;

    proxy_pass http://bridgewatch_internal/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:4318;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Prefix /bridgewatch;
    proxy_pass_request_body off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 =503 @bridgewatch_unavailable;
  }
  location @bridgewatch_not_found {
    internal;
    default_type text/plain;
    return 404 "Not found\n";
  }
  location @bridgewatch_unavailable {
    internal;
    default_type text/plain;
    return 503 "Private tool unavailable\n";
  }
  # Private assets are application-authorized only. Do not add an alias/root for provider data.
  location / {
    proxy_pass http://forever_treasure_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }
}
