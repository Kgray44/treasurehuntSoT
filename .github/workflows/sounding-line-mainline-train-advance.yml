name: Sounding Line mainline train advance

on:
  workflow_dispatch:
    inputs:
      merged_pr:
        description: Exact already-merged train-head PR to recover
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: read
  checks: write
  # GitHub's update-branch endpoint writes the same-repository suffix ref.
  # The step is still bounded below to one exact sealed train suffix.
  contents: write
  pull-requests: write

jobs:
  advance:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    name: Sounding Line / Advance landed train head
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - id: merged
        name: Resolve the exact merged train head from GitHub truth
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_pr || github.event.pull_request.number }}
        run: |
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'TRAIN_ADVANCE_PR_NUMBER_INVALID' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"
          if (-not $pr.merged_at -or $pr.base.ref -ne 'main') { throw 'TRAIN_ADVANCE_MERGED_MAIN_PR_REQUIRED' }
          "pr-number=$($pr.number)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "candidate-sha=$($pr.head.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: train
        name: Locate exactly one sealed head-ready train for this merged candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.merged.outputs.pr-number }}
          CANDIDATE_SHA: ${{ steps.merged.outputs.candidate-sha }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'TRAIN_ADVANCE_CANDIDATE_SHA_INVALID' }
          $candidateCommit = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/git/commits/$env:CANDIDATE_SHA"
          $candidateTree = $candidateCommit.tree.sha
          if ($candidateTree -notmatch '^[0-9a-f]{40}$') { throw 'TRAIN_ADVANCE_CANDIDATE_TREE_INVALID' }
          $runs = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100").workflow_runs |
            Where-Object { $_.name -eq 'Sounding Line mainline train' -and $_.path -eq '.github/workflows/sounding-line-mainline-train.yml' -and (($_.status -eq 'completed' -and $_.conclusion -eq 'success') -or $_.status -eq 'in_progress') }
          $matches = @()
          foreach ($run in $runs) {
            try {
              $artifacts = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100").artifacts
              # Select the exact PR envelope before invoking the strict
              # lineage CLI. Historical envelopes are expected to reject this
              # candidate and must never influence the live lookup.
              $envelopes = @($artifacts | Where-Object { -not $_.expired -and $_.name -eq "sounding-line-train-acceptance-envelope-pr-$($env:PR_NUMBER)" })
              $completeLive = @($artifacts | Where-Object { -not $_.expired -and $_.name -like 'sounding-line-mainline-train-live-*' })
              $headLive = @($artifacts | Where-Object { -not $_.expired -and $_.name -like 'sounding-line-mainline-train-head-live-*' })
              $live = if ($completeLive.Count -eq 1) { $completeLive } elseif ($completeLive.Count -eq 0 -and $headLive.Count -eq 1) { $headLive } else { @() }
              if ($live.Count -ne 1) { continue }
              foreach ($artifact in $envelopes) {
                $directory = Join-Path $env:RUNNER_TEMP "sounding-line-train-envelope-$($run.id)-$($artifact.id)"
                $zip = "$directory.zip"
                New-Item -ItemType Directory -Force -Path $directory | Out-Null
                Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$($artifact.id)/zip" -OutFile $zip
                Expand-Archive -LiteralPath $zip -DestinationPath $directory -Force
                $lineage = node scripts/sounding-line/v14/train-advance-lineage.mjs --envelope (Join-Path $directory 'sounding-line-acceptance-envelope.json') --plan (Join-Path $directory 'sounding-line-plan.json') --pr-number $env:PR_NUMBER --candidate-sha $env:CANDIDATE_SHA --candidate-tree-sha $candidateTree | ConvertFrom-Json
                if ($LASTEXITCODE -eq 0 -and $lineage.valid -eq $true) { $matches += @{ runId = $run.id; liveArtifact = $live[0].name; disposition = $lineage.disposition } }
              }
            } catch { }
          }
          if ($matches.Count -eq 0) { 'found=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8; exit 0 }
          if ($matches.Count -ne 1) { throw 'TRAIN_ADVANCE_AUTHORITY_NOT_UNIQUE' }
          'found=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run-id=$($matches[0].runId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "live-artifact=$($matches[0].liveArtifact)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - if: ${{ steps.train.outputs.found == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.train.outputs.live-artifact }}
          path: train-state
          run-id: ${{ steps.train.outputs.run-id }}
          github-token: ${{ github.token }}
      - if: ${{ steps.train.outputs.found == 'true' }}
        id: advanced
        name: Compare actual protected-main tree and advance only the exact predicted prefix
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          node scripts/sounding-line/v14/mainline-train-cli.mjs land --state train-state/mainline-train-head-ready.json --commit $commit --tree $tree --merge-strategy github-protected-merge-commit --out mainline-train-advanced.json
          $advance = Get-Content -Raw mainline-train-advanced.json | ConvertFrom-Json
          $next = if ($advance.train.headPosition -ge 0) { $advance.train.cars[$advance.train.headPosition] } else { $null }
          if ($next -and $next.state -eq 'HEAD_READY') {
            'next-ready=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "next-pr=$($next.candidatePrIdentity.number)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "next-candidate=$($next.candidateHeadCommitSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "next-artifact=sounding-line-train-acceptance-envelope-$($next.candidateId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else { 'next-ready=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
      - if: ${{ steps.advanced.outputs.next-ready == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.advanced.outputs.next-artifact }}
          path: next-acceptance
          run-id: ${{ steps.train.outputs.run-id }}
          github-token: ${{ github.token }}
      - if: ${{ steps.advanced.outputs.next-ready == 'true' }}
        id: rebind
        name: Reconcile retained suffix head to the exact landed predicted prefix
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.advanced.outputs.next-pr }}
          CANDIDATE_SHA: ${{ steps.advanced.outputs.next-candidate }}
          AUTHORITY_RUN_ID: ${{ steps.train.outputs.run-id }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $before = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"
          if ($before.head.sha -ne $env:CANDIDATE_SHA) { throw 'TRAIN_SUFFIX_ORIGINAL_HEAD_DRIFT' }
          $request = @{ expected_head_sha = $env:CANDIDATE_SHA } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Body $request -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER/update-branch" | Out-Null
          $after = $null
          foreach ($attempt in 1..30) {
            Start-Sleep -Seconds 2
            $after = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"
            if ($after.base.sha -eq (git rev-parse origin/main).Trim() -and $after.head.sha -ne $env:CANDIDATE_SHA) { break }
          }
          if (-not $after -or $after.base.sha -ne (git rev-parse origin/main).Trim() -or $after.head.sha -eq $env:CANDIDATE_SHA) { throw 'TRAIN_SUFFIX_REBIND_NOT_COMPLETED' }
          "rebound-candidate=$($after.head.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - if: ${{ steps.advanced.outputs.next-ready == 'true' }}
        name: Bind retained next head to its now-current protected merge identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.advanced.outputs.next-pr }}
          CANDIDATE_SHA: ${{ steps.advanced.outputs.next-candidate }}
          REBOUND_CANDIDATE_SHA: ${{ steps.rebind.outputs.rebound-candidate }}
          AUTHORITY_RUN_ID: ${{ steps.train.outputs.run-id }}
        run: |
          # GitHub updates the PR head before its synthetic merge ref is always
          # recomputed. Bind only after the complete merge identity converges;
          # otherwise a stale merge ref could compose the prior suffix head.
          $bound = $false
          $base = $null
          $head = $null
          $merge = $null
          foreach ($attempt in 1..30) {
            git fetch origin main "+refs/pull/$env:PR_NUMBER/merge:refs/remotes/origin/sounding-line-train-next-merge"
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }
            git fetch origin "+refs/pull/$env:PR_NUMBER/head:refs/remotes/origin/sounding-line-train-next-head"
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }
            $base = (git rev-parse origin/main).Trim()
            $merge = (git rev-parse origin/sounding-line-train-next-merge).Trim()
            $head = (git rev-parse origin/sounding-line-train-next-head).Trim()
            $mergeParents = @((git show -s --format=%P $merge).Trim() -split '\s+' | Where-Object { $_ })
            $headTree = (git rev-parse "$head`^{tree}").Trim()
            $mergeTree = (git rev-parse "$merge`^{tree}").Trim()
            if (
              $head -eq $env:REBOUND_CANDIDATE_SHA -and
              $mergeParents.Count -eq 2 -and
              $mergeParents -contains $base -and
              $mergeParents -contains $head -and
              $mergeTree -eq $headTree
            ) {
              node scripts/sounding-line/protected-merge-binding-ci.mjs --authority testing/sounding-line-authority.json --finalization next-acceptance/sounding-line-finalization.json --plan next-acceptance/sounding-line-plan.json --envelope next-acceptance/sounding-line-acceptance-envelope.json --pr-number $env:PR_NUMBER --candidate-sha $env:CANDIDATE_SHA --rebound-candidate-sha $head --base-sha $base --merge-sha $merge --authority-run-id $env:AUTHORITY_RUN_ID
              if ($LASTEXITCODE -ne 0) { throw 'TRAIN_NEXT_HEAD_PROTECTED_BINDING_NO_GO' }
              $body = @{ name = 'Sounding Line / Mainline Decision'; head_sha = $merge; status = 'completed'; conclusion = 'success'; output = @{ title = 'Retained train head bound'; summary = 'Exact tree-equivalent predicted-base evidence rebound to the current protected merge identity.' } } | ConvertTo-Json -Depth 8
              Invoke-RestMethod -Method Post -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -Uri "https://api.github.com/repos/$env:REPOSITORY/check-runs" -ContentType 'application/json' -Body $body | Out-Null
              git fetch origin "+refs/pull/$env:PR_NUMBER/merge:refs/remotes/origin/sounding-line-train-next-merge"
              if ($LASTEXITCODE -eq 0) {
                git fetch origin "+refs/pull/$env:PR_NUMBER/head:refs/remotes/origin/sounding-line-train-next-head"
                if ($LASTEXITCODE -eq 0) {
                  $confirmedMerge = (git rev-parse origin/sounding-line-train-next-merge).Trim()
                  $confirmedHead = (git rev-parse origin/sounding-line-train-next-head).Trim()
                  if ($confirmedMerge -eq $merge -and $confirmedHead -eq $head) { $bound = $true; break }
                }
              }
            }
            Start-Sleep -Seconds 2
          }
          if (-not $bound) { throw 'TRAIN_NEXT_HEAD_MERGE_IDENTITY_NOT_STABLE' }
      - if: ${{ steps.train.outputs.found == 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-mainline-train-advance-${{ steps.merged.outputs.pr-number }}
          path: mainline-train-advanced.json
          retention-days: 14
