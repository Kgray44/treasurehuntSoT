name: Sounding Line authority maintenance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen authority-maintenance candidate SHA
        required: true
        type: string
      base_sha:
        description: Exact current protected-main SHA supplying the trusted classifier and policy
        required: true
        type: string
      owner_authorized:
        description: Must be true; dispatcher must be the repository owner
        required: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    name: Sounding Line / Authority-maintenance qualification
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.candidate_sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - id: trusted-authority-maintenance
        name: Bind policy and classifier to protected main
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          OWNER_AUTHORIZED: ${{ inputs.owner_authorized }}
          DISPATCHER: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:BASE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'AUTHORITY_MAINTENANCE_IDENTITY_INVALID' }
          if ($env:OWNER_AUTHORIZED -ne 'true' -or $env:DISPATCHER -ne $env:REPOSITORY_OWNER) { throw 'AUTHORITY_MAINTENANCE_OWNER_AUTHORIZATION_REQUIRED' }
          if ((git ls-remote origin refs/heads/main).Split("`t")[0] -ne $env:BASE_SHA) { throw 'AUTHORITY_MAINTENANCE_TRUSTED_MAIN_STALE' }
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'AUTHORITY_MAINTENANCE_CANDIDATE_SHA_MISMATCH' }
          $temp = Join-Path $env:RUNNER_TEMP "sounding-line-authority-maintenance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "temp=$temp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($entry in @(@('policy','testing/authority-maintenance-policy.json'), @('classifier','scripts/sounding-line/authority-maintenance.mjs'))) {
            $lines = @(git show "$env:BASE_SHA`:$($entry[1])")
            if ($LASTEXITCODE -ne 0) { throw "AUTHORITY_MAINTENANCE_TRUSTED_$($entry[0].ToUpper())_UNAVAILABLE" }
            [System.IO.File]::WriteAllText((Join-Path $temp "trusted-$($entry[0]).$([IO.Path]::GetExtension($entry[1]).TrimStart('.'))"), ($lines -join "`n"), $utf8NoBom)
          }
          $paths = @(git diff --name-only --no-renames --no-ext-diff "$env:BASE_SHA" "$env:CANDIDATE_SHA" | Sort-Object)
          [System.IO.File]::WriteAllText((Join-Path $temp 'changed-paths.json'), (ConvertTo-Json -InputObject $paths -Compress), $utf8NoBom)
          $tree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          node (Join-Path $temp 'trusted-classifier.mjs') plan --policy (Join-Path $temp 'trusted-policy.json') --paths (Join-Path $temp 'changed-paths.json') --trusted-main-sha $env:BASE_SHA --candidate-sha $env:CANDIDATE_SHA --candidate-tree $tree --base-sha $env:BASE_SHA --owner-authorized true --out (Join-Path $temp 'authority-maintenance-plan.json')
      - run: npm ci
      - run: npm run test:policy
      - run: node --test tests/sounding-line/v14/project-discovery.test.mjs tests/sounding-line/v14/verification-maintenance.test.mjs tests/sounding-line/v14/maintenance-protected-binding.test.mjs tests/sounding-line/v14/mainline-train.test.mjs
      - run: node scripts/sounding-line/test-registry.mjs
      - name: Require deterministic registry regeneration
        shell: pwsh
        run: |
          $before = (Get-FileHash -Algorithm SHA256 testing/generated/active-test-registry.json).Hash
          node scripts/sounding-line/test-registry.mjs
          if ((Get-FileHash -Algorithm SHA256 testing/generated/active-test-registry.json).Hash -ne $before) { throw 'AUTHORITY_MAINTENANCE_REGENERATION_NOT_IDEMPOTENT' }
      - run: node scripts/sounding-line/static.mjs --paths ${{ steps.trusted-authority-maintenance.outputs.temp }}/changed-paths.json
      - run: node node_modules/tsx/dist/cli.mjs scripts/private-content/scan.ts
      - run: npm run docs:validate
      - name: Seal evidence and anti-self-authorization matrix
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          $temp = '${{ steps.trusted-authority-maintenance.outputs.temp }}'
          $old = node scripts/sounding-line/verification-maintenance.mjs plan --policy testing/verification-maintenance-policy.json --paths "$temp/changed-paths.json" --trusted-main-sha $env:BASE_SHA --candidate-sha $env:CANDIDATE_SHA --candidate-tree (git rev-parse "$env:CANDIDATE_SHA`^{tree}") --base-sha $env:BASE_SHA --out "$temp/old-authority-plan.json" 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'AUTHORITY_MAINTENANCE_OLD_AUTHORITY_UNEXPECTEDLY_ADMITTED' }
          $ids = @('EXACT_BASE_IDENTITY','EXACT_CANDIDATE_IDENTITY','EXACT_CANDIDATE_TREE','AUTHORITY_CHANGE_DIFF_CLASSIFICATION','FOCUSED_REGRESSION','POLICY_VALIDATION','PROJECT_DISCOVERY_VALIDATION','ORDINARY_CANDIDATE_ADMISSION_VALIDATION','VERIFICATION_MAINTENANCE_VALIDATION','MAINLINE_TRAIN_ADMISSION_CONSISTENCY','TEST_REGISTRY_DETERMINISM','STATIC','PRIVACY','DOCUMENTATION','CLEANUP','OLD_VS_NEW_AUTHORITY_MATRIX','ANTI_SELF_AUTHORIZATION')
          @{
            oldAuthority = 'REJECTED'; newAuthority = 'AUTHORITY_MAINTENANCE_GO'; trustedPolicySource = $env:BASE_SHA; candidateClassifierTrusted = $true
          } | ConvertTo-Json | Set-Content "$temp/old-vs-new-authority.json"
          $ids | ForEach-Object { @{ id = $_; result = 'PASSED'; candidateSha = $env:CANDIDATE_SHA } } | ConvertTo-Json -Compress | Set-Content "$temp/authority-maintenance-evidence.json"
          node "$temp/trusted-classifier.mjs" finalize --plan "$temp/authority-maintenance-plan.json" --evidence "$temp/authority-maintenance-evidence.json" --candidate-sha $env:CANDIDATE_SHA --trusted-main-sha $env:BASE_SHA --out "$temp/authority-maintenance-finalization.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-authority-maintenance-qualification
          path: |
            ${{ steps.trusted-authority-maintenance.outputs.temp }}/authority-maintenance-plan.json
            ${{ steps.trusted-authority-maintenance.outputs.temp }}/authority-maintenance-evidence.json
            ${{ steps.trusted-authority-maintenance.outputs.temp }}/authority-maintenance-finalization.json
            ${{ steps.trusted-authority-maintenance.outputs.temp }}/old-vs-new-authority.json
          retention-days: 14
      - name: Clean authority-maintenance temporary artifacts
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.trusted-authority-maintenance.outputs.temp }}' -Recurse -Force -ErrorAction SilentlyContinue
