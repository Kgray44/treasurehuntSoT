name: Sounding Line root maintenance
run-name: Sounding Line root maintenance ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen Root Maintenance candidate SHA
        required: true
        type: string
      base_sha:
        description: Exact current protected-main SHA supplying the trusted policy and classifier
        required: true
        type: string
      pr_number:
        description: Exact pull request number containing the frozen candidate
        required: true
        type: string
      owner_authorized:
        description: Must be true; only the repository owner may dispatch
        required: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    name: Sounding Line / Root-maintenance qualification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.candidate_sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - id: trusted-root-maintenance
        name: Bind trusted Root Maintenance policy to exact identities
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          OWNER_AUTHORIZED: ${{ inputs.owner_authorized }}
          DISPATCHER: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:BASE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'ROOT_MAINTENANCE_IDENTITY_INVALID' }
          if ($env:OWNER_AUTHORIZED -ne 'true' -or $env:DISPATCHER -ne $env:REPOSITORY_OWNER) { throw 'ROOT_MAINTENANCE_OWNER_AUTHORIZATION_REQUIRED' }
          if ((git ls-remote origin refs/heads/main).Split("`t")[0] -ne $env:BASE_SHA) { throw 'ROOT_MAINTENANCE_TRUSTED_MAIN_STALE' }
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'ROOT_MAINTENANCE_CANDIDATE_SHA_MISMATCH' }
          $temp = Join-Path $env:RUNNER_TEMP "sounding-line-root-maintenance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "temp=$temp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($entry in @(@('policy','testing/root-maintenance-policy.json'), @('classifier','scripts/sounding-line/root-maintenance.mjs'), @('binder','scripts/sounding-line/root-maintenance-bind.mjs'))) {
            $lines = @(git show "$env:BASE_SHA`:$($entry[1])")
            if ($LASTEXITCODE -ne 0) { throw "ROOT_MAINTENANCE_TRUSTED_$($entry[0].ToUpper())_UNAVAILABLE" }
            [System.IO.File]::WriteAllText((Join-Path $temp "trusted-$($entry[0]).$([IO.Path]::GetExtension($entry[1]).TrimStart('.'))"), ($lines -join "`n"), $utf8NoBom)
          }
          Copy-Item -LiteralPath (Join-Path $temp 'trusted-classifier.mjs') -Destination (Join-Path $temp 'root-maintenance.mjs')
          Copy-Item -LiteralPath (Join-Path $temp 'trusted-binder.mjs') -Destination (Join-Path $temp 'root-maintenance-bind.mjs')
          $paths = @(git diff --name-only --no-renames --no-ext-diff "$env:BASE_SHA" "$env:CANDIDATE_SHA" | Sort-Object)
          [System.IO.File]::WriteAllText((Join-Path $temp 'changed-paths.json'), (ConvertTo-Json -InputObject $paths -Compress), $utf8NoBom)
          $tree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          node (Join-Path $temp 'trusted-classifier.mjs') plan --policy (Join-Path $temp 'trusted-policy.json') --paths (Join-Path $temp 'changed-paths.json') --trusted-main-sha $env:BASE_SHA --candidate-sha $env:CANDIDATE_SHA --candidate-tree $tree --base-sha $env:BASE_SHA --pr-number $env:PR_NUMBER --owner-authorized true --out (Join-Path $temp 'root-maintenance-plan.json')
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:policy
      - run: node --test tests/sounding-line/baseline-certifier.test.mjs tests/sounding-line/v14/root-maintenance.test.mjs tests/sounding-line/v14/root-maintenance-artifact.test.mjs tests/sounding-line/v14/verification-maintenance.test.mjs tests/sounding-line/v14/maintenance-protected-binding.test.mjs
      - run: node scripts/sounding-line/control-plane-repair-routes.mjs
      - run: node scripts/sounding-line/test-registry.mjs
      - name: Require deterministic generated fixed point
        shell: pwsh
        run: |
          $before = (Get-FileHash -Algorithm SHA256 testing/generated/active-test-registry.json).Hash
          node scripts/sounding-line/test-registry.mjs
          if ((Get-FileHash -Algorithm SHA256 testing/generated/active-test-registry.json).Hash -ne $before) { throw 'ROOT_MAINTENANCE_REGISTRY_NOT_FIXED_POINT' }
          node scripts/deepwater/cli.mjs audit
          node scripts/deepwater/cli.mjs generate
          node scripts/deepwater/cli.mjs audit
      - name: Require full Baseline Certification
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim(); $tree = (git rev-parse 'HEAD^{tree}').Trim()
          node scripts/nightwatch/baseline-certifier.mjs --protected-main-sha $sha --protected-main-tree $tree --receipt-out root-maintenance-baseline-certification.json
      - name: Seal Root Maintenance evidence
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          $temp = '${{ steps.trusted-root-maintenance.outputs.temp }}'
          $ids = @('EXACT_BASE_IDENTITY','EXACT_CANDIDATE_IDENTITY','EXACT_CANDIDATE_TREE','ROOT_CHANGE_DIFF_CLASSIFICATION','ROOT_ANTI_SELF_AUTHORIZATION','CONTROL_PLANE_REPAIR_ROUTE_COMPLETENESS','BASELINE_CERTIFICATION','DEEPWATER_POLICY_IDENTITY','DETERMINISTIC_FIXED_POINT','PROTECTED_BINDING','NO_BRANCH_PROTECTION_CHANGE')
          $ids | ForEach-Object { @{ id = $_; result = 'PASSED'; candidateSha = $env:CANDIDATE_SHA } } | ConvertTo-Json -Compress | Set-Content "$temp/root-maintenance-evidence.json"
          node "$temp/trusted-classifier.mjs" finalize --plan "$temp/root-maintenance-plan.json" --evidence "$temp/root-maintenance-evidence.json" --candidate-sha $env:CANDIDATE_SHA --trusted-main-sha $env:BASE_SHA --pr-number $env:PR_NUMBER --out "$temp/root-maintenance-finalization.json"
          node "$temp/root-maintenance-bind.mjs" envelope --plan "$temp/root-maintenance-plan.json" --finalization "$temp/root-maintenance-finalization.json" --evidence "$temp/root-maintenance-evidence.json" --run-id "$env:GITHUB_RUN_ID" --out "$temp/root-maintenance-envelope.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-root-maintenance-qualification
          path: ${{ steps.trusted-root-maintenance.outputs.temp }}/root-maintenance-envelope.json
          retention-days: 14
      - if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.trusted-root-maintenance.outputs.temp }}' -Recurse -Force -ErrorAction SilentlyContinue
