name: Sounding Line control-plane
run-name: Sounding Line control-plane ${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact owner-authorized control-plane candidate ref
        required: true
        type: string
      candidate_sha:
        description: Exact candidate SHA
        required: true
        type: string
      base_sha:
        description: Exact protected-main base SHA
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      lifecycle_only:
        description: Focused Linux process qualification without a mainline decision
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  control-plane-check:
    if: ${{ !inputs.lifecycle_only }}
    name: Sounding Line / Mainline Decision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: git merge-base --is-ancestor ${{ inputs.base_sha }} ${{ inputs.candidate_sha }}
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - run: npm ci --ignore-scripts
      - run: npx --no-install prisma generate --schema prisma/schema.sqlite.prisma
      - run: npm run test:sounding-line
      - run: npm run typecheck
      - run: npx --no-install eslint scripts/sounding-line/ordinary.mjs tests/sounding-line/ordinary.test.mjs scripts/features
      - run: npm run private-content:scan
      - run: npm run docs:validate
      - run: npm run features:test
  capture-lifecycle-qualification:
    name: Sounding Line / Focused capture lifecycle (no mainline decision)
    if: ${{ inputs.lifecycle_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: git merge-base --is-ancestor ${{ inputs.base_sha }} ${{ inputs.candidate_sha }}
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Qualify actual owned processes and rendered capture
        run: node --test tests/sounding-line/capture-lifecycle.test.mjs tests/sounding-line/capture-lifecycle-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-lifecycle-qualification-${{ inputs.candidate_sha }}
          path: artifacts/sounding-line/
          if-no-files-found: error
          retention-days: 90
