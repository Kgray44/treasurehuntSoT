name: Temporary Crossdeck Prettier Helper

on:
  push:
    branches:
      - docs/project-crossdeck-v1
    paths:
      - .github/workflows/crossdeck-prettier-helper.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore(crossdeck): temporary prettier helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/project-crossdeck-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply repository Prettier
        run: npx --no-install prettier --write Development_Docs/Governing/Project_Crossdeck_Multi_Surface_Chronicle_Experience_System_Governing_Document_v1.0.md
      - name: Remove helper and publish formatted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/crossdeck-prettier-helper.yml
          git add Development_Docs/Governing/Project_Crossdeck_Multi_Surface_Chronicle_Experience_System_Governing_Document_v1.0.md
          git diff --cached --check
          git commit -m "docs(crossdeck): apply repository formatting"
          git push origin HEAD:docs/project-crossdeck-v1
