name: Sounding Line protected merge binding

on:
  # This inexpensive bridge binds existing authority to GitHub's synthetic PR
  # merge identity. It is deliberately separate from the explicit heavyweight
  # frozen-candidate workflow.
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: sounding-line-protected-merge-binding-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record-only-preflight:
    name: Sounding Line / Record-only classification
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      recordOnly: ${{ steps.classification.outputs.recordOnly }}
      proofAvailable: ${{ steps.classification.outputs.proofAvailable }}
      priorAuthorityRunId: ${{ steps.classification.outputs.priorAuthorityRunId }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - id: classification
        name: Classify exact candidate diff
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          node scripts/sounding-line/record-only-closure.mjs preflight --repository "$env:GITHUB_REPOSITORY" --candidate-sha "$env:CANDIDATE_SHA" --base-sha "$env:BASE_SHA" --merge-sha "$env:MERGE_SHA" --out record-only-preflight.json
          if ($LASTEXITCODE -ne 0) { throw "RECORD_ONLY_PREFLIGHT_FAILED" }
          $preflight = Get-Content -Raw record-only-preflight.json | ConvertFrom-Json
          $recordOnly = if ($preflight.eligible) { 'true' } else { 'false' }
          $proofAvailable = if ($preflight.priorAuthority -and @($preflight.errors).Count -eq 0) { 'true' } else { 'false' }
          "recordOnly=$recordOnly" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "proofAvailable=$proofAvailable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($proofAvailable -eq 'true') {
            "priorAuthorityRunId=$($preflight.priorAuthority.authorityRunId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - if: ${{ steps.classification.outputs.recordOnly == 'true' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-record-only-preflight
          path: record-only-preflight.json
          retention-days: 14

  record-only-evidence:
    name: Sounding Line / Record-only evidence
    needs: record-only-preflight
    if: ${{ needs.record-only-preflight.outputs.recordOnly == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Require one valid prior implementation authority
        shell: pwsh
        env:
          PROOF_AVAILABLE: ${{ needs.record-only-preflight.outputs.proofAvailable }}
        run: |
          if ($env:PROOF_AVAILABLE -ne 'true') { throw 'RECORD_ONLY_PRIOR_AUTHORITY_REFUSED' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-record-only-preflight
          path: record-only-preflight
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-plan
          path: prior-plan
          run-id: ${{ needs.record-only-preflight.outputs.priorAuthorityRunId }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-finalization
          path: prior-finalization
          run-id: ${{ needs.record-only-preflight.outputs.priorAuthorityRunId }}
          github-token: ${{ github.token }}
      - name: Seal minimum record-only evidence
        run: node scripts/sounding-line/record-only-closure.mjs evidence --preflight record-only-preflight/record-only-preflight.json --prior-plan prior-plan/sounding-line-plan.json --prior-finalization prior-finalization/sounding-line-finalization.json --plan-out record-only-plan.json --evidence-out record-only-evidence.json
      - name: Finalize record-only decision
        env:
          SOUNDING_LINE_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/sounding-line/finalize-ci.mjs record-only-plan.json record-only-evidence.json --out record-only-finalization.json
      - name: Seal record-only acceptance envelope
        env:
          SOUNDING_LINE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SOUNDING_LINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOUNDING_LINE_RUN_ID: ${{ github.run_id }}
        run: node scripts/sounding-line/create-acceptance-envelope.mjs --plan record-only-plan.json --finalization record-only-finalization.json --pr-number "$env:SOUNDING_LINE_PR_NUMBER" --base-sha "$env:SOUNDING_LINE_BASE_SHA" --run-id "$env:SOUNDING_LINE_RUN_ID" --out record-only-acceptance-envelope.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-record-only-acceptance
          path: |
            record-only-plan.json
            record-only-finalization.json
            record-only-acceptance-envelope.json
          retention-days: 14

  maintenance-preflight:
    name: Sounding Line / Verification-maintenance classification
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      maintenance: ${{ steps.classification.outputs.maintenance }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - id: classification
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git show "$env:BASE_SHA`:testing/verification-maintenance-policy.json" > trusted-maintenance-policy.json
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_MAINTENANCE_TRUSTED_POLICY_UNAVAILABLE' }
          git show "$env:BASE_SHA`:scripts/sounding-line/verification-maintenance.mjs" > trusted-verification-maintenance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_MAINTENANCE_TRUSTED_CLASSIFIER_UNAVAILABLE' }
          git show "$env:BASE_SHA`:scripts/sounding-line/project-discovery.mjs" > project-discovery.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_MAINTENANCE_TRUSTED_PROJECT_DISCOVERY_UNAVAILABLE' }
          $paths = @(git diff --name-only --no-renames --no-ext-diff "$env:BASE_SHA" "$env:CANDIDATE_SHA" | Sort-Object)
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_MAINTENANCE_CHANGED_PATHS_UNAVAILABLE' }
          ConvertTo-Json -InputObject $paths -Compress | Set-Content -NoNewline maintenance-changed-paths.json
          $tree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_MAINTENANCE_CANDIDATE_TREE_UNAVAILABLE' }
          node trusted-verification-maintenance.mjs plan --policy trusted-maintenance-policy.json --paths maintenance-changed-paths.json --trusted-main-sha $env:BASE_SHA --candidate-sha $env:CANDIDATE_SHA --candidate-tree $tree --base-sha $env:BASE_SHA --out maintenance-preflight.json
          $classificationExitCode = $LASTEXITCODE
          if ($classificationExitCode -eq 0) {
            'maintenance=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $preflight = Get-Content -Raw maintenance-preflight.json | ConvertFrom-Json
          $errors = @($preflight.errors)
          $ordinaryScopeOnly = $preflight.classification.classification -eq 'MAINTENANCE_SCOPE_REJECTED' -and $errors.Count -gt 0 -and @($errors | Where-Object { $_ -notmatch '^MAINTENANCE_SCOPE_REJECTED:' }).Count -eq 0
          $authorityScopeOnly = $preflight.classification.classification -eq 'MAINTENANCE_AUTHORITY_CHANGE_REJECTED' -and $errors.Count -gt 0 -and @($errors | Where-Object { $_ -notmatch '^MAINTENANCE_AUTHORITY_CHANGE_REJECTED:' }).Count -eq 0
          if ($ordinaryScopeOnly -or $authorityScopeOnly) {
            'maintenance=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          throw "SOUNDING_LINE_MAINTENANCE_PREFLIGHT_REJECTED:$($errors -join ',')"

  authority-maintenance-preflight:
    name: Sounding Line / Authority-maintenance classification
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      authorityMaintenance: ${{ steps.classification.outputs.authorityMaintenance }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - id: classification
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(git diff --name-only --no-renames --no-ext-diff "$env:BASE_SHA" "$env:CANDIDATE_SHA" | Sort-Object)
          $isAuthorityCandidate = $paths | Where-Object { $_ -in @('testing/authority-maintenance-policy.json','scripts/sounding-line/authority-maintenance.mjs','scripts/sounding-line/authority-maintenance-protected-binding.mjs','scripts/sounding-line/authority-maintenance-selection.mjs','.github/workflows/sounding-line-authority-maintenance.yml') }
          if (-not $isAuthorityCandidate) { 'authorityMaintenance=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8; exit 0 }
          git show "$env:BASE_SHA`:testing/authority-maintenance-policy.json" > trusted-authority-maintenance-policy.json
          if ($LASTEXITCODE -ne 0) { throw 'AUTHORITY_MAINTENANCE_TRUSTED_POLICY_UNAVAILABLE' }
          git show "$env:BASE_SHA`:scripts/sounding-line/authority-maintenance.mjs" > trusted-authority-maintenance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'AUTHORITY_MAINTENANCE_TRUSTED_CLASSIFIER_UNAVAILABLE' }
          ConvertTo-Json -InputObject $paths -Compress | Set-Content -NoNewline authority-maintenance-changed-paths.json
          $tree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          node trusted-authority-maintenance.mjs plan --policy trusted-authority-maintenance-policy.json --paths authority-maintenance-changed-paths.json --trusted-main-sha $env:BASE_SHA --candidate-sha $env:CANDIDATE_SHA --candidate-tree $tree --base-sha $env:BASE_SHA --owner-authorized true --out authority-maintenance-preflight.json
          if ($LASTEXITCODE -ne 0) { throw 'AUTHORITY_MAINTENANCE_PREFLIGHT_REJECTED' }
          'authorityMaintenance=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  bind:
    # The name is intentionally the unchanged protected branch context.
    name: Sounding Line / Mainline Decision
    needs: [record-only-preflight, record-only-evidence, maintenance-preflight, authority-maintenance-preflight]
    if: ${{ always() && needs.record-only-preflight.result == 'success' && needs.maintenance-preflight.result == 'success' && needs.authority-maintenance-preflight.result == 'success' && needs.maintenance-preflight.outputs.maintenance != 'true' && needs.authority-maintenance-preflight.outputs.authorityMaintenance != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - id: authority
        name: Locate sealed explicit authority
        if: ${{ needs.record-only-preflight.outputs.recordOnly != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $legacy = Get-Content -Raw testing/sounding-line-authority.json | ConvertFrom-Json | Select-Object -ExpandProperty protectedMergeBinding | Select-Object -ExpandProperty legacyQualifiedCandidates | Where-Object { $_.prNumber -eq [int]$env:PR_NUMBER -and $_.candidateSha -eq $env:CANDIDATE_SHA }
          if (@($legacy).Count -gt 1) { throw "AMBIGUOUS_LEGACY_QUALIFIED_AUTHORITY" }
          if ($legacy) {
            "run-id=$($legacy.authoritativeRunId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "finalization-artifact=sounding-line-finalization" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "plan-artifact=sounding-line-plan" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "legacy=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          # V14_CANDIDATE is deliberately dispatched from trusted main, so its
          # workflow-run head is main rather than the unmerged PR SHA. Select
          # the sole sealed envelope bound to this exact PR/head/base instead
          # of treating a matching workflow-run head as authority evidence.
          $runs = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100").workflow_runs |
            Where-Object {
              $_.status -eq 'completed' -and $_.conclusion -eq 'success' -and (
                ($_.name -eq 'Sounding Line authoritative' -and $_.path -eq '.github/workflows/sounding-line-authoritative.yml') -or
                ($_.name -eq 'Sounding Line mainline train' -and $_.path -eq '.github/workflows/sounding-line-mainline-train.yml')
              )
            }
          git show "$env:BASE_SHA`:scripts/sounding-line/authority-maintenance-selection.mjs" > trusted-active-authority-selection.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_TRUSTED_ACTIVE_AUTHORITY_SELECTOR_UNAVAILABLE' }
          $candidates = @()
          foreach ($run in $runs) {
            try {
              $artifacts = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100").artifacts |
                Where-Object {
                  -not $_.expired -and (
                    $_.name -eq 'sounding-line-acceptance-envelope' -or
                    $_.name -like 'sounding-line-train-acceptance-envelope-*'
                  )
                }
              foreach ($artifact in $artifacts) {
                $directory = Join-Path $env:RUNNER_TEMP "sounding-line-envelope-$($run.id)-$($artifact.id)"
                $zip = "$directory.zip"
                New-Item -ItemType Directory -Force -Path $directory | Out-Null
                Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$($artifact.id)/zip" -OutFile $zip
                Expand-Archive -LiteralPath $zip -DestinationPath $directory -Force
                $envelope = Get-Content -Raw (Join-Path $directory 'sounding-line-acceptance-envelope.json') | ConvertFrom-Json
                # The protected-binding module evaluates the qualified-base to
                # current-base interval itself. Do not discard a candidate here
                # merely because an unrelated protected-main advance requires a
                # governed semantic carry-forward decision.
                $candidate = @{ run = @{ id = $run.id; name = $run.name; path = $run.path; event = $run.event; status = $run.status; conclusion = $run.conclusion }; artifact = $artifact.name; expired = $artifact.expired; envelope = $envelope }
                if ($artifact.name -like 'sounding-line-train-acceptance-envelope-*') {
                  $candidate.plan = Get-Content -Raw (Join-Path $directory 'sounding-line-plan.json') | ConvertFrom-Json
                }
                $candidates += $candidate
              }
            } catch { }
          }
          $candidateTree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          @{ candidates = $candidates; prNumber = [int]$env:PR_NUMBER; candidateSha = $env:CANDIDATE_SHA; candidateTree = $candidateTree; currentBaseSha = $env:BASE_SHA } | ConvertTo-Json -Depth 20 | Set-Content active-authority-candidates.json
          node trusted-active-authority-selection.mjs select-active active-authority-candidates.json > active-authority-selection.json
          if ($LASTEXITCODE -ne 0) { throw 'SEALED_EXPLICIT_AUTHORITY_NOT_UNIQUE' }
          $selection = Get-Content -Raw active-authority-selection.json | ConvertFrom-Json
          if ($selection.selectedMode -eq 'TRAIN_REBIND') { "original-candidate=$($selection.originalCandidateSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          "run-id=$($selection.selectedRunId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $finalizationArtifact = if ($selection.selectedArtifact -eq 'sounding-line-acceptance-envelope') { 'sounding-line-finalization' } else { $selection.selectedArtifact }
          $planArtifact = if ($selection.selectedArtifact -eq 'sounding-line-acceptance-envelope') { 'sounding-line-plan' } else { $selection.selectedArtifact }
          "finalization-artifact=$finalizationArtifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "plan-artifact=$planArtifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "envelope-artifact=$($selection.selectedArtifact)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "train-rebind=$(if ($selection.selectedMode -eq 'TRAIN_REBIND') { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "legacy=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Download sealed finalization
        if: ${{ needs.record-only-preflight.outputs.recordOnly != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.authority.outputs.finalization-artifact }}
          path: accepted-finalization
          run-id: ${{ steps.authority.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Download sealed plan
        if: ${{ needs.record-only-preflight.outputs.recordOnly != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.authority.outputs.plan-artifact }}
          path: accepted-plan
          run-id: ${{ steps.authority.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Download qualified acceptance envelope
        if: ${{ needs.record-only-preflight.outputs.recordOnly != 'true' && steps.authority.outputs.legacy != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.authority.outputs.envelope-artifact }}
          path: accepted-envelope
          run-id: ${{ steps.authority.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Download sealed record-only acceptance
        if: ${{ needs.record-only-preflight.outputs.recordOnly == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-record-only-acceptance
          path: accepted-record-only
      - name: Normalize record-only sealed artifacts
        if: ${{ needs.record-only-preflight.outputs.recordOnly == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path accepted-finalization, accepted-plan, accepted-envelope | Out-Null
          Copy-Item -LiteralPath accepted-record-only/record-only-finalization.json -Destination accepted-finalization/sounding-line-finalization.json
          Copy-Item -LiteralPath accepted-record-only/record-only-plan.json -Destination accepted-plan/sounding-line-plan.json
          Copy-Item -LiteralPath accepted-record-only/record-only-acceptance-envelope.json -Destination accepted-envelope/sounding-line-acceptance-envelope.json
      - name: Bind sealed authority to current merge identity
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          ORIGINAL_CANDIDATE_SHA: ${{ steps.authority.outputs.original-candidate }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
          AUTHORITY_RUN_ID: ${{ needs.record-only-preflight.outputs.recordOnly == 'true' && github.run_id || steps.authority.outputs.run-id }}
          LEGACY: ${{ needs.record-only-preflight.outputs.recordOnly == 'true' && 'false' || steps.authority.outputs.legacy }}
          TRAIN_REBIND: ${{ steps.authority.outputs.train-rebind }}
        run: |
          $args = @(
            'scripts/sounding-line/protected-merge-binding-ci.mjs',
            '--authority', 'testing/sounding-line-authority.json',
            '--finalization', 'accepted-finalization/sounding-line-finalization.json',
            '--plan', 'accepted-plan/sounding-line-plan.json',
            '--pr-number', $env:PR_NUMBER,
            '--candidate-sha', $(if ($env:TRAIN_REBIND -eq 'true') { $env:ORIGINAL_CANDIDATE_SHA } else { $env:CANDIDATE_SHA }),
            '--base-sha', $env:BASE_SHA,
            '--merge-sha', $env:MERGE_SHA,
            '--authority-run-id', $env:AUTHORITY_RUN_ID
          )
          if ($env:TRAIN_REBIND -eq 'true') { $args += @('--rebound-candidate-sha', $env:CANDIDATE_SHA) }
          if ($env:LEGACY -ne 'true') { $args += @('--envelope', 'accepted-envelope/sounding-line-acceptance-envelope.json') }
          node @args

  bind-maintenance:
    name: Sounding Line / Mainline Decision
    needs: [record-only-preflight, maintenance-preflight, authority-maintenance-preflight]
    if: ${{ always() && needs.record-only-preflight.result == 'success' && needs.record-only-preflight.outputs.recordOnly != 'true' && needs.maintenance-preflight.outputs.maintenance == 'true' && needs.authority-maintenance-preflight.outputs.authorityMaintenance != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - id: authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$env:BASE_SHA`:scripts/sounding-line/maintenance-authority-selection.mjs" > trusted-maintenance-authority-selection.mjs
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $candidateTree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          $runs = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$env:BASE_SHA&per_page=100").workflow_runs
          $sealed = @()
          foreach ($run in $runs) {
            if ($run.name -ne 'Sounding Line verification maintenance' -or $run.path -ne '.github/workflows/sounding-line-verification-maintenance.yml' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { continue }
            try {
              $artifacts = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100").artifacts | Where-Object { $_.name -eq 'sounding-line-maintenance-qualification' -and -not $_.expired }
              if (@($artifacts).Count -ne 1) { continue }
              $runDirectory = Join-Path $env:RUNNER_TEMP "sounding-line-maintenance-$($run.id)"
              $zip = "$runDirectory.zip"
              New-Item -ItemType Directory -Force -Path $runDirectory | Out-Null
              Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$($artifacts[0].id)/zip" -OutFile $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $runDirectory -Force
              $sealed += @{ id = $run.id; name = $run.name; path = $run.path; event = $run.event; status = $run.status; conclusion = $run.conclusion; headSha = $run.head_sha; plan = (Get-Content -Raw (Join-Path $runDirectory 'maintenance-plan.json') | ConvertFrom-Json); finalization = (Get-Content -Raw (Join-Path $runDirectory 'maintenance-finalization.json') | ConvertFrom-Json) }
            } catch { }
          }
          @{ runs = $sealed; candidateSha = $env:CANDIDATE_SHA; candidateTree = $candidateTree; qualifiedBaseSha = $env:BASE_SHA } | ConvertTo-Json -Depth 16 | Set-Content maintenance-authorities.json
          node trusted-maintenance-authority-selection.mjs maintenance-authorities.json > maintenance-authority-selection.json
          if ($LASTEXITCODE -ne 0) { throw 'SEALED_MAINTENANCE_AUTHORITY_NOT_UNIQUE' }
          $selection = Get-Content -Raw maintenance-authority-selection.json | ConvertFrom-Json
          "run-id=$($selection.selectedRunId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-maintenance-qualification
          path: accepted-maintenance
          run-id: ${{ steps.authority.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Bind trusted maintenance evidence to merge identity
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          git show "$env:BASE_SHA`:scripts/sounding-line/maintenance-protected-binding.mjs" > trusted-maintenance-binding.mjs
          $parents = @((git show -s --format=%P $env:MERGE_SHA).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) | ConvertTo-Json -Compress
          $tree = (git show -s --format=%T $env:MERGE_SHA).Trim()
          $script = @"
          import { readFile } from 'node:fs/promises';
          import { qualifyMaintenanceProtectedMerge } from './trusted-maintenance-binding.mjs';
          const plan = JSON.parse(await readFile('accepted-maintenance/maintenance-plan.json', 'utf8'));
          const finalization = JSON.parse(await readFile('accepted-maintenance/maintenance-finalization.json', 'utf8'));
          const result = qualifyMaintenanceProtectedMerge({ plan, finalization, candidateSha: process.env.CANDIDATE_SHA, currentBaseSha: process.env.BASE_SHA, mergeSha: process.env.MERGE_SHA, mergeTree: process.env.MERGE_TREE, mergeParents: JSON.parse(process.env.MERGE_PARENTS) });
          console.log(JSON.stringify(result, null, 2)); process.exitCode = result.decision === 'BINDING_PASS' ? 0 : 1;
          "@
          $script | Set-Content maintenance-bind.mjs
          $env:MERGE_TREE = $tree
          $env:MERGE_PARENTS = $parents
          node maintenance-bind.mjs

  bind-authority-maintenance:
    name: Sounding Line / Mainline Decision
    needs: [record-only-preflight, maintenance-preflight, authority-maintenance-preflight]
    if: ${{ always() && needs.record-only-preflight.result == 'success' && needs.record-only-preflight.outputs.recordOnly != 'true' && needs.maintenance-preflight.result == 'success' && needs.authority-maintenance-preflight.outputs.authorityMaintenance == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - id: authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git show "$env:BASE_SHA`:scripts/sounding-line/authority-maintenance-selection.mjs" > trusted-authority-maintenance-selection.mjs
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $candidateTree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          $runs = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$env:BASE_SHA&per_page=100").workflow_runs
          $sealed = @()
          foreach ($run in $runs) {
            if ($run.name -ne 'Sounding Line authority maintenance' -or $run.path -ne '.github/workflows/sounding-line-authority-maintenance.yml' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { continue }
            try {
              $artifact = @((Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100").artifacts | Where-Object { $_.name -eq 'sounding-line-authority-maintenance-qualification' -and -not $_.expired })
              if ($artifact.Count -ne 1) { continue }
              $directory = Join-Path $env:RUNNER_TEMP "sounding-line-authority-maintenance-$($run.id)"
              Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$($artifact[0].id)/zip" -OutFile "$directory.zip"
              Expand-Archive -LiteralPath "$directory.zip" -DestinationPath $directory -Force
              $sealed += @{ id = $run.id; name = $run.name; path = $run.path; event = $run.event; status = $run.status; conclusion = $run.conclusion; headSha = $run.head_sha; plan = (Get-Content -Raw (Join-Path $directory 'authority-maintenance-plan.json') | ConvertFrom-Json); finalization = (Get-Content -Raw (Join-Path $directory 'authority-maintenance-finalization.json') | ConvertFrom-Json) }
            } catch { }
          }
          @{ runs = $sealed; candidateSha = $env:CANDIDATE_SHA; candidateTree = $candidateTree; qualifiedBaseSha = $env:BASE_SHA } | ConvertTo-Json -Depth 16 | Set-Content authority-maintenance-authorities.json
          node trusted-authority-maintenance-selection.mjs authority-maintenance-authorities.json > authority-maintenance-selection.json
          if ($LASTEXITCODE -ne 0) { throw 'SEALED_AUTHORITY_MAINTENANCE_AUTHORITY_NOT_UNIQUE' }
          $selection = Get-Content -Raw authority-maintenance-selection.json | ConvertFrom-Json
          "run-id=$($selection.selectedRunId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-authority-maintenance-qualification
          path: accepted-authority-maintenance
          run-id: ${{ steps.authority.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Bind sealed authority-maintenance evidence to merge identity
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          git show "$env:BASE_SHA`:scripts/sounding-line/authority-maintenance-protected-binding.mjs" > trusted-authority-maintenance-binding.mjs
          $parents = @((git show -s --format=%P $env:MERGE_SHA).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) | ConvertTo-Json -Compress
          $tree = (git show -s --format=%T $env:MERGE_SHA).Trim()
          $script = @"
          import { readFile } from 'node:fs/promises';
          import { qualifyAuthorityMaintenanceProtectedMerge } from './trusted-authority-maintenance-binding.mjs';
          const plan = JSON.parse(await readFile('accepted-authority-maintenance/authority-maintenance-plan.json', 'utf8'));
          const finalization = JSON.parse(await readFile('accepted-authority-maintenance/authority-maintenance-finalization.json', 'utf8'));
          const result = qualifyAuthorityMaintenanceProtectedMerge({ plan, finalization, candidateSha: process.env.CANDIDATE_SHA, currentBaseSha: process.env.BASE_SHA, mergeSha: process.env.MERGE_SHA, mergeTree: process.env.MERGE_TREE, mergeParents: JSON.parse(process.env.MERGE_PARENTS) });
          console.log(JSON.stringify(result, null, 2)); process.exitCode = result.decision === 'BINDING_PASS' ? 0 : 1;
          "@
          $script | Set-Content authority-maintenance-bind.mjs
          $env:MERGE_TREE = $tree
          $env:MERGE_PARENTS = $parents
          node authority-maintenance-bind.mjs
