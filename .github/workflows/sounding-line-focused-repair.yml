name: Sounding Line focused repair

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Exact registered suite ID selected from the sealed gate plan
        required: true
        type: string
      gate:
        description: Gate whose sealed plan must govern the selected suite
        required: true
        type: choice
        default: release-candidate
        options: [mainline, release-candidate]

permissions:
  contents: read

jobs:
  focused-plan:
    name: Sounding Line / Validate focused selection
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - env:
          SOUNDING_LINE_GATE: ${{ inputs.gate }}
        run: node -e "import('./scripts/sounding-line/planner.mjs').then(async m=>console.log(JSON.stringify(await m.buildPlan({root:process.cwd(),gateId:process.env.SOUNDING_LINE_GATE,serial:false,sourceSha:process.env.GITHUB_SHA}),null,2)))" > sounding-line-plan.json
      - name: Validate exact registered suite and resource scope
        shell: pwsh
        env:
          SOUNDING_LINE_SUITE: ${{ inputs.suite }}
        run: node scripts/sounding-line/focused-selection.mjs --plan sounding-line-plan.json --suite "$env:SOUNDING_LINE_SUITE" --out sounding-line-focused-selection.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-plan
          path: |
            sounding-line-plan.json
            sounding-line-focused-selection.json
          retention-days: 14

  focused-suite:
    name: Sounding Line / Focused diagnostic evidence
    needs: focused-plan
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ inputs.suite }}
      gate: ${{ inputs.gate }}
