name: Sounding Line focused development
run-name: Focused development ${{ inputs.candidate_sha }} ${{ inputs.test_selector }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact same-repository candidate commit
        required: true
        type: string
      test_selector:
        description: One existing tests/e2e/*.spec.ts file or file:line
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sounding-line-development-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  focused-development:
    name: Focused browser development (no mainline decision)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TEST_SELECTOR: ${{ inputs.test_selector }}
      SOUNDING_LINE_EVIDENCE_PURPOSE: DEVELOPMENT_ONLY
    steps:
      - name: Require protected workflow source and a focused selector
        id: development-source
        run: |
          node --input-type=module <<'EOF'
          import { appendFile } from "node:fs/promises";
          import { randomUUID } from "node:crypto";
          if (process.env.GITHUB_REF !== "refs/heads/main" ||
              !/^[a-f0-9]{40}$/u.test(process.env.CANDIDATE_SHA ?? "") ||
              !/^tests\/e2e\/(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.spec\.ts(?::[1-9][0-9]*)?$/u.test(process.env.TEST_SELECTOR ?? ""))
            throw new Error("DEVELOPMENT_SOURCE_OR_SELECTOR_INVALID");
          await appendFile(process.env.GITHUB_OUTPUT, `private_failure_publication_nonce=${randomUUID()}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `preparation_failure_publication_nonce=${randomUUID()}\n`);
          EOF
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: authority
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate-source
          fetch-depth: 1
          persist-credentials: false
      - name: Create the dedicated candidate worktree
        run: git -C candidate-source worktree add --detach "$GITHUB_WORKSPACE/candidate" "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install locked development dependencies
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Prepare the source-bound development runtime
        id: prepare
        env:
          SOUNDING_LINE_PREPARATION_FAILURE_PUBLICATION_NONCE: ${{ steps.development-source.outputs.preparation_failure_publication_nonce }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$GITHUB_WORKSPACE/authority/artifacts/focused-development-private"
          node authority/scripts/sounding-line/develop-browser-suite.mjs prepare --workspace "$GITHUB_WORKSPACE/candidate" --test "$TEST_SELECTOR" --output "$GITHUB_WORKSPACE/authority/artifacts/focused-development-private/preparation"
          node --input-type=module <<'EOF'
          import { readFile, appendFile } from "node:fs/promises";
          import path from "node:path";
          const file = path.join(process.env.GITHUB_WORKSPACE, "authority/artifacts/focused-development-private/preparation/development-result.private.json");
          const result = JSON.parse(await readFile(file, "utf8"));
          const manifest = result.preparedManifest?.file;
          const preparedRoot = path.join(process.env.GITHUB_WORKSPACE, "candidate/artifacts/sounding-line/browser-development");
          const relative = typeof manifest === "string" ? path.relative(preparedRoot, manifest) : "";
          if (result.role !== "DEVELOPMENT_ONLY" || result.qualification !== false ||
              result.status !== "PASS_DEVELOPMENT_PREPARED_NOT_ACCEPTANCE" ||
              typeof manifest !== "string" || !path.isAbsolute(manifest) ||
              path.resolve(manifest) !== manifest || /[\u0000-\u001f\u007f]/u.test(manifest) ||
              !/^prepared-[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}[/]prepared[.]private[.]json$/u.test(relative) ||
              !/^[a-f0-9]{64}$/u.test(result.preparedManifest?.sha256 ?? ""))
            throw new Error("DEVELOPMENT_PREPARATION_INCOMPLETE");
          await appendFile(process.env.GITHUB_OUTPUT, `manifest=${result.preparedManifest.file}\nmanifest_sha256=${result.preparedManifest.sha256}\n`);
          EOF
      - name: Retain encrypted preparation failure diagnostics
        if: ${{ always() && steps.development-source.outputs.preparation_failure_publication_nonce != '' && steps.prepare.outputs.private_preparation_failure_publish == steps.development-source.outputs.preparation_failure_publication_nonce && steps.prepare.outputs.private_preparation_failure_paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-preparation-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.private_preparation_failure_paths }}
          if-no-files-found: error
          retention-days: 90
      - name: Run the selected development case without qualification
        id: development-execution
        env:
          PREPARED_MANIFEST: ${{ steps.prepare.outputs.manifest }}
          PREPARED_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
          SOUNDING_LINE_PRIVATE_FAILURE_PUBLICATION_NONCE: ${{ steps.development-source.outputs.private_failure_publication_nonce }}
        run: node authority/scripts/sounding-line/develop-browser-suite.mjs run --workspace "$GITHUB_WORKSPACE/candidate" --test "$TEST_SELECTOR" --output "$GITHUB_WORKSPACE/authority/artifacts/focused-development-private/execution" --prepared "$PREPARED_MANIFEST" --manifest-sha256 "$PREPARED_MANIFEST_SHA256"
      - name: Retain encrypted development failure diagnostics
        if: ${{ always() && steps.development-source.outputs.private_failure_publication_nonce != '' && steps.development-execution.outputs.private_browser_failure_publish == steps.development-source.outputs.private_failure_publication_nonce && steps.development-execution.outputs.private_browser_failure_paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-development-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.development-execution.outputs.private_browser_failure_paths }}
          if-no-files-found: error
          retention-days: 90
