name: Sounding Line focused repair

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Governed suite selected from the sealed mainline plan
        required: true
        type: choice
        options:
          - harborlight.phase4.browser
          - harborlight.phase4.unit
          - harborlight.phase4.sqlite
          - browser.access-sentinel

permissions:
  contents: read

jobs:
  focused-suite:
    name: Sounding Line / Focused Repair
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema prisma/schema.sqlite.prisma
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npm run db:seed
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npx playwright install chromium
      - run: node scripts/sounding-line/authority.mjs mainline --execute-only --suite ${{ inputs.suite }} --receipt-out sounding-line-worker-evidence.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with: { name: sounding-line-focused-${{ inputs.suite }}, path: sounding-line-worker-evidence.json, retention-days: 14 }
