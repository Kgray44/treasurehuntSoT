# Keep the job disabled until native publication and dispatch are independently authorized.
name: Sounding Line Jammy confined runtime preflight
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact independently reviewed protected source
        type: string
        required: true
      operation:
        description: Separately authorized confined diagnostic action
        type: choice
        options:
          - confined-loader-and-denials-only
        required: true
permissions: {}
concurrency:
  group: sounding-line-jammy-confined-preflight
  cancel-in-progress: false
jobs:
  confined:
    # A dispatch actor is an identity check, never approval to run.
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: sounding-line-jammy-preflight
    permissions:
      contents: read
      actions: read
    env:
      REQUESTED_SOURCE: ${{ inputs.source_sha }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
    steps:
      - name: Check protected dispatch identity
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REQUESTED_SOURCE" = "$GITHUB_SHA"
          test "$REQUESTED_OPERATION" = confined-loader-and-denials-only
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/sounding-line/b-c856-linux-controller
      - name: Run the independently approved confined diagnostic
        id: preflight
        working-directory: source
        shell: bash
        env:
          JAMMY_PREFLIGHT_APPROVAL: ${{ secrets.JAMMY_PREFLIGHT_APPROVAL }}
          JAMMY_PREFLIGHT_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0 /usr/bin/git --no-replace-objects -c core.fsmonitor=false \
            show "${GITHUB_SHA}:scripts/sounding-line/b-c856-linux-controller/jammy_preflight_checkout.py" |
            /usr/bin/python3 -IB - launch
      - name: Reconcile same-job custody after interruption
        if: ${{ always() && (failure() || cancelled()) && (steps.preflight.outputs.custody_sha256 != '' || steps.preflight.outputs.intent_sha256 != '') }}
        working-directory: source
        shell: bash
        env:
          JAMMY_PREFLIGHT_APPROVAL: ${{ secrets.JAMMY_PREFLIGHT_APPROVAL }}
          JAMMY_PREFLIGHT_TOKEN: ${{ github.token }}
          PRIOR_CUSTODY_SHA256: ${{ steps.preflight.outputs.custody_sha256 }}
          PRIOR_INTENT_SHA256: ${{ steps.preflight.outputs.intent_sha256 }}
        run: |
          /usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0 /usr/bin/git --no-replace-objects -c core.fsmonitor=false \
            show "${GITHUB_SHA}:scripts/sounding-line/b-c856-linux-controller/jammy_preflight_checkout.py" |
            /usr/bin/python3 -IB - recover
