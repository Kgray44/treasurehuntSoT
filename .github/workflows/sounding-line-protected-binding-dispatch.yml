name: Sounding Line protected binding dispatch
run-name: Sounding Line protected binding ${{ inputs.nightwatch_dispatch_key }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact pull request number
        required: true
        type: string
      candidate_sha:
        description: Exact frozen candidate SHA
        required: true
        type: string
      candidate_ref:
        description: Exact frozen candidate ref
        required: true
        type: string
      base_sha:
        description: Exact protected base SHA qualified with the candidate
        required: true
        type: string
      authority_run_id:
        description: Exact completed Sounding Line authority run ID
        required: true
        type: string
      nightwatch_dispatch_key:
        description: Durable Nightwatch dispatch key for restart-safe controller rediscovery
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: sounding-line-protected-binding-dispatch-${{ inputs.pr_number }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  bind:
    name: Sounding Line / Protected binding dispatch
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.candidate_sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Verify exact PR and construct predicted protected merge identity
        id: identity
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'NIGHTWATCH_BINDING_PR_INVALID' }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:BASE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'NIGHTWATCH_BINDING_SHA_INVALID' }
          if ($env:CANDIDATE_REF -notmatch '^refs/heads/[A-Za-z0-9._/-]+$') { throw 'NIGHTWATCH_BINDING_REF_INVALID' }
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"
          if ($pr.head.sha -ne $env:CANDIDATE_SHA -or $pr.base.sha -ne $env:BASE_SHA) { throw 'NIGHTWATCH_BINDING_PR_IDENTITY_MISMATCH' }
          git cat-file -e "$env:CANDIDATE_SHA`^{commit}"
          git cat-file -e "$env:BASE_SHA`^{commit}"
          git merge-base --is-ancestor $env:BASE_SHA $env:CANDIDATE_SHA
          $tree = (git merge-tree --write-tree $env:BASE_SHA $env:CANDIDATE_SHA).Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -notmatch '^[0-9a-f]{40}$') { throw 'NIGHTWATCH_BINDING_SYNTHETIC_TREE_UNAVAILABLE' }
          $env:GIT_AUTHOR_NAME = 'Sounding Line protected binding'; $env:GIT_AUTHOR_EMAIL = 'sounding-line@localhost'
          $env:GIT_COMMITTER_NAME = $env:GIT_AUTHOR_NAME; $env:GIT_COMMITTER_EMAIL = $env:GIT_AUTHOR_EMAIL
          $merge = ("Nightwatch protected binding `n" | git commit-tree $tree -p $env:BASE_SHA -p $env:CANDIDATE_SHA).Trim()
          if ($LASTEXITCODE -ne 0 -or $merge -notmatch '^[0-9a-f]{40}$') { throw 'NIGHTWATCH_BINDING_SYNTHETIC_MERGE_UNAVAILABLE' }
          "merge-sha=$merge" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: sounding-line-finalization,
            path: accepted-finalization,
            run-id: "${{ inputs.authority_run_id }}",
            github-token: "${{ github.token }}",
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: sounding-line-plan,
            path: accepted-plan,
            run-id: "${{ inputs.authority_run_id }}",
            github-token: "${{ github.token }}",
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: sounding-line-acceptance-envelope,
            path: accepted-envelope,
            run-id: "${{ inputs.authority_run_id }}",
            github-token: "${{ github.token }}",
          }
      - name: Bind exact accepted authority before controlled merge
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MERGE_SHA: ${{ steps.identity.outputs.merge-sha }}
          AUTHORITY_RUN_ID: ${{ inputs.authority_run_id }}
        run: |
          node scripts/sounding-line/protected-merge-binding-ci.mjs --authority testing/sounding-line-authority.json --finalization accepted-finalization/sounding-line-finalization.json --plan accepted-plan/sounding-line-plan.json --envelope accepted-envelope/sounding-line-acceptance-envelope.json --pr-number "$env:PR_NUMBER" --candidate-sha "$env:CANDIDATE_SHA" --base-sha "$env:BASE_SHA" --merge-sha "$env:MERGE_SHA" --authority-run-id "$env:AUTHORITY_RUN_ID" | Tee-Object -FilePath nightwatch-protected-binding-receipt.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: nightwatch-protected-binding-receipt
          path: nightwatch-protected-binding-receipt.json
          retention-days: 14
