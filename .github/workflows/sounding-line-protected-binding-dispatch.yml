name: Sounding Line protected binding dispatch
run-name: Sounding Line protected binding ${{ inputs.nightwatch_dispatch_key }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact pull request number
        required: true
        type: string
      candidate_sha:
        description: Exact frozen candidate SHA
        required: true
        type: string
      candidate_ref:
        description: Exact frozen candidate ref
        required: true
        type: string
      base_sha:
        description: Exact protected base SHA qualified with the candidate
        required: true
        type: string
      authority_run_id:
        description: Exact completed Sounding Line authority run ID
        required: true
        type: string
      authority_kind:
        description: Bound evidence lane; ordinary or root_maintenance
        required: false
        default: ordinary
        type: string
      nightwatch_dispatch_key:
        description: Durable Nightwatch dispatch key for restart-safe controller rediscovery
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: sounding-line-protected-binding-dispatch-${{ inputs.pr_number }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  bind:
    name: ${{ inputs.authority_kind == 'root_maintenance' && 'Sounding Line / Mainline Decision' || 'Sounding Line / Protected binding dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.candidate_sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Verify exact PR and construct predicted protected merge identity
        id: identity
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          AUTHORITY_KIND: ${{ inputs.authority_kind }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'NIGHTWATCH_BINDING_PR_INVALID' }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:BASE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'NIGHTWATCH_BINDING_SHA_INVALID' }
          if ($env:CANDIDATE_REF -notmatch '^refs/heads/[A-Za-z0-9._/-]+$') { throw 'NIGHTWATCH_BINDING_REF_INVALID' }
          if ($env:AUTHORITY_KIND -notin @('ordinary', 'root_maintenance')) { throw 'NIGHTWATCH_BINDING_AUTHORITY_KIND_INVALID' }
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"
          if ($pr.head.sha -ne $env:CANDIDATE_SHA -or $pr.base.sha -ne $env:BASE_SHA) { throw 'NIGHTWATCH_BINDING_PR_IDENTITY_MISMATCH' }
          git cat-file -e "$env:CANDIDATE_SHA`^{commit}"
          git cat-file -e "$env:BASE_SHA`^{commit}"
          git merge-base --is-ancestor $env:BASE_SHA $env:CANDIDATE_SHA
          $tree = (git merge-tree --write-tree $env:BASE_SHA $env:CANDIDATE_SHA).Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -notmatch '^[0-9a-f]{40}$') { throw 'NIGHTWATCH_BINDING_SYNTHETIC_TREE_UNAVAILABLE' }
          $env:GIT_AUTHOR_NAME = 'Sounding Line protected binding'; $env:GIT_AUTHOR_EMAIL = 'sounding-line@localhost'
          $env:GIT_COMMITTER_NAME = $env:GIT_AUTHOR_NAME; $env:GIT_COMMITTER_EMAIL = $env:GIT_AUTHOR_EMAIL
          $merge = ("Nightwatch protected binding `n" | git commit-tree $tree -p $env:BASE_SHA -p $env:CANDIDATE_SHA).Trim()
          if ($LASTEXITCODE -ne 0 -or $merge -notmatch '^[0-9a-f]{40}$') { throw 'NIGHTWATCH_BINDING_SYNTHETIC_MERGE_UNAVAILABLE' }
          "merge-sha=$merge" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Select exactly one sealed Root Maintenance qualification
        id: root-authority
        if: ${{ inputs.authority_kind == 'root_maintenance' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          AUTHORITY_RUN_ID: ${{ inputs.authority_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AUTHORITY_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'ROOT_MAINTENANCE_AUTHORITY_RUN_INVALID' }
          git show "$env:BASE_SHA`:scripts/sounding-line/root-maintenance-selection.mjs" > trusted-root-maintenance-selection.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_MAINTENANCE_TRUSTED_SELECTOR_UNAVAILABLE' }
          git show "$env:BASE_SHA`:scripts/sounding-line/root-maintenance-artifact.mjs" > trusted-root-maintenance-artifact.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_MAINTENANCE_TRUSTED_ARTIFACT_CONTRACT_UNAVAILABLE' }
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $runs = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100").workflow_runs
          $sealed = @()
          foreach ($run in $runs) {
            if ($run.name -notmatch '^Sounding Line root maintenance(?:\s|$)' -or $run.path -ne '.github/workflows/sounding-line-root-maintenance.yml' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { continue }
            try {
              $artifact = @((Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100").artifacts | Where-Object { $_.name -eq 'sounding-line-root-maintenance-qualification' -and -not $_.expired })
              if ($artifact.Count -ne 1) { continue }
              $directory = Join-Path $env:RUNNER_TEMP "sounding-line-root-maintenance-$($run.id)"
              Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$($artifact[0].id)/zip" -OutFile "$directory.zip"
              Expand-Archive -LiteralPath "$directory.zip" -DestinationPath $directory -Force
              node trusted-root-maintenance-artifact.mjs $directory > "$directory/root-maintenance-artifact.json"
              if ($LASTEXITCODE -ne 0) { throw 'ROOT_MAINTENANCE_ARTIFACT_DISCOVERY_FAILED' }
              $artifactPayload = Get-Content -Raw "$directory/root-maintenance-artifact.json" | ConvertFrom-Json
              $sealed += @{ id = $run.id; name = $run.name; path = $run.path; event = $run.event; status = $run.status; conclusion = $run.conclusion; headSha = $run.head_sha; plan = $artifactPayload.plan; finalization = $artifactPayload.finalization }
            } catch {
              if ([int]$run.id -eq [int]$env:AUTHORITY_RUN_ID) { throw }
            }
          }
          $candidateTree = (git rev-parse "$env:CANDIDATE_SHA`^{tree}").Trim()
          @{ runs = $sealed; candidateSha = $env:CANDIDATE_SHA; candidateTree = $candidateTree; qualifiedBaseSha = $env:BASE_SHA; prNumber = [int]$env:PR_NUMBER } | ConvertTo-Json -Depth 16 | Set-Content root-maintenance-authorities.json
          node trusted-root-maintenance-selection.mjs root-maintenance-authorities.json > root-maintenance-selection.json
          if ($LASTEXITCODE -ne 0) { throw 'SEALED_ROOT_MAINTENANCE_AUTHORITY_NOT_UNIQUE' }
          $selection = Get-Content -Raw root-maintenance-selection.json | ConvertFrom-Json
          if ($selection.selectedRunId -ne [int]$env:AUTHORITY_RUN_ID) { throw 'ROOT_MAINTENANCE_AUTHORITY_RUN_IDENTITY_MISMATCH' }
          "run-id=$($selection.selectedRunId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - if: ${{ inputs.authority_kind == 'ordinary' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: sounding-line-finalization,
            path: accepted-finalization,
            run-id: "${{ inputs.authority_run_id }}",
            github-token: "${{ github.token }}",
          }
      - if: ${{ inputs.authority_kind == 'ordinary' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: sounding-line-plan,
            path: accepted-plan,
            run-id: "${{ inputs.authority_run_id }}",
            github-token: "${{ github.token }}",
          }
      - if: ${{ inputs.authority_kind == 'ordinary' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: sounding-line-acceptance-envelope,
            path: accepted-envelope,
            run-id: "${{ inputs.authority_run_id }}",
            github-token: "${{ github.token }}",
          }
      - if: ${{ inputs.authority_kind == 'root_maintenance' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: sounding-line-root-maintenance-qualification,
            path: accepted-root-maintenance,
            run-id: "${{ steps.root-authority.outputs.run-id }}",
            github-token: "${{ github.token }}",
          }
      - name: Bind exact accepted ordinary authority before controlled merge
        if: ${{ inputs.authority_kind == 'ordinary' }}
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MERGE_SHA: ${{ steps.identity.outputs.merge-sha }}
          AUTHORITY_RUN_ID: ${{ inputs.authority_run_id }}
        run: |
          node scripts/sounding-line/protected-merge-binding-ci.mjs --authority testing/sounding-line-authority.json --finalization accepted-finalization/sounding-line-finalization.json --plan accepted-plan/sounding-line-plan.json --envelope accepted-envelope/sounding-line-acceptance-envelope.json --pr-number "$env:PR_NUMBER" --candidate-sha "$env:CANDIDATE_SHA" --base-sha "$env:BASE_SHA" --merge-sha "$env:MERGE_SHA" --authority-run-id "$env:AUTHORITY_RUN_ID" | Tee-Object -FilePath nightwatch-protected-binding-receipt.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind exactly one sealed Root Maintenance authority before controlled merge
        if: ${{ inputs.authority_kind == 'root_maintenance' }}
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MERGE_SHA: ${{ steps.identity.outputs.merge-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git show "$env:BASE_SHA`:scripts/sounding-line/root-maintenance-protected-binding.mjs" > trusted-root-maintenance-binding.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ROOT_MAINTENANCE_TRUSTED_BINDER_UNAVAILABLE' }
          $parents = @((git show -s --format=%P $env:MERGE_SHA).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) | ConvertTo-Json -Compress
          $tree = (git show -s --format=%T $env:MERGE_SHA).Trim()
          $script = @"
          import { readSealedRootMaintenanceArtifact } from './trusted-root-maintenance-artifact.mjs';
          import { qualifyRootMaintenanceProtectedMerge } from './trusted-root-maintenance-binding.mjs';
          const { plan, finalization } = await readSealedRootMaintenanceArtifact('accepted-root-maintenance');
          const result = qualifyRootMaintenanceProtectedMerge({ plan, finalization, candidateSha: process.env.CANDIDATE_SHA, currentBaseSha: process.env.BASE_SHA, mergeSha: process.env.MERGE_SHA, mergeTree: process.env.MERGE_TREE, mergeParents: JSON.parse(process.env.MERGE_PARENTS), prNumber: Number(process.env.PR_NUMBER) });
          console.log(JSON.stringify(result, null, 2)); process.exitCode = result.decision === 'BINDING_PASS' ? 0 : 1;
          "@
          $script | Set-Content root-maintenance-bind.mjs
          $env:MERGE_TREE = $tree
          $env:MERGE_PARENTS = $parents
          node root-maintenance-bind.mjs | Tee-Object -FilePath nightwatch-protected-binding-receipt.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: nightwatch-protected-binding-receipt
          path: nightwatch-protected-binding-receipt.json
          retention-days: 14
