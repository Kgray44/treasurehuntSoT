name: Sounding Line authoritative

on:
  # Heavyweight authority is an explicit finalization action for one qualified,
  # frozen candidate. Ordinary development pushes and PR synchronization never
  # invoke this workflow.
  workflow_dispatch:
    inputs:
      gate:
        description: Governed gate to plan and finalize
        required: true
        type: choice
        default: mainline
        options: [mainline, release-candidate]
      candidate_sha:
        description: Exact 40-character head SHA of the frozen candidate ref
        required: true
        type: string
      candidate_ref:
        description: Exact refs/heads/... ref resolving to the frozen candidate SHA (required for candidate mode)
        required: false
        type: string
      pr_number:
        description: Pull request number for a future protected-merge binding envelope
        required: false
        type: string
      base_sha:
        description: Exact 40-character protected base SHA qualified with the candidate
        required: false
        type: string
      authority_mode:
        description: Current protected-main authority, ordinary frozen candidate qualification, or the historical v1.3 cutover
        required: true
        type: choice
        default: current
        options: [current, candidate, v13-cutover]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Candidate runs are independently source-bound. Do not serialize ordinary
  # frozen candidates merely because every dispatch is trusted-main hosted.
  group: sounding-line-authoritative-${{ github.workflow }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Sounding Line / Plan
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.gate.outputs.value }}
      authorityMode: ${{ steps.gate.outputs.authorityMode }}
      qualifiedBaseSha: ${{ steps.base.outputs.value }}
      parallel0: ${{ steps.matrix.outputs.parallel0 }}
      parallel1: ${{ steps.matrix.outputs.parallel1 }}
      parallel2: ${{ steps.matrix.outputs.parallel2 }}
      parallel3: ${{ steps.matrix.outputs.parallel3 }}
      parallel4: ${{ steps.matrix.outputs.parallel4 }}
      parallel5: ${{ steps.matrix.outputs.parallel5 }}
      exclusive0: ${{ steps.matrix.outputs.exclusive0 }}
      exclusive1: ${{ steps.matrix.outputs.exclusive1 }}
      exclusive2: ${{ steps.matrix.outputs.exclusive2 }}
      exclusive3: ${{ steps.matrix.outputs.exclusive3 }}
      exclusive4: ${{ steps.matrix.outputs.exclusive4 }}
      exclusive5: ${{ steps.matrix.outputs.exclusive5 }}
      exclusive0Present: ${{ steps.matrix.outputs.exclusive0Present }}
      exclusive1Present: ${{ steps.matrix.outputs.exclusive1Present }}
      exclusive2Present: ${{ steps.matrix.outputs.exclusive2Present }}
      exclusive3Present: ${{ steps.matrix.outputs.exclusive3Present }}
      exclusive4Present: ${{ steps.matrix.outputs.exclusive4Present }}
      exclusive5Present: ${{ steps.matrix.outputs.exclusive5Present }}
    steps:
      - id: gate
        shell: pwsh
        env:
          SOUNDING_LINE_GATE: ${{ inputs.gate }}
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          SOUNDING_LINE_DISPATCHED_SHA: ${{ github.sha }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ inputs.authority_mode }}
        run: |
          $gate = $env:SOUNDING_LINE_GATE
          if ($gate -notin @('mainline', 'release-candidate')) { throw "SOUNDING_LINE_GATE_INVALID" }
          $authorityMode = $env:SOUNDING_LINE_AUTHORITY_MODE
          if ($authorityMode -notin @('current', 'candidate', 'v13-cutover')) { throw "SOUNDING_LINE_AUTHORITY_MODE_INVALID" }
          if ($authorityMode -eq 'v13-cutover' -and $gate -ne 'mainline') { throw "SOUNDING_LINE_V13_CUTOVER_MAINLINE_ONLY" }
          $candidateSha = $env:SOUNDING_LINE_CANDIDATE_SHA
          $dispatchedSha = $env:SOUNDING_LINE_DISPATCHED_SHA
          if ($candidateSha -notmatch '^[0-9a-f]{40}$') { throw "SOUNDING_LINE_FROZEN_CANDIDATE_SHA_INVALID" }
          if ($authorityMode -ne 'candidate' -and $candidateSha -ne $dispatchedSha) { throw "SOUNDING_LINE_FROZEN_CANDIDATE_SHA_MISMATCH" }
          if ($authorityMode -eq 'candidate' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw "SOUNDING_LINE_CANDIDATE_TRUSTED_MAIN_WORKFLOW_REQUIRED" }
          if ($authorityMode -eq 'candidate' -and $gate -ne 'mainline') { throw "SOUNDING_LINE_CANDIDATE_MAINLINE_ONLY" }
          $candidateRef = $env:SOUNDING_LINE_CANDIDATE_REF
          if ($authorityMode -eq 'candidate' -and $candidateRef -notmatch '^refs/heads/[A-Za-z0-9._/-]+$') { throw "SOUNDING_LINE_CANDIDATE_REF_INVALID" }
          $prNumber = $env:SOUNDING_LINE_PR_NUMBER
          $baseSha = $env:SOUNDING_LINE_BASE_SHA
          # CURRENT protected-main verification deliberately has no PR envelope, but
          # still binds its qualified base. A PR envelope, when supplied, must bind
          # its base; v13 cutover continues to require both values below.
          if ($prNumber -and -not $baseSha) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_BASE_REQUIRED" }
          if ($authorityMode -eq 'v13-cutover' -and (-not $prNumber -or -not $baseSha)) { throw "SOUNDING_LINE_V13_CUTOVER_ACCEPTANCE_ENVELOPE_REQUIRED" }
          if ($authorityMode -eq 'candidate' -and (-not $prNumber -or -not $baseSha)) { throw "SOUNDING_LINE_CANDIDATE_ACCEPTANCE_ENVELOPE_REQUIRED" }
          if ($prNumber -and ($prNumber -notmatch '^[1-9][0-9]*$')) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_INVALID" }
          if ($baseSha -and ($baseSha -notmatch '^[0-9a-f]{40}$')) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_BASE_SHA_INVALID" }
          "value=$gate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "authorityMode=$(if ($authorityMode -eq 'v13-cutover') { 'V13_CUTOVER' } elseif ($authorityMode -eq 'candidate') { 'V14_CANDIDATE' } else { 'CURRENT' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.candidate_sha }}", fetch-depth: 0 }
      - id: base
        shell: pwsh
        env:
          SOUNDING_LINE_REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          $baseSha = $env:SOUNDING_LINE_REQUESTED_BASE_SHA
          $authority = Get-Content -Raw 'testing/sounding-line-authority.json' | ConvertFrom-Json
          if (-not $baseSha -and $authority.currentAuthorityVersion -eq '1.4') {
            $baseSha = (git rev-parse "$env:GITHUB_SHA^").Trim()
          }
          if ($authority.currentAuthorityVersion -eq '1.4' -and $baseSha -notmatch '^[0-9a-f]{40}$') {
            throw 'SOUNDING_LINE_V14_CURRENT_BASE_REQUIRED'
          }
          "value=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify frozen candidate base metadata
        if: ${{ inputs.pr_number != '' }}
        shell: pwsh
        env:
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.base.outputs.value }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ inputs.authority_mode }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git cat-file -e "$env:SOUNDING_LINE_CANDIDATE_SHA^{commit}"
          git cat-file -e "$env:SOUNDING_LINE_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$env:SOUNDING_LINE_BASE_SHA" "$env:SOUNDING_LINE_CANDIDATE_SHA"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls/$env:SOUNDING_LINE_PR_NUMBER"
          if ($pr.head.sha -ne $env:SOUNDING_LINE_CANDIDATE_SHA) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_HEAD_MISMATCH" }
          if ($pr.base.sha -ne $env:SOUNDING_LINE_BASE_SHA) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_BASE_MISMATCH" }
          if ($env:SOUNDING_LINE_AUTHORITY_MODE -eq 'candidate') {
            $expectedRef = "refs/heads/$($pr.head.ref)"
            if ($env:SOUNDING_LINE_CANDIDATE_REF -ne $expectedRef) { throw "SOUNDING_LINE_CANDIDATE_REF_PR_MISMATCH" }
            $resolved = @(git ls-remote origin $env:SOUNDING_LINE_CANDIDATE_REF)
            if ($resolved.Count -ne 1 -or -not $resolved[0].StartsWith("$env:SOUNDING_LINE_CANDIDATE_SHA`t")) { throw "SOUNDING_LINE_CANDIDATE_REF_HEAD_MISMATCH" }
          }
      - name: Enforce trusted ordinary-candidate boundary
        if: ${{ inputs.authority_mode == 'candidate' }}
        shell: pwsh
        env:
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.base.outputs.value }}
        run: |
          git show "$env:SOUNDING_LINE_BASE_SHA`:testing/verification-maintenance-policy.json" > trusted-maintenance-policy.json
          $policy = Get-Content -Raw trusted-maintenance-policy.json | ConvertFrom-Json
          $changed = @(git diff --name-only --no-renames --no-ext-diff $env:SOUNDING_LINE_BASE_SHA $env:SOUNDING_LINE_CANDIDATE_SHA | Sort-Object)
          function Test-TrustedGlob([string]$file, [string]$glob) {
            $pattern = '^' + [regex]::Escape($glob).Replace('\*\*', '.*').Replace('\*', '[^/]*') + '$'
            return $file -match $pattern
          }
          $authority = @($changed | Where-Object { $file = $_; @($policy.authorityChangePathGlobs | Where-Object { Test-TrustedGlob $file $_ }).Count -gt 0 })
          $unknown = @($changed | Where-Object { $file = $_; @($policy.ordinaryCandidateEligiblePathGlobs | Where-Object { Test-TrustedGlob $file $_ }).Count -eq 0 })
          if ($authority.Count -gt 0) { throw "SOUNDING_LINE_ORDINARY_CANDIDATE_AUTHORITY_CHANGE_REJECTED:$($authority -join ',')" }
          if ($unknown.Count -gt 0) { throw "SOUNDING_LINE_ORDINARY_CANDIDATE_UNKNOWN_SCOPE_REJECTED:$($unknown -join ',')" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:policy
      # Registry discovery imports repository test modules. It needs the Prisma
      # client, but does not create, migrate, or seed a database.
      - run: npm run db:generate
      - run: node scripts/sounding-line/test-registry.mjs
      # P34 must be fully mapped and archived before any hosted browser worker
      # may receive a mainline plan.
      - run: node scripts/sounding-line/p34-retirement.mjs
      - env:
          SOUNDING_LINE_GATE: ${{ steps.gate.outputs.value }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.base.outputs.value }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ steps.gate.outputs.authorityMode }}
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node -e "import('./scripts/sounding-line/planner.mjs').then(async m=>console.log(JSON.stringify(await m.buildPlan({root:process.cwd(),gateId:process.env.SOUNDING_LINE_GATE,serial:false,sourceSha:process.env.SOUNDING_LINE_CANDIDATE_SHA,qualifiedBaseSha:process.env.SOUNDING_LINE_BASE_SHA,authorityMode:process.env.SOUNDING_LINE_AUTHORITY_MODE}),null,2)))" > sounding-line-plan.json
      - name: Seal immutable dependency layer
        shell: pwsh
        run: |
          $expiry = ([DateTimeOffset]::UtcNow).AddDays(14).ToString('o')
          New-Item -ItemType Directory -Path sounding-line-prepared-dependency -Force | Out-Null
          & node scripts/sounding-line/v14/prepared-layer-artifact.mjs publish --source node_modules --manifest sounding-line-prepared-dependency/dependency-manifest.json --producer "protected-authoritative-workflow:$env:GITHUB_RUN_ID" --expires-at $expiry
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_DEPENDENCY_LAYER_PUBLICATION_FAILED' }
          Move-Item -LiteralPath node_modules -Destination sounding-line-prepared-dependency/node_modules
      - id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content -Raw sounding-line-plan.json | ConvertFrom-Json
          $authority = Get-Content -Raw 'testing/sounding-line-authority.json' | ConvertFrom-Json
          $maximumWave = [int]$authority.hostedExecutionCapacity.maximumWave
          if ($maximumWave -lt 0) { throw "HOSTED_EXECUTION_WAVE_CAPACITY_INVALID" }
          $planMaximumWave = ($plan.nodes | Measure-Object -Property { $_.execution.wave } -Maximum).Maximum
          if ($planMaximumWave -gt $maximumWave) { throw "HOSTED_EXECUTION_WAVE_CAPACITY_EXCEEDED" }
          foreach ($wave in 0..$maximumWave) {
            foreach ($mode in @('parallel', 'exclusive')) {
              $nodes = @($plan.nodes | Where-Object { $_.execution.wave -eq $wave -and $_.execution.mode -eq $mode } | ForEach-Object { @{ suiteId = $_.id; emptyWave = $false } })
              # GitHub marks a caller that expands an empty reusable-workflow matrix as
              # skipped, which makes the enclosing authority run fail even when every
              # governed receipt and finalizer decision is clean. Represent an empty
              # exclusive lane by one explicit no-op worker instead. The reusable
              # worker emits no receipt for that marker, so no governed suite is
              # invented and the finalizer still closes only real plan evidence.
              if ($mode -eq 'exclusive' -and $nodes.Count -eq 0) {
                $nodes = @(@{ suiteId = '__SOUNDING_LINE_EMPTY_EXCLUSIVE_WAVE__'; emptyWave = $true })
              }
              $matrix = @{ include = $nodes } | ConvertTo-Json -Compress
              "$mode$wave=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              if ($mode -eq 'exclusive') {
                $present = if ($nodes.Count -gt 0) { 'true' } else { 'false' }
                "exclusive$wave`Present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              }
            }
          }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with: { name: sounding-line-plan, path: sounding-line-plan.json, retention-days: 14 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-prepared-dependency
          path: |
            sounding-line-prepared-dependency
            !sounding-line-prepared-dependency/node_modules/.prisma/**
            !sounding-line-prepared-dependency/node_modules/@forever-treasure/bridgewatch/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  governed-parallel-wave-0:
    name: Sounding Line / Parallel wave 0
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel0) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  governed-exclusive-wave-0:
    name: Sounding Line / Exclusive wave 0
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive0) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  wave-0-complete:
    name: Sounding Line / Wave 0 barrier
    needs: [plan, governed-parallel-wave-0, governed-exclusive-wave-0]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-0.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-0.result }}
          PARALLEL_MATRIX: ${{ needs.plan.outputs.parallel0 }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive0 }}
        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelIntentionallyEmpty = $null -ne $parallelMatrix.include -and @($parallelMatrix.include).Count -eq 0
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success' -or ($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -in @('failure', 'skipped'))
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_0_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-1:
    name: Sounding Line / Parallel wave 1
    needs: [plan, wave-0-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-0-complete.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel1) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  governed-exclusive-wave-1:
    name: Sounding Line / Exclusive wave 1
    needs: [plan, wave-0-complete]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive1) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  wave-1-complete:
    name: Sounding Line / Wave 1 barrier
    needs: [plan, governed-parallel-wave-1, governed-exclusive-wave-1]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-1.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-1.result }}
          PARALLEL_MATRIX: ${{ needs.plan.outputs.parallel1 }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive1 }}
        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelIntentionallyEmpty = $null -ne $parallelMatrix.include -and @($parallelMatrix.include).Count -eq 0
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success' -or ($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -in @('failure', 'skipped'))
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_1_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-2:
    name: Sounding Line / Parallel wave 2
    needs: [plan, wave-1-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-1-complete.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel2) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  governed-exclusive-wave-2:
    name: Sounding Line / Exclusive wave 2
    needs: [plan, wave-1-complete]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive2) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  wave-2-complete:
    name: Sounding Line / Wave 2 barrier
    needs: [plan, governed-parallel-wave-2, governed-exclusive-wave-2]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-2.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-2.result }}
          PARALLEL_MATRIX: ${{ needs.plan.outputs.parallel2 }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive2 }}
        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelIntentionallyEmpty = $null -ne $parallelMatrix.include -and @($parallelMatrix.include).Count -eq 0
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success' -or ($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -in @('failure', 'skipped'))
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_2_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-3:
    name: Sounding Line / Parallel wave 3
    needs: [plan, wave-2-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-2-complete.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel3) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  governed-exclusive-wave-3:
    name: Sounding Line / Exclusive wave 3
    needs: [plan, wave-2-complete]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive3) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  wave-3-complete:
    name: Sounding Line / Wave 3 barrier
    needs: [plan, governed-parallel-wave-3, governed-exclusive-wave-3]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-3.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-3.result }}
          PARALLEL_MATRIX: ${{ needs.plan.outputs.parallel3 }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive3 }}
        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelIntentionallyEmpty = $null -ne $parallelMatrix.include -and @($parallelMatrix.include).Count -eq 0
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success' -or ($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -in @('failure', 'skipped'))
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_3_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-4:
    name: Sounding Line / Parallel wave 4
    needs: [plan, wave-3-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-3-complete.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel4) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  governed-exclusive-wave-4:
    name: Sounding Line / Exclusive wave 4
    needs: [plan, wave-3-complete]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive4) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  wave-4-complete:
    name: Sounding Line / Wave 4 barrier
    needs: [plan, governed-parallel-wave-4, governed-exclusive-wave-4]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-4.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-4.result }}
          PARALLEL_MATRIX: ${{ needs.plan.outputs.parallel4 }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive4 }}
        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelIntentionallyEmpty = $null -ne $parallelMatrix.include -and @($parallelMatrix.include).Count -eq 0
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success' -or ($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -in @('failure', 'skipped'))
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_4_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-5:
    name: Sounding Line / Parallel wave 5
    needs: [plan, wave-4-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-4-complete.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel5) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  governed-exclusive-wave-5:
    name: Sounding Line / Exclusive wave 5
    needs: [plan, wave-4-complete]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive5) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}

  wave-5-complete:
    name: Sounding Line / Wave 5 barrier
    needs: [plan, governed-parallel-wave-5, governed-exclusive-wave-5]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-5.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-5.result }}
          PARALLEL_MATRIX: ${{ needs.plan.outputs.parallel5 }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive5 }}
        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelIntentionallyEmpty = $null -ne $parallelMatrix.include -and @($parallelMatrix.include).Count -eq 0
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success' -or ($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -in @('failure', 'skipped'))
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_5_PREREQUISITES_INVALID'
          }

  finalizer:
    name: Sounding Line / ${{ needs.plan.outputs.gate == 'release-candidate' && 'Release Candidate Decision' || 'Mainline Decision' }}
    needs:
      [
        plan,
        governed-parallel-wave-0,
        governed-exclusive-wave-0,
        wave-0-complete,
        governed-parallel-wave-1,
        governed-exclusive-wave-1,
        wave-1-complete,
        governed-parallel-wave-2,
        governed-exclusive-wave-2,
        wave-2-complete,
        governed-parallel-wave-3,
        governed-exclusive-wave-3,
        wave-3-complete,
        governed-parallel-wave-4,
        governed-exclusive-wave-4,
        wave-4-complete,
        governed-parallel-wave-5,
        governed-exclusive-wave-5,
        wave-5-complete,
      ]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sounding-line-plan, path: sounding-line-plan }
      - continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: sounding-line-worker-evidence-*, path: sounding-line-worker-evidence, merge-multiple: false }
      - name: Finalizer decision
        env:
          SOUNDING_LINE_EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/sounding-line/finalize-ci.mjs sounding-line-plan/sounding-line-plan.json sounding-line-worker-evidence --out sounding-line-finalization.json
      - name: Seal qualified acceptance envelope
        if: ${{ inputs.pr_number != '' }}
        env:
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_RUN_ID: ${{ github.run_id }}
        run: node scripts/sounding-line/create-acceptance-envelope.mjs --plan sounding-line-plan/sounding-line-plan.json --finalization sounding-line-finalization.json --pr-number "$env:SOUNDING_LINE_PR_NUMBER" --base-sha "$env:SOUNDING_LINE_BASE_SHA" --run-id "$env:SOUNDING_LINE_RUN_ID" --out sounding-line-acceptance-envelope.json
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-finalization
          path: sounding-line-finalization.json
          retention-days: 14
      - if: ${{ inputs.pr_number != '' && success() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-acceptance-envelope
          path: sounding-line-acceptance-envelope.json
          retention-days: 14
