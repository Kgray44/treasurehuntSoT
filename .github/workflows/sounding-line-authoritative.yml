name: Sounding Line authoritative

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sounding-line-authoritative-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Sounding Line / Plan
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:policy
      - run: npm run db:generate
      - run: node scripts/sounding-line/test-registry.mjs
      # P34 must be fully mapped and archived before any hosted browser worker
      # may receive a mainline plan.
      - run: node scripts/sounding-line/p34-retirement.mjs
      - run: node -e "import('./scripts/sounding-line/planner.mjs').then(async m=>console.log(JSON.stringify(await m.buildPlan({root:process.cwd(),gateId:'mainline',serial:false,sourceSha:process.env.GITHUB_SHA}),null,2)))" > sounding-line-plan.json
      - id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content -Raw sounding-line-plan.json | ConvertFrom-Json
          $matrix = @{ include = @($plan.nodes | ForEach-Object { @{ suiteId = $_.id } }) } | ConvertTo-Json -Compress
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with: { name: sounding-line-plan, path: sounding-line-plan.json, retention-days: 14 }

  governed-mainline:
    name: Sounding Line / Governed workers
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sounding-line-plan, path: sounding-line-plan }
      - run: npm run db:generate
      # The browser runtime receives this disposable, seeded baseline only to
      # create its own nonce-bound copy. It is never the mutable test database.
      - run: npx prisma migrate deploy --schema prisma/schema.sqlite.prisma
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npm run db:seed
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npx playwright install chromium
      - id: governed-workers
        continue-on-error: true
        run: node scripts/sounding-line/authority.mjs mainline --execute-only --suite ${{ matrix.suiteId }} --receipt-out sounding-line-worker-evidence.json
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with: { name: sounding-line-worker-evidence-${{ matrix.suiteId }}, path: sounding-line-worker-evidence.json, retention-days: 14 }

  finalizer:
    name: Sounding Line / Mainline Decision
    needs: [plan, governed-mainline]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sounding-line-plan, path: sounding-line-plan }
      - continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: sounding-line-worker-evidence-*, path: sounding-line-worker-evidence, merge-multiple: false }
      - name: Finalizer decision
        run: node scripts/sounding-line/finalize-ci.mjs sounding-line-plan/sounding-line-plan.json sounding-line-worker-evidence/sounding-line-worker-evidence.json
