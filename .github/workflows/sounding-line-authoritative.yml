name: Sounding Line authoritative

on:
  # The protected main PR is the sole automatic authority path. Incremental
  # repair pushes remain nonauthoritative because no push trigger is present.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sounding-line-authoritative-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Sounding Line / Plan
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      parallel0: ${{ steps.matrix.outputs.parallel0 }}
      parallel1: ${{ steps.matrix.outputs.parallel1 }}
      parallel2: ${{ steps.matrix.outputs.parallel2 }}
      exclusive0: ${{ steps.matrix.outputs.exclusive0 }}
      exclusive1: ${{ steps.matrix.outputs.exclusive1 }}
      exclusive2: ${{ steps.matrix.outputs.exclusive2 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:policy
      - run: npm run db:generate
      - run: node scripts/sounding-line/test-registry.mjs
      # P34 must be fully mapped and archived before any hosted browser worker
      # may receive a mainline plan.
      - run: node scripts/sounding-line/p34-retirement.mjs
      - run: node -e "import('./scripts/sounding-line/planner.mjs').then(async m=>console.log(JSON.stringify(await m.buildPlan({root:process.cwd(),gateId:'mainline',serial:false,sourceSha:process.env.GITHUB_SHA}),null,2)))" > sounding-line-plan.json
      - id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content -Raw sounding-line-plan.json | ConvertFrom-Json
          if (($plan.nodes | Measure-Object -Property { $_.execution.wave } -Maximum).Maximum -gt 2) { throw "HOSTED_EXECUTION_WAVE_LIMIT_EXCEEDED" }
          foreach ($wave in 0..2) {
            foreach ($mode in @('parallel', 'exclusive')) {
              $nodes = @($plan.nodes | Where-Object { $_.execution.wave -eq $wave -and $_.execution.mode -eq $mode } | ForEach-Object { @{ suiteId = $_.id } })
              $matrix = @{ include = $nodes } | ConvertTo-Json -Compress
              "$mode$wave=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with: { name: sounding-line-plan, path: sounding-line-plan.json, retention-days: 14 }

  governed-parallel-wave-0:
    name: Sounding Line / Parallel wave 0
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel0) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}

  governed-exclusive-wave-0:
    name: Sounding Line / Exclusive wave 0
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive0) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}

  governed-parallel-wave-1:
    name: Sounding Line / Parallel wave 1
    needs: [plan, governed-parallel-wave-0, governed-exclusive-wave-0]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel1) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}

  governed-exclusive-wave-1:
    name: Sounding Line / Exclusive wave 1
    needs: [plan, governed-parallel-wave-0, governed-exclusive-wave-0]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive1) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}

  governed-parallel-wave-2:
    name: Sounding Line / Parallel wave 2
    needs: [plan, governed-parallel-wave-1, governed-exclusive-wave-1]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel2) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}

  governed-exclusive-wave-2:
    name: Sounding Line / Exclusive wave 2
    needs: [plan, governed-parallel-wave-1, governed-exclusive-wave-1]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive2) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}

  finalizer:
    name: Sounding Line / Mainline Decision
    needs:
      [
        plan,
        governed-parallel-wave-0,
        governed-exclusive-wave-0,
        governed-parallel-wave-1,
        governed-exclusive-wave-1,
        governed-parallel-wave-2,
        governed-exclusive-wave-2,
      ]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sounding-line-plan, path: sounding-line-plan }
      - continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: sounding-line-worker-evidence-*, path: sounding-line-worker-evidence, merge-multiple: false }
      - name: Finalizer decision
        run: node scripts/sounding-line/finalize-ci.mjs sounding-line-plan/sounding-line-plan.json sounding-line-worker-evidence
