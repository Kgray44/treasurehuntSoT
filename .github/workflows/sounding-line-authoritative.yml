name: Sounding Line authoritative

on:
  # Heavyweight authority is an explicit finalization action for one qualified,
  # frozen candidate. Ordinary development pushes and PR synchronization never
  # invoke this workflow.
  workflow_dispatch:
    inputs:
      gate:
        description: Governed gate to plan and finalize
        required: true
        type: choice
        default: mainline
        options: [mainline, release-candidate]
      candidate_sha:
        description: Exact 40-character head SHA of the frozen candidate ref
        required: true
        type: string
      pr_number:
        description: Pull request number for a future protected-merge binding envelope
        required: false
        type: string
      base_sha:
        description: Exact 40-character protected base SHA qualified with the candidate
        required: false
        type: string
      authority_mode:
        description: Current authority, or the one final v1.3 cutover acceptance before v1.4 activation
        required: true
        type: choice
        default: current
        options: [current, v13-cutover]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sounding-line-authoritative-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Sounding Line / Plan
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.gate.outputs.value }}
      authorityMode: ${{ steps.gate.outputs.authorityMode }}
      parallel0: ${{ steps.matrix.outputs.parallel0 }}
      parallel1: ${{ steps.matrix.outputs.parallel1 }}
      parallel2: ${{ steps.matrix.outputs.parallel2 }}
      exclusive0: ${{ steps.matrix.outputs.exclusive0 }}
      exclusive1: ${{ steps.matrix.outputs.exclusive1 }}
      exclusive2: ${{ steps.matrix.outputs.exclusive2 }}
      exclusive0Present: ${{ steps.matrix.outputs.exclusive0Present }}
      exclusive1Present: ${{ steps.matrix.outputs.exclusive1Present }}
      exclusive2Present: ${{ steps.matrix.outputs.exclusive2Present }}
    steps:
      - id: gate
        shell: pwsh
        env:
          SOUNDING_LINE_GATE: ${{ inputs.gate }}
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_DISPATCHED_SHA: ${{ github.sha }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ inputs.authority_mode }}
        run: |
          $gate = $env:SOUNDING_LINE_GATE
          if ($gate -notin @('mainline', 'release-candidate')) { throw "SOUNDING_LINE_GATE_INVALID" }
          $authorityMode = $env:SOUNDING_LINE_AUTHORITY_MODE
          if ($authorityMode -notin @('current', 'v13-cutover')) { throw "SOUNDING_LINE_AUTHORITY_MODE_INVALID" }
          if ($authorityMode -eq 'v13-cutover' -and $gate -ne 'mainline') { throw "SOUNDING_LINE_V13_CUTOVER_MAINLINE_ONLY" }
          $candidateSha = $env:SOUNDING_LINE_CANDIDATE_SHA
          $dispatchedSha = $env:SOUNDING_LINE_DISPATCHED_SHA
          if ($candidateSha -notmatch '^[0-9a-f]{40}$') { throw "SOUNDING_LINE_FROZEN_CANDIDATE_SHA_INVALID" }
          if ($candidateSha -ne $dispatchedSha) { throw "SOUNDING_LINE_FROZEN_CANDIDATE_SHA_MISMATCH" }
          $prNumber = $env:SOUNDING_LINE_PR_NUMBER
          $baseSha = $env:SOUNDING_LINE_BASE_SHA
          if (($prNumber -and -not $baseSha) -or (-not $prNumber -and $baseSha)) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_IDENTITY_PAIR_REQUIRED" }
          if ($prNumber -and ($prNumber -notmatch '^[1-9][0-9]*$')) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_INVALID" }
          if ($baseSha -and ($baseSha -notmatch '^[0-9a-f]{40}$')) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_BASE_SHA_INVALID" }
          "value=$gate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "authorityMode=$(if ($authorityMode -eq 'v13-cutover') { 'V13_CUTOVER' } else { 'CURRENT' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - name: Verify frozen candidate base metadata
        if: ${{ inputs.pr_number != '' }}
        shell: pwsh
        env:
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git cat-file -e "$env:SOUNDING_LINE_CANDIDATE_SHA^{commit}"
          git cat-file -e "$env:SOUNDING_LINE_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$env:SOUNDING_LINE_BASE_SHA" "$env:SOUNDING_LINE_CANDIDATE_SHA"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls/$env:SOUNDING_LINE_PR_NUMBER"
          if ($pr.head.sha -ne $env:SOUNDING_LINE_CANDIDATE_SHA) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_HEAD_MISMATCH" }
          if ($pr.base.sha -ne $env:SOUNDING_LINE_BASE_SHA) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_BASE_MISMATCH" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:policy
      # Registry discovery imports repository test modules. It needs the Prisma
      # client, but does not create, migrate, or seed a database.
      - run: npm run db:generate
      - run: node scripts/sounding-line/test-registry.mjs
      # P34 must be fully mapped and archived before any hosted browser worker
      # may receive a mainline plan.
      - run: node scripts/sounding-line/p34-retirement.mjs
      - env:
          SOUNDING_LINE_GATE: ${{ steps.gate.outputs.value }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ steps.gate.outputs.authorityMode }}
        run: node -e "import('./scripts/sounding-line/planner.mjs').then(async m=>console.log(JSON.stringify(await m.buildPlan({root:process.cwd(),gateId:process.env.SOUNDING_LINE_GATE,serial:false,sourceSha:process.env.GITHUB_SHA,qualifiedBaseSha:process.env.SOUNDING_LINE_BASE_SHA,authorityMode:process.env.SOUNDING_LINE_AUTHORITY_MODE}),null,2)))" > sounding-line-plan.json
      - id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content -Raw sounding-line-plan.json | ConvertFrom-Json
          if (($plan.nodes | Measure-Object -Property { $_.execution.wave } -Maximum).Maximum -gt 2) { throw "HOSTED_EXECUTION_WAVE_LIMIT_EXCEEDED" }
          foreach ($wave in 0..2) {
            foreach ($mode in @('parallel', 'exclusive')) {
              $nodes = @($plan.nodes | Where-Object { $_.execution.wave -eq $wave -and $_.execution.mode -eq $mode } | ForEach-Object { @{ suiteId = $_.id } })
              $matrix = @{ include = $nodes } | ConvertTo-Json -Compress
              "$mode$wave=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              if ($mode -eq 'exclusive') {
                $present = if ($nodes.Count -gt 0) { 'true' } else { 'false' }
                "exclusive$wave`Present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              }
            }
          }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with: { name: sounding-line-plan, path: sounding-line-plan.json, retention-days: 14 }

  governed-parallel-wave-0:
    name: Sounding Line / Parallel wave 0
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel0) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}

  governed-exclusive-wave-0:
    name: Sounding Line / Exclusive wave 0
    needs: plan
    if: ${{ needs.plan.outputs.exclusive0Present == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive0) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}

  wave-0-complete:
    name: Sounding Line / Wave 0 barrier
    needs: [plan, governed-parallel-wave-0, governed-exclusive-wave-0]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-0.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-0.result }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive0 }}
        run: |
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or $env:PARALLEL_RESULT -ne 'success' -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_0_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-1:
    name: Sounding Line / Parallel wave 1
    needs: [plan, wave-0-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-0-complete.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel1) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}

  governed-exclusive-wave-1:
    name: Sounding Line / Exclusive wave 1
    needs: [plan, wave-0-complete]
    if: ${{ always() && needs.plan.outputs.exclusive1Present == 'true' && needs.plan.result == 'success' && needs.wave-0-complete.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive1) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}

  wave-1-complete:
    name: Sounding Line / Wave 1 barrier
    needs: [plan, governed-parallel-wave-1, governed-exclusive-wave-1]
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-1.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-1.result }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive1 }}
        run: |
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $exclusiveIntentionallyEmpty = $null -ne $exclusiveMatrix.include -and @($exclusiveMatrix.include).Count -eq 0
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success' -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -in @('failure', 'skipped'))
          if ($env:PLAN_RESULT -ne 'success' -or $env:PARALLEL_RESULT -ne 'success' -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_1_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-2:
    name: Sounding Line / Parallel wave 2
    needs: [plan, wave-1-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-1-complete.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel2) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}

  governed-exclusive-wave-2:
    name: Sounding Line / Exclusive wave 2
    needs: [plan, wave-1-complete]
    if: ${{ always() && needs.plan.outputs.exclusive2Present == 'true' && needs.plan.result == 'success' && needs.wave-1-complete.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive2) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      gate: ${{ needs.plan.outputs.gate }}

  finalizer:
    name: Sounding Line / ${{ needs.plan.outputs.gate == 'release-candidate' && 'Release Candidate Decision' || 'Mainline Decision' }}
    needs:
      [
        plan,
        governed-parallel-wave-0,
        governed-exclusive-wave-0,
        wave-0-complete,
        governed-parallel-wave-1,
        governed-exclusive-wave-1,
        wave-1-complete,
        governed-parallel-wave-2,
        governed-exclusive-wave-2,
      ]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sounding-line-plan, path: sounding-line-plan }
      - continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: sounding-line-worker-evidence-*, path: sounding-line-worker-evidence, merge-multiple: false }
      - name: Finalizer decision
        run: node scripts/sounding-line/finalize-ci.mjs sounding-line-plan/sounding-line-plan.json sounding-line-worker-evidence --out sounding-line-finalization.json
      - name: Seal qualified acceptance envelope
        if: ${{ inputs.pr_number != '' }}
        env:
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_RUN_ID: ${{ github.run_id }}
        run: node scripts/sounding-line/create-acceptance-envelope.mjs --plan sounding-line-plan/sounding-line-plan.json --finalization sounding-line-finalization.json --pr-number "$env:SOUNDING_LINE_PR_NUMBER" --base-sha "$env:SOUNDING_LINE_BASE_SHA" --run-id "$env:SOUNDING_LINE_RUN_ID" --out sounding-line-acceptance-envelope.json
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-finalization
          path: sounding-line-finalization.json
          retention-days: 14
      - if: ${{ inputs.pr_number != '' && success() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-acceptance-envelope
          path: sounding-line-acceptance-envelope.json
          retention-days: 14
