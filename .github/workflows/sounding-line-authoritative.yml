        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelNodes = @($parallelMatrix.include)
          $exclusiveNodes = @($exclusiveMatrix.include)
          if ($null -eq $parallelMatrix -or $null -eq $exclusiveMatrix -or $null -eq $parallelMatrix.include -or $null -eq $exclusiveMatrix.include -or @($parallelNodes | Where-Object { $null -eq $_ }).Count -ne 0 -or @($exclusiveNodes | Where-Object { $null -eq $_ }).Count -ne 0) { throw 'SOUNDING_LINE_WAVE_MATRIX_INVALID' }
          $parallelMarkers = @($parallelNodes | Where-Object { $_.suiteId -eq '__SOUNDING_LINE_EMPTY_WAVE__' -and $_.emptyWave -eq $true })
          $exclusiveMarkers = @($exclusiveNodes | Where-Object { $_.suiteId -eq '__SOUNDING_LINE_EMPTY_WAVE__' -and $_.emptyWave -eq $true })
          if (($parallelMarkers.Count -gt 0 -and ($parallelMarkers.Count -ne 1 -or $parallelMarkers.Count -ne $parallelNodes.Count)) -or ($exclusiveMarkers.Count -gt 0 -and ($exclusiveMarkers.Count -ne 1 -or $exclusiveMarkers.Count -ne $exclusiveNodes.Count))) {
            throw 'SOUNDING_LINE_EMPTY_MARKER_INVALID'
          }
          $parallelIntentionallyEmpty = $parallelMarkers.Count -eq 1
          $exclusiveIntentionallyEmpty = $exclusiveMarkers.Count -eq 1
          if (($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -ne 'success') -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -ne 'success')) {
            throw 'SOUNDING_LINE_EMPTY_MARKER_COMPLETION_INVALID'
          }
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success'
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success'
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_4_PREREQUISITES_INVALID'
          }

  governed-parallel-wave-5:
    name: Sounding Line / Parallel wave 5
    needs: [plan, wave-4-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-4-complete.result == 'success' && fromJSON(needs.plan.outputs.activeMaximumWave) >= 5 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.parallel5) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      suites_json: ${{ matrix.suiteIdsJson }}
      requires_browser: ${{ matrix.requiresBrowser }}
      browser_engine: ${{ matrix.browserEngine }}
      browser_test_ids_by_suite_json: ${{ matrix.browserTestIdsBySuiteJson }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}
      candidate_ref: ${{ inputs.candidate_ref }}

  governed-exclusive-wave-5:
    name: Sounding Line / Exclusive wave 5
    needs: [plan, wave-4-complete]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-4-complete.result == 'success' && fromJSON(needs.plan.outputs.activeMaximumWave) >= 5 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.exclusive5) }}
    uses: ./.github/workflows/sounding-line-governed-worker.yml
    with:
      suite: ${{ matrix.suiteId }}
      suites_json: ${{ matrix.suiteIdsJson }}
      requires_browser: ${{ matrix.requiresBrowser }}
      browser_engine: ${{ matrix.browserEngine }}
      browser_test_ids_by_suite_json: ${{ matrix.browserTestIdsBySuiteJson }}
      empty_wave: ${{ matrix.emptyWave }}
      gate: ${{ needs.plan.outputs.gate }}
      candidate_sha: ${{ inputs.candidate_sha }}
      candidate_ref: ${{ inputs.candidate_ref }}

  wave-5-complete:
    name: Sounding Line / Wave 5 barrier
    needs: [plan, governed-parallel-wave-5, governed-exclusive-wave-5]
    if: ${{ always() && needs.plan.result == 'success' && needs.wave-4-complete.result == 'success' && fromJSON(needs.plan.outputs.activeMaximumWave) >= 5 }}
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PARALLEL_RESULT: ${{ needs.governed-parallel-wave-5.result }}
          EXCLUSIVE_RESULT: ${{ needs.governed-exclusive-wave-5.result }}
          PARALLEL_MATRIX: ${{ needs.plan.outputs.parallel5 }}
          EXCLUSIVE_MATRIX: ${{ needs.plan.outputs.exclusive5 }}
        run: |
          $parallelMatrix = $env:PARALLEL_MATRIX | ConvertFrom-Json
          $exclusiveMatrix = $env:EXCLUSIVE_MATRIX | ConvertFrom-Json
          $parallelNodes = @($parallelMatrix.include)
          $exclusiveNodes = @($exclusiveMatrix.include)
          if ($null -eq $parallelMatrix -or $null -eq $exclusiveMatrix -or $null -eq $parallelMatrix.include -or $null -eq $exclusiveMatrix.include -or @($parallelNodes | Where-Object { $null -eq $_ }).Count -ne 0 -or @($exclusiveNodes | Where-Object { $null -eq $_ }).Count -ne 0) { throw 'SOUNDING_LINE_WAVE_MATRIX_INVALID' }
          $parallelMarkers = @($parallelNodes | Where-Object { $_.suiteId -eq '__SOUNDING_LINE_EMPTY_WAVE__' -and $_.emptyWave -eq $true })
          $exclusiveMarkers = @($exclusiveNodes | Where-Object { $_.suiteId -eq '__SOUNDING_LINE_EMPTY_WAVE__' -and $_.emptyWave -eq $true })
          if (($parallelMarkers.Count -gt 0 -and ($parallelMarkers.Count -ne 1 -or $parallelMarkers.Count -ne $parallelNodes.Count)) -or ($exclusiveMarkers.Count -gt 0 -and ($exclusiveMarkers.Count -ne 1 -or $exclusiveMarkers.Count -ne $exclusiveNodes.Count))) {
            throw 'SOUNDING_LINE_EMPTY_MARKER_INVALID'
          }
          $parallelIntentionallyEmpty = $parallelMarkers.Count -eq 1
          $exclusiveIntentionallyEmpty = $exclusiveMarkers.Count -eq 1
          if (($parallelIntentionallyEmpty -and $env:PARALLEL_RESULT -ne 'success') -or ($exclusiveIntentionallyEmpty -and $env:EXCLUSIVE_RESULT -ne 'success')) {
            throw 'SOUNDING_LINE_EMPTY_MARKER_COMPLETION_INVALID'
          }
          $parallelAccepted = $env:PARALLEL_RESULT -eq 'success'
          $exclusiveAccepted = $env:EXCLUSIVE_RESULT -eq 'success'
          if ($env:PLAN_RESULT -ne 'success' -or -not $parallelAccepted -or -not $exclusiveAccepted) {
            throw 'SOUNDING_LINE_WAVE_5_PREREQUISITES_INVALID'
          }

  finalizer:
    name: Sounding Line / ${{ needs.plan.outputs.gate == 'release-candidate' && 'Release Candidate Decision' || 'Mainline Decision' }}
    needs:
      [
        plan,
        governed-parallel-wave-0,
        governed-exclusive-wave-0,
        wave-0-complete,
        governed-parallel-wave-1,
        governed-exclusive-wave-1,
        wave-1-complete,
        governed-parallel-wave-2,
        governed-exclusive-wave-2,
        wave-2-complete,
        governed-parallel-wave-3,
        governed-exclusive-wave-3,
        wave-3-complete,
        governed-parallel-wave-4,
        governed-exclusive-wave-4,
        wave-4-complete,
        governed-parallel-wave-5,
        governed-exclusive-wave-5,
        wave-5-complete,
      ]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - name: Verify active-wave closure before finalization
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          ACTIVE_MAXIMUM_WAVE: ${{ needs.plan.outputs.activeMaximumWave }}
          WAVE_0_RESULT: ${{ needs.wave-0-complete.result }}
          WAVE_1_RESULT: ${{ needs.wave-1-complete.result }}
          WAVE_2_RESULT: ${{ needs.wave-2-complete.result }}
          WAVE_3_RESULT: ${{ needs.wave-3-complete.result }}
          WAVE_4_RESULT: ${{ needs.wave-4-complete.result }}
          WAVE_5_RESULT: ${{ needs.wave-5-complete.result }}
        run: |
          if ($env:PLAN_RESULT -ne 'success') { throw 'SOUNDING_LINE_FINALIZER_PLAN_PREREQUISITES_INVALID' }
          $maximumWave = [int]$env:ACTIVE_MAXIMUM_WAVE
          if ($maximumWave -lt 0 -or $maximumWave -gt 5) { throw 'SOUNDING_LINE_FINALIZER_ACTIVE_WAVE_INVALID' }
          $barriers = @($env:WAVE_0_RESULT, $env:WAVE_1_RESULT, $env:WAVE_2_RESULT, $env:WAVE_3_RESULT, $env:WAVE_4_RESULT, $env:WAVE_5_RESULT)
          for ($wave = 0; $wave -le $maximumWave; $wave += 1) {
            if ($barriers[$wave] -ne 'success') { throw "SOUNDING_LINE_FINALIZER_WAVE_$wave`_PREREQUISITES_INVALID" }
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: sounding-line-plan, path: sounding-line-plan }
      - continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: sounding-line-worker-evidence-*, path: sounding-line-worker-evidence, merge-multiple: false }
      - name: Finalizer decision
        env:
          SOUNDING_LINE_EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/sounding-line/finalize-ci.mjs sounding-line-plan/sounding-line-plan.json sounding-line-worker-evidence --out sounding-line-finalization.json
      - name: Seal qualified acceptance envelope
        if: ${{ inputs.pr_number != '' }}
        env:
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_RUN_ID: ${{ github.run_id }}
        run: node scripts/sounding-line/create-acceptance-envelope.mjs --plan sounding-line-plan/sounding-line-plan.json --finalization sounding-line-finalization.json --pr-number "$env:SOUNDING_LINE_PR_NUMBER" --base-sha "$env:SOUNDING_LINE_BASE_SHA" --run-id "$env:SOUNDING_LINE_RUN_ID" --out sounding-line-acceptance-envelope.json
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-finalization
          path: sounding-line-finalization.json
          retention-days: 14
      - if: ${{ inputs.pr_number != '' && success() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-acceptance-envelope
          path: sounding-line-acceptance-envelope.json
          retention-days: 14
