name: Sounding Line authoritative
run-name: Sounding Line authoritative ${{ inputs.nightwatch_dispatch_key || github.run_id }}

on:
  # Heavyweight authority is an explicit finalization action for one qualified,
  # frozen candidate. Ordinary development pushes and PR synchronization never
  # invoke this workflow.
  workflow_dispatch:
    inputs:
      gate:
        description: Governed gate to plan and finalize
        required: true
        type: choice
        default: mainline
        options: [mainline, release-candidate]
      candidate_sha:
        description: Exact 40-character head SHA of the frozen candidate ref
        required: true
        type: string
      candidate_ref:
        description: Exact refs/heads/... ref resolving to the frozen candidate SHA (required for candidate mode)
        required: false
        type: string
      pr_number:
        description: Pull request number for a future protected-merge binding envelope
        required: false
        type: string
      base_sha:
        description: Exact 40-character protected base SHA qualified with the candidate
        required: false
        type: string
      authority_mode:
        description: Current protected-main authority, ordinary frozen candidate qualification, or the historical v1.3 cutover
        required: true
        type: choice
        default: current
        options: [current, candidate, v13-cutover]
      baseline_run_id:
        description: Exact successful Nightwatch Baseline Certification run for the qualified protected base (required for candidate mode)
        required: false
        type: string
      nightwatch_dispatch_key:
        description: Durable Nightwatch dispatch key for restart-safe controller rediscovery
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Candidate runs are independently source-bound. Do not serialize ordinary
  # frozen candidates merely because every dispatch is trusted-main hosted.
  group: sounding-line-authoritative-${{ github.workflow }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Sounding Line / Plan
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.gate.outputs.value }}
      authorityMode: ${{ steps.gate.outputs.authorityMode }}
      qualifiedBaseSha: ${{ steps.base.outputs.value }}
      activeMaximumWave: ${{ steps.matrix.outputs.activeMaximumWave }}
      dependencyCacheKey: ${{ steps.dependency-identity.outputs.key }}
      parallel0: ${{ steps.matrix.outputs.parallel0 }}
      parallel1: ${{ steps.matrix.outputs.parallel1 }}
      parallel2: ${{ steps.matrix.outputs.parallel2 }}
      parallel3: ${{ steps.matrix.outputs.parallel3 }}
      parallel4: ${{ steps.matrix.outputs.parallel4 }}
      parallel5: ${{ steps.matrix.outputs.parallel5 }}
      exclusive0: ${{ steps.matrix.outputs.exclusive0 }}
      exclusive1: ${{ steps.matrix.outputs.exclusive1 }}
      exclusive2: ${{ steps.matrix.outputs.exclusive2 }}
      exclusive3: ${{ steps.matrix.outputs.exclusive3 }}
      exclusive4: ${{ steps.matrix.outputs.exclusive4 }}
      exclusive5: ${{ steps.matrix.outputs.exclusive5 }}
      exclusive0Present: ${{ steps.matrix.outputs.exclusive0Present }}
      exclusive1Present: ${{ steps.matrix.outputs.exclusive1Present }}
      exclusive2Present: ${{ steps.matrix.outputs.exclusive2Present }}
      exclusive3Present: ${{ steps.matrix.outputs.exclusive3Present }}
      exclusive4Present: ${{ steps.matrix.outputs.exclusive4Present }}
      exclusive5Present: ${{ steps.matrix.outputs.exclusive5Present }}
    steps:
      - id: gate
        shell: pwsh
        env:
          SOUNDING_LINE_GATE: ${{ inputs.gate }}
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          SOUNDING_LINE_DISPATCHED_SHA: ${{ github.sha }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ inputs.authority_mode }}
        run: |
          $gate = $env:SOUNDING_LINE_GATE
          if ($gate -notin @('mainline', 'release-candidate')) { throw "SOUNDING_LINE_GATE_INVALID" }
          $authorityMode = $env:SOUNDING_LINE_AUTHORITY_MODE
          if ($authorityMode -notin @('current', 'candidate', 'v13-cutover')) { throw "SOUNDING_LINE_AUTHORITY_MODE_INVALID" }
          if ($authorityMode -eq 'v13-cutover' -and $gate -ne 'mainline') { throw "SOUNDING_LINE_V13_CUTOVER_MAINLINE_ONLY" }
          $candidateSha = $env:SOUNDING_LINE_CANDIDATE_SHA
          $dispatchedSha = $env:SOUNDING_LINE_DISPATCHED_SHA
          if ($candidateSha -notmatch '^[0-9a-f]{40}$') { throw "SOUNDING_LINE_FROZEN_CANDIDATE_SHA_INVALID" }
          if ($authorityMode -ne 'candidate' -and $candidateSha -ne $dispatchedSha) { throw "SOUNDING_LINE_FROZEN_CANDIDATE_SHA_MISMATCH" }
          if ($authorityMode -eq 'candidate' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw "SOUNDING_LINE_CANDIDATE_TRUSTED_MAIN_WORKFLOW_REQUIRED" }
          if ($authorityMode -eq 'candidate' -and $gate -ne 'mainline') { throw "SOUNDING_LINE_CANDIDATE_MAINLINE_ONLY" }
          $candidateRef = $env:SOUNDING_LINE_CANDIDATE_REF
          if ($authorityMode -eq 'candidate' -and $candidateRef -notmatch '^refs/heads/[A-Za-z0-9._/-]+$') { throw "SOUNDING_LINE_CANDIDATE_REF_INVALID" }
          $prNumber = $env:SOUNDING_LINE_PR_NUMBER
          $baseSha = $env:SOUNDING_LINE_BASE_SHA
          # CURRENT protected-main verification deliberately has no PR envelope, but
          # still binds its qualified base. A PR envelope, when supplied, must bind
          # its base; v13 cutover continues to require both values below.
          if ($prNumber -and -not $baseSha) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_BASE_REQUIRED" }
          if ($authorityMode -eq 'v13-cutover' -and (-not $prNumber -or -not $baseSha)) { throw "SOUNDING_LINE_V13_CUTOVER_ACCEPTANCE_ENVELOPE_REQUIRED" }
          if ($authorityMode -eq 'candidate' -and (-not $prNumber -or -not $baseSha)) { throw "SOUNDING_LINE_CANDIDATE_ACCEPTANCE_ENVELOPE_REQUIRED" }
          if ($prNumber -and ($prNumber -notmatch '^[1-9][0-9]*$')) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_INVALID" }
          if ($baseSha -and ($baseSha -notmatch '^[0-9a-f]{40}$')) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_BASE_SHA_INVALID" }
          "value=$gate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "authorityMode=$(if ($authorityMode -eq 'v13-cutover') { 'V13_CUTOVER' } elseif ($authorityMode -eq 'candidate') { 'V14_CANDIDATE' } else { 'CURRENT' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # Plan proves an arbitrary frozen candidate/base ancestry and exact
        # changed interval. Retain complete history here; generic shallow
        # depth cannot prove an unbounded qualified interval fail-closed.
        with: { ref: "${{ inputs.candidate_sha }}", fetch-depth: 0 }
      - id: base
        shell: pwsh
        env:
          SOUNDING_LINE_REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          $baseSha = $env:SOUNDING_LINE_REQUESTED_BASE_SHA
          $authority = Get-Content -Raw 'testing/sounding-line-authority.json' | ConvertFrom-Json
          if (-not $baseSha -and $authority.currentAuthorityVersion -eq '1.4') {
            $baseSha = (git rev-parse "$env:GITHUB_SHA^").Trim()
          }
          if ($authority.currentAuthorityVersion -eq '1.4' -and $baseSha -notmatch '^[0-9a-f]{40}$') {
            throw 'SOUNDING_LINE_V14_CURRENT_BASE_REQUIRED'
          }
          "value=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify frozen candidate base metadata
        if: ${{ inputs.pr_number != '' }}
        shell: pwsh
        env:
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.base.outputs.value }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ inputs.authority_mode }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git cat-file -e "$env:SOUNDING_LINE_CANDIDATE_SHA^{commit}"
          git cat-file -e "$env:SOUNDING_LINE_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$env:SOUNDING_LINE_BASE_SHA" "$env:SOUNDING_LINE_CANDIDATE_SHA"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls/$env:SOUNDING_LINE_PR_NUMBER"
          if ($pr.head.sha -ne $env:SOUNDING_LINE_CANDIDATE_SHA) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_HEAD_MISMATCH" }
          if ($pr.base.sha -ne $env:SOUNDING_LINE_BASE_SHA) { throw "SOUNDING_LINE_ACCEPTANCE_ENVELOPE_PR_BASE_MISMATCH" }
          if ($env:SOUNDING_LINE_AUTHORITY_MODE -eq 'candidate') {
            $expectedRef = "refs/heads/$($pr.head.ref)"
            if ($env:SOUNDING_LINE_CANDIDATE_REF -ne $expectedRef) { throw "SOUNDING_LINE_CANDIDATE_REF_PR_MISMATCH" }
            $resolved = @(git ls-remote origin $env:SOUNDING_LINE_CANDIDATE_REF)
            if ($resolved.Count -ne 1 -or -not $resolved[0].StartsWith("$env:SOUNDING_LINE_CANDIDATE_SHA`t")) { throw "SOUNDING_LINE_CANDIDATE_REF_HEAD_MISMATCH" }
          }
      - name: Enforce trusted ordinary-candidate boundary
        if: ${{ inputs.authority_mode == 'candidate' }}
        shell: pwsh
        env:
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.base.outputs.value }}
        run: |
          git show "$env:SOUNDING_LINE_BASE_SHA`:testing/verification-maintenance-policy.json" > trusted-maintenance-policy.json
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_ORDINARY_CANDIDATE_TRUSTED_POLICY_UNAVAILABLE' }
          git show "$env:SOUNDING_LINE_BASE_SHA`:scripts/sounding-line/verification-maintenance.mjs" > trusted-verification-maintenance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_ORDINARY_CANDIDATE_TRUSTED_CLASSIFIER_UNAVAILABLE' }
          git show "$env:SOUNDING_LINE_BASE_SHA`:scripts/sounding-line/project-discovery.mjs" > project-discovery.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_ORDINARY_CANDIDATE_TRUSTED_PROJECT_DISCOVERY_UNAVAILABLE' }
          $changed = @(git diff --name-only --no-renames --no-ext-diff $env:SOUNDING_LINE_BASE_SHA $env:SOUNDING_LINE_CANDIDATE_SHA | Sort-Object)
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_ORDINARY_CANDIDATE_CHANGED_PATHS_UNAVAILABLE' }
          ConvertTo-Json -InputObject $changed -Compress | Set-Content -NoNewline ordinary-candidate-changed-paths.json
          node trusted-verification-maintenance.mjs ordinary --policy trusted-maintenance-policy.json --paths ordinary-candidate-changed-paths.json --trusted-base-sha $env:SOUNDING_LINE_BASE_SHA --candidate-sha $env:SOUNDING_LINE_CANDIDATE_SHA --out ordinary-candidate-classification.json
          if ($LASTEXITCODE -ne 0) {
            $classification = Get-Content -Raw ordinary-candidate-classification.json | ConvertFrom-Json
            $authority = @($classification.errors | Where-Object { $_ -match '^ORDINARY_CANDIDATE_AUTHORITY_CHANGE_REJECTED:' })
            if ($authority.Count -gt 0) { throw "SOUNDING_LINE_ORDINARY_CANDIDATE_AUTHORITY_CHANGE_REJECTED:$($authority -join ',')" }
            $unknown = @($classification.errors | Where-Object { $_ -match '^ORDINARY_CANDIDATE_UNKNOWN_SCOPE_REJECTED:' })
            if ($unknown.Count -gt 0) { throw "SOUNDING_LINE_ORDINARY_CANDIDATE_UNKNOWN_SCOPE_REJECTED:$($unknown -join ',')" }
            throw "SOUNDING_LINE_ORDINARY_CANDIDATE_REJECTED:$($classification.errors -join ',')"
          }
      - name: Require exact protected-main Baseline Certification
        if: ${{ inputs.authority_mode == 'candidate' }}
        shell: pwsh
        env:
          SOUNDING_LINE_BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.base.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ($env:SOUNDING_LINE_BASELINE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'SOUNDING_LINE_BASELINE_CERTIFICATION_REQUIRED' }
          $receiptDirectory = Join-Path $PWD 'nightwatch-baseline-certification'
          gh run download $env:SOUNDING_LINE_BASELINE_RUN_ID --repo $env:GITHUB_REPOSITORY --name nightwatch-baseline-certification --dir $receiptDirectory
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_BASELINE_CERTIFICATION_RECEIPT_UNAVAILABLE' }
          $receipts = @(Get-ChildItem -LiteralPath $receiptDirectory -Recurse -Filter '*.json' -File)
          if ($receipts.Count -ne 1) { throw 'SOUNDING_LINE_BASELINE_CERTIFICATION_RECEIPT_AMBIGUOUS' }
          $receipt = Get-Content -Raw -LiteralPath $receipts[0].FullName | ConvertFrom-Json
          $tree = (git rev-parse "$env:SOUNDING_LINE_BASE_SHA`:^{tree}").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_BASELINE_CERTIFICATION_BASE_TREE_UNAVAILABLE' }
          if ($receipt.kind -ne 'BASELINE_CERTIFICATION' -or $receipt.status -ne 'CERTIFIED' -or $receipt.protectedMain.sha -ne $env:SOUNDING_LINE_BASE_SHA -or $receipt.protectedMain.treeSha -ne $tree -or -not $receipt.certificationId) { throw 'SOUNDING_LINE_BASELINE_CERTIFICATION_IDENTITY_INVALID' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - id: dependency-identity
        shell: pwsh
        run: |
          $identity = node scripts/sounding-line/v14/prepared-layer-artifact.mjs cache-key | ConvertFrom-Json
          "key=$($identity.key)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "producer=$($identity.producer)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: dependency-cache-restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            node_modules
            sounding-line-dependency-cache/dependency-manifest.json
          key: ${{ steps.dependency-identity.outputs.key }}
      - if: ${{ steps.dependency-cache-restore.outputs.cache-hit != 'true' }}
        run: npm ci
      - name: Seal or verify digest-keyed immutable dependency cache
        shell: pwsh
        env:
          SOUNDING_LINE_PREPARED_CACHE_KEY: ${{ steps.dependency-identity.outputs.key }}
          SOUNDING_LINE_DEPENDENCY_PRODUCER: ${{ steps.dependency-identity.outputs.producer }}
          CACHE_HIT: ${{ steps.dependency-cache-restore.outputs.cache-hit }}
        run: |
          $manifest = 'sounding-line-dependency-cache/dependency-manifest.json'
          if ($env:CACHE_HIT -ne 'true') {
            New-Item -ItemType Directory -Path 'sounding-line-dependency-cache' -Force | Out-Null
            $expiry = ([DateTimeOffset]::UtcNow).AddDays(14).ToString('o')
            & node scripts/sounding-line/v14/prepared-layer-artifact.mjs publish --source node_modules --manifest $manifest --producer $env:SOUNDING_LINE_DEPENDENCY_PRODUCER --expires-at $expiry
            if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_DEPENDENCY_CACHE_SEAL_FAILED' }
          }
          & node scripts/sounding-line/v14/prepared-layer-artifact.mjs verify --source node_modules --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_DEPENDENCY_CACHE_VERIFY_FAILED' }
      - if: ${{ steps.dependency-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            node_modules
            sounding-line-dependency-cache/dependency-manifest.json
          key: ${{ steps.dependency-identity.outputs.key }}
      - run: npm run test:policy
      # Registry discovery imports repository test modules. It needs the Prisma
      # client, but does not create, migrate, or seed a database.
      - run: npm run db:generate
      - run: node scripts/sounding-line/test-registry.mjs
      - name: Verify candidate registry regeneration is deterministic
        if: ${{ inputs.authority_mode == 'candidate' }}
        shell: pwsh
        run: |
          git diff --exit-code -- testing/generated/active-test-registry.json
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_ORDINARY_CANDIDATE_GENERATED_REGISTRY_DRIFT' }
      # P34 must be fully mapped and archived before any hosted browser worker
      # may receive a mainline plan.
      - run: node scripts/sounding-line/p34-retirement.mjs
      - env:
          SOUNDING_LINE_GATE: ${{ steps.gate.outputs.value }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.base.outputs.value }}
          SOUNDING_LINE_AUTHORITY_MODE: ${{ steps.gate.outputs.authorityMode }}
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: node -e "import('./scripts/sounding-line/planner.mjs').then(async m=>console.log(JSON.stringify(await m.buildPlan({root:process.cwd(),gateId:process.env.SOUNDING_LINE_GATE,serial:false,sourceSha:process.env.SOUNDING_LINE_CANDIDATE_SHA,qualifiedBaseSha:process.env.SOUNDING_LINE_BASE_SHA,authorityMode:process.env.SOUNDING_LINE_AUTHORITY_MODE,candidateRef:process.env.SOUNDING_LINE_CANDIDATE_REF}),null,2)))" > sounding-line-plan.json
      - id: browser-requirements
        shell: pwsh
        run: |
          $plan = Get-Content -Raw sounding-line-plan.json | ConvertFrom-Json
          $resources = @($plan.nodes | ForEach-Object { @($_.resources) } | Where-Object { $_ -match '^browser-(chromium|webkit)$' })
          "chromium=$(if ($resources -contains 'browser-chromium') { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "webkit=$(if ($resources -contains 'browser-webkit') { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "required=$(if ($resources.Count -gt 0) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: chromium-layer-identity
        if: ${{ steps.browser-requirements.outputs.chromium == 'true' }}
        shell: pwsh
        run: |
          $identity = node scripts/sounding-line/v14/browser-layer-artifact.mjs cache-key --engines-json '["chromium"]' | ConvertFrom-Json
          "key=$($identity.key)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "producer=$($identity.producer)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: chromium-layer-restore
        if: ${{ steps.browser-requirements.outputs.chromium == 'true' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            sounding-line-browser-cache/chromium
            sounding-line-browser-cache/chromium-manifest.json
          key: ${{ steps.chromium-layer-identity.outputs.key }}
      - name: Seal or verify Chromium browser layer
        if: ${{ steps.browser-requirements.outputs.chromium == 'true' }}
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.chromium-layer-restore.outputs.cache-hit }}
          SOUNDING_LINE_BROWSER_CACHE_KEY: ${{ steps.chromium-layer-identity.outputs.key }}
          SOUNDING_LINE_BROWSER_PRODUCER: ${{ steps.chromium-layer-identity.outputs.producer }}
          PLAYWRIGHT_BROWSERS_PATH: sounding-line-browser-cache/chromium
        run: |
          $manifest = 'sounding-line-browser-cache/chromium-manifest.json'
          if ($env:CACHE_HIT -ne 'true') {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_BROWSER_LAYER_BUILD_FAILED:chromium' }
            $expiry = ([DateTimeOffset]::UtcNow).AddDays(14).ToString('o')
            node scripts/sounding-line/v14/browser-layer-artifact.mjs publish --engines-json '["chromium"]' --source sounding-line-browser-cache/chromium --manifest $manifest --producer $env:SOUNDING_LINE_BROWSER_PRODUCER --expires-at $expiry
          }
          node scripts/sounding-line/v14/browser-layer-artifact.mjs verify --engines-json '["chromium"]' --source sounding-line-browser-cache/chromium --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_BROWSER_LAYER_VERIFY_FAILED:chromium' }
      - if: ${{ steps.browser-requirements.outputs.chromium == 'true' && steps.chromium-layer-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            sounding-line-browser-cache/chromium
            sounding-line-browser-cache/chromium-manifest.json
          key: ${{ steps.chromium-layer-identity.outputs.key }}
      - id: webkit-layer-identity
        if: ${{ steps.browser-requirements.outputs.webkit == 'true' }}
        shell: pwsh
        run: |
          $identity = node scripts/sounding-line/v14/browser-layer-artifact.mjs cache-key --engines-json '["webkit"]' | ConvertFrom-Json
          "key=$($identity.key)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "producer=$($identity.producer)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: webkit-layer-restore
        if: ${{ steps.browser-requirements.outputs.webkit == 'true' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            sounding-line-browser-cache/webkit
            sounding-line-browser-cache/webkit-manifest.json
          key: ${{ steps.webkit-layer-identity.outputs.key }}
      - name: Seal or verify WebKit browser layer
        if: ${{ steps.browser-requirements.outputs.webkit == 'true' }}
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.webkit-layer-restore.outputs.cache-hit }}
          SOUNDING_LINE_BROWSER_CACHE_KEY: ${{ steps.webkit-layer-identity.outputs.key }}
          SOUNDING_LINE_BROWSER_PRODUCER: ${{ steps.webkit-layer-identity.outputs.producer }}
          PLAYWRIGHT_BROWSERS_PATH: sounding-line-browser-cache/webkit
        run: |
          $manifest = 'sounding-line-browser-cache/webkit-manifest.json'
          if ($env:CACHE_HIT -ne 'true') {
            npx playwright install webkit ffmpeg
            if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_BROWSER_LAYER_BUILD_FAILED:webkit' }
            $expiry = ([DateTimeOffset]::UtcNow).AddDays(14).ToString('o')
            node scripts/sounding-line/v14/browser-layer-artifact.mjs publish --engines-json '["webkit"]' --source sounding-line-browser-cache/webkit --manifest $manifest --producer $env:SOUNDING_LINE_BROWSER_PRODUCER --expires-at $expiry
          }
          node scripts/sounding-line/v14/browser-layer-artifact.mjs verify --engines-json '["webkit"]' --source sounding-line-browser-cache/webkit --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_BROWSER_LAYER_VERIFY_FAILED:webkit' }
      - if: ${{ steps.browser-requirements.outputs.webkit == 'true' && steps.webkit-layer-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            sounding-line-browser-cache/webkit
            sounding-line-browser-cache/webkit-manifest.json
          key: ${{ steps.webkit-layer-identity.outputs.key }}
      - id: sqlite-baseline-identity
        if: ${{ steps.browser-requirements.outputs.required == 'true' }}
        shell: pwsh
        run: |
          $identity = node scripts/sounding-line/v14/sqlite-baseline-artifact.mjs cache-key | ConvertFrom-Json
          "key=$($identity.key)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "producer=$($identity.producer)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: sqlite-baseline-restore
        if: ${{ steps.browser-requirements.outputs.required == 'true' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            sounding-line-sqlite-baseline
            sounding-line-sqlite-baseline-manifest.json
          key: ${{ steps.sqlite-baseline-identity.outputs.key }}
      - name: Seal or verify certified SQLite baseline
        if: ${{ steps.browser-requirements.outputs.required == 'true' }}
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.sqlite-baseline-restore.outputs.cache-hit }}
          SOUNDING_LINE_SQLITE_BASELINE_CACHE_KEY: ${{ steps.sqlite-baseline-identity.outputs.key }}
          SOUNDING_LINE_SQLITE_BASELINE_PRODUCER: ${{ steps.sqlite-baseline-identity.outputs.producer }}
        run: |
          $manifest = 'sounding-line-sqlite-baseline-manifest.json'
          if ($env:CACHE_HIT -ne 'true') {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/sounding-line/build-certified-sqlite-baseline.ps1 -OutDirectory (Join-Path $PWD 'sounding-line-sqlite-baseline')
            if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_SQLITE_BASELINE_BUILD_FAILED' }
            $expiry = ([DateTimeOffset]::UtcNow).AddDays(14).ToString('o')
            node scripts/sounding-line/v14/sqlite-baseline-artifact.mjs publish --source sounding-line-sqlite-baseline --manifest $manifest --producer $env:SOUNDING_LINE_SQLITE_BASELINE_PRODUCER --expires-at $expiry
          }
          node scripts/sounding-line/v14/sqlite-baseline-artifact.mjs verify --source sounding-line-sqlite-baseline --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'SOUNDING_LINE_SQLITE_BASELINE_VERIFY_FAILED' }
      - if: ${{ steps.browser-requirements.outputs.required == 'true' && steps.sqlite-baseline-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            sounding-line-sqlite-baseline
            sounding-line-sqlite-baseline-manifest.json
          key: ${{ steps.sqlite-baseline-identity.outputs.key }}
      - id: matrix
        shell: pwsh
        run: |
          $plan = Get-Content -Raw sounding-line-plan.json | ConvertFrom-Json
          $authority = Get-Content -Raw 'testing/sounding-line-authority.json' | ConvertFrom-Json
          $maximumWave = [int]$authority.hostedExecutionCapacity.maximumWave
          if ($maximumWave -lt 0) { throw "HOSTED_EXECUTION_WAVE_CAPACITY_INVALID" }
          if (@($plan.nodes).Count -eq 0) { throw "HOSTED_EXECUTION_PLAN_EMPTY" }
          $planMaximumWave = [int](($plan.nodes | Measure-Object -Property { $_.execution.wave } -Maximum).Maximum)
          if ($planMaximumWave -lt 0) { throw "HOSTED_EXECUTION_WAVE_INVALID" }
          if ($planMaximumWave -gt $maximumWave) { throw "HOSTED_EXECUTION_WAVE_CAPACITY_EXCEEDED" }
          "activeMaximumWave=$planMaximumWave" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          foreach ($wave in 0..$maximumWave) {
            foreach ($mode in @('parallel', 'exclusive')) {
              $rawMatrix = & node scripts/sounding-line/v14/physical-worker-batching.mjs --plan sounding-line-plan.json --wave $wave --mode $mode
              if ($LASTEXITCODE -ne 0) { throw ("PHYSICAL_BATCH_MATRIX_INVALID:{0}:{1}" -f $mode, $wave) }
              try { $physicalMatrix = $rawMatrix | ConvertFrom-Json } catch { throw ("PHYSICAL_BATCH_MATRIX_INVALID:{0}:{1}" -f $mode, $wave) }
              if ($null -eq $physicalMatrix -or $null -eq $physicalMatrix.include) { throw ("PHYSICAL_BATCH_MATRIX_INVALID:{0}:{1}" -f $mode, $wave) }
              $validatedRawMatrix = $physicalMatrix | ConvertTo-Json -Compress -Depth 16 | & node scripts/sounding-line/v14/physical-worker-batching.mjs --validate-matrix-stdin
              if ($LASTEXITCODE -ne 0) { throw ("PHYSICAL_BATCH_MATRIX_INVALID:{0}:{1}" -f $mode, $wave) }
              try { $validatedMatrix = $validatedRawMatrix | ConvertFrom-Json } catch { throw ("PHYSICAL_BATCH_MATRIX_INVALID:{0}:{1}" -f $mode, $wave) }
              $nodes = @($validatedMatrix.include)
              if (@($nodes | Where-Object { $null -eq $_ }).Count -ne 0) { throw ("PHYSICAL_BATCH_MATRIX_INVALID:{0}:{1}" -f $mode, $wave) }
              # GitHub marks a caller that expands an empty reusable-workflow matrix as
              # skipped, which makes the enclosing authority run fail even when every
              # governed receipt and finalizer decision is clean. Represent an empty
              # lane by one explicit no-op worker instead. The reusable
              # worker emits no receipt for that marker, so no governed suite is
              # invented and the finalizer still closes only real plan evidence.
              if ($nodes.Count -eq 0) {
                # A matrix entry is still a reusable-workflow call. Supply every
                # typed worker input so GitHub never rejects the no-evidence marker
                # before the worker can report its explicit success.
                $nodes = @(@{
                  suiteId = '__SOUNDING_LINE_EMPTY_WAVE__'
                  suiteIdsJson = '[]'
                  requiresBrowser = $false
                  browserEngine = ''
                  emptyWave = $true
                })
              }
              $matrix = @{ include = $nodes } | ConvertTo-Json -Compress
              "$mode$wave=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              if ($mode -eq 'exclusive') {
                $present = if ($nodes.Count -gt 0) { 'true' } else { 'false' }
                "exclusive$wave`Present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              }
            }
          }
