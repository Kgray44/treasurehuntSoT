name: Sounding Line V3
run-name: Sounding Line V3 ${{ github.event.pull_request.number || inputs.verification_scope || 'full' }}

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Full verification or serial Chromium comparison
        type: choice
        default: full
        options: [full, generic-serial, setup-current, setup-optimized, setup-chromium]

permissions:
  contents: read

concurrency:
  group: sounding-line-v3-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select suites
    if: ${{ !startsWith(inputs.verification_scope, 'setup-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            scripts/sounding-line-v3
            testing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: select
        name: Explain verification plan
        env:
          SL_REQUIRE_BASE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          if [[ "$SL_REQUIRE_BASE" == 1 ]]; then
            node scripts/sounding-line-v3/cli.mjs ci-plan --base HEAD^1
          else
            node scripts/sounding-line-v3/cli.mjs ci-plan --base HEAD --full
          fi

  suites:
    name: Verify ${{ matrix.id }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.kind == 'compatibility' && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.kind == 'browser-full' && 90 || matrix.kind == 'browser' && 45 || 15 }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !matrix.dependencies }}
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            testing
            tests
      - uses: actions/checkout@v4
        if: ${{ matrix.dependencies }}
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: &product-files |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
            /Development_Docs/Projects/Project_Homeport/evidence/phase7-owner-correction-round2/experience-images-index.html
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Hydrate Bridgewatch registry sources
        if: ${{ matrix.kind == 'bridgewatch-vitest' }}
        shell: bash
        run: |
          git sparse-checkout add \
            "/Development_Docs/Projects/Project Drydock/Project_Drydock_Governing_Document.pdf" \
            "/Development_Docs/Projects/Project Shipwright/Project_Shipwright_Creator_Studio_Authoring_Experience_Governing_Document.pdf" \
            "/Development_Docs/Projects/Project_Wakebook/Project_Wakebook_Governing_Document.pdf"
      - name: Hydrate Homeport inventory evidence
        if: ${{ matrix.kind == 'node-homeport' }}
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const root = "Development_Docs/Projects/Project_Homeport/";
            const { records } = JSON.parse(readFileSync(root + "Homeport_Visual_Baseline_Manifest.json", "utf8"));
            for (const file of new Set(records.map(record => record.committedScreenshotPath))) {
              if (file?.startsWith(root + "evidence/") && !file.includes("\n")) console.log("/" + file);
            }
          ' | git sparse-checkout add --stdin
          git sparse-checkout add "/Development_Docs/Projects/Project_Homeport/evidence/phase6/"
      - name: Hydrate Homeport publication history
        if: ${{ matrix.publicationHistory }}
        timeout-minutes: 8
        shell: bash
        run: |
          evidence=Development_Docs/Projects/Project_Homeport/evidence/phase7-owner-correction-round2
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            git fetch --no-tags --filter=blob:none --unshallow origin "$GITHUB_REF"
          fi
          publication="$(git log -1 --diff-filter=A --format=%H HEAD -- "$evidence/experience-images-manifest.json")"
          [[ "$publication" =~ ^[a-f0-9]{40}$ ]]
          git ls-tree -r "$publication" -- Experience_Images | awk '$2 == "blob" { print $3 }' |
            sort -u | GIT_NO_LAZY_FETCH=1 git cat-file --batch-check |
            awk '$2 == "missing" { print $1 }' > "$RUNNER_TEMP/homeport-publication-blobs"
          if [[ -s "$RUNNER_TEMP/homeport-publication-blobs" ]]; then
            git fetch --no-tags --no-write-fetch-head --filter=blob:none origin --stdin \
              < "$RUNNER_TEMP/homeport-publication-blobs"
          fi

      - uses: actions/cache/restore@v4
        if: ${{ matrix.cache != '' }}
        id: prior
        with:
          path: ${{ runner.temp }}/sound-line-pass
          key: ${{ matrix.cache }}
          lookup-only: true
      - name: Explain reused project coverage
        if: ${{ steps.prior.outputs.cache-hit == 'true' }}
        shell: bash
        run: echo 'Previously passed project unit suite with the same tracked input fingerprint.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked dependencies
        if: ${{ matrix.dependencies && steps.prior.outputs.cache-hit != 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        if: ${{ matrix.kind == 'browser' }}
        timeout-minutes: 6
        run: npx --no-install playwright install chromium
      - name: Install full browser compatibility coverage
        if: ${{ matrix.kind == 'browser-full' }}
        timeout-minutes: 10
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run selected verification
        if: ${{ steps.prior.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          SL_JOB: ${{ matrix.id }}
          SL_REQUIRE_BASE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          if [[ "$SL_REQUIRE_BASE" == 1 ]]; then
            node scripts/sounding-line-v3/cli.mjs ci-job --base HEAD^1
          else
            node scripts/sounding-line-v3/cli.mjs ci-job --base HEAD --full
          fi

      - name: Record successful project coverage
        if: ${{ matrix.cache != '' && steps.prior.outputs.cache-hit != 'true' }}
        shell: bash
        run: touch "$RUNNER_TEMP/sound-line-pass"
      - uses: actions/cache/save@v4
        if: ${{ matrix.cache != '' && steps.prior.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/sound-line-pass
          key: ${{ matrix.cache }}

  decision:
    name: ${{ github.event_name == 'pull_request' && 'Sounding Line V3 / Verification' || inputs.verification_scope == 'generic-serial' && 'Sounding Line V3 / Serial browser comparison' || 'Sounding Line V3 / Full verification' }}
    needs: [plan, suites]
    if: ${{ always() && !startsWith(inputs.verification_scope, 'setup-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SUITE_RESULT: ${{ needs.suites.result }}
        run: test "$PLAN_RESULT" = success && test "$SUITE_RESULT" = success

  benchmark-build:
    name: Benchmark shared browser build
    if: ${{ inputs.verification_scope == 'setup-optimized' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: *product-files
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate SQLite client
        run: npm run db:generate
      - name: Build task-owned browser application
        env:
          DATABASE_URL: file:./.v3-benchmark-build.sqlite
          SOUNDING_LINE_TASK_OWNED_HTTP: "1"
          SOUNDING_LINE_SUITE_PROFILE: v3-browser
        run: npm run build
      - name: Pack browser build
        run: |
          tar --exclude=.next/cache -czf "$RUNNER_TEMP/v3-browser-build.tar.gz" .next
          stat -c '%s browser build artifact bytes' "$RUNNER_TEMP/v3-browser-build.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: v3-browser-build
          path: ${{ runner.temp }}/v3-browser-build.tar.gz
          compression-level: 0
          retention-days: 1

  benchmark-shards:
    name: Benchmark shard ${{ matrix.shard }}
    needs: benchmark-build
    if: ${{ always() && (inputs.verification_scope == 'setup-current' || inputs.verification_scope == 'setup-chromium' || (inputs.verification_scope == 'setup-optimized' && needs.benchmark-build.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            spec: tests/e2e/animations.spec.ts
          - shard: 2
            spec: tests/e2e/acceptance.spec.ts
          - shard: 3
            spec: tests/e2e/wayfarer-phase3.spec.ts
          - shard: 4
            spec: tests/e2e/landfall-phase2.spec.ts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: *product-files
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: ${{ inputs.verification_scope == 'setup-optimized' && 'npm' || '' }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install full browser compatibility coverage
        if: ${{ inputs.verification_scope == 'setup-current' }}
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Install Chromium
        if: ${{ inputs.verification_scope == 'setup-optimized' || inputs.verification_scope == 'setup-chromium' }}
        run: npx --no-install playwright install chromium
      - uses: actions/download-artifact@v4
        if: ${{ inputs.verification_scope == 'setup-optimized' }}
        with:
          name: v3-browser-build
          path: ${{ runner.temp }}
      - name: Unpack browser build
        if: ${{ inputs.verification_scope == 'setup-optimized' }}
        run: tar -xzf "$RUNNER_TEMP/v3-browser-build.tar.gz"
      - name: Run the isolated browser fixture
        env:
          V3_BENCHMARK_SPEC: ${{ matrix.spec }}
          V3_BENCHMARK_SHARED_BUILD: ${{ inputs.verification_scope == 'setup-optimized' && '1' || '0' }}
        run: |
          node --input-type=module -e '
            import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
            const tree = process.env.GITHUB_SHA;
            await runJob({ kind: "browser", files: [process.env.V3_BENCHMARK_SPEC] }, { base: tree, tree });
          '
