name: Sounding Line train per-car finalizer

on:
  workflow_call:
    inputs:
      train_id: { required: true, type: string }
      cars: { required: true, type: string }
      present: { required: true, type: string }

jobs:
  finalize:
    if: ${{ inputs.present == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.cars) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-train-prepared
          path: train-prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sounding-line-train-worker-${{ matrix.candidateId }}-*
          path: worker-evidence
          merge-multiple: false
      - name: Finalize exact predicted-tree candidate evidence
        env:
          SOUNDING_LINE_EXPECTED_SOURCE_SHA: ${{ matrix.candidateSha }}
        run: node scripts/sounding-line/finalize-ci.mjs train-prepared/${{ matrix.planPath }} worker-evidence --out sounding-line-finalization.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-mainline-train-${{ inputs.train_id }}
          path: train-state
      - name: Bind finalization to the planned car without landing it
        shell: pwsh
        run: |
          $finalization = Get-Content -Raw sounding-line-finalization.json | ConvertFrom-Json
          if ($finalization.decision -ne 'RELEASE_GO' -or -not $finalization.evidenceDigest) { throw 'TRAIN_CAR_RELEASE_GO_REQUIRED' }
          node scripts/sounding-line/v14/mainline-train-cli.mjs qualify --state train-state/mainline-train.json --plan train-prepared/${{ matrix.planPath }} --finalization sounding-line-finalization.json --candidate-id ${{ matrix.candidateId }} --evidence-closure $finalization.evidenceDigest --out mainline-train-qualified.json
      - name: Make a qualified head independently landing-ready
        if: ${{ matrix.position == 0 }}
        run: node scripts/sounding-line/v14/mainline-train-cli.mjs head-ready --state mainline-train-qualified.json --candidate-id ${{ matrix.candidateId }} --out mainline-train-head-ready.json
      - name: Seal exact protected-binding envelope
        env:
          SOUNDING_LINE_PR_NUMBER: ${{ matrix.prNumber }}
          SOUNDING_LINE_BASE_SHA: ${{ matrix.qualifiedBaseSha }}
          SOUNDING_LINE_RUN_ID: ${{ github.run_id }}
        run: node scripts/sounding-line/create-acceptance-envelope.mjs --plan train-prepared/${{ matrix.planPath }} --finalization sounding-line-finalization.json --pr-number "$env:SOUNDING_LINE_PR_NUMBER" --base-sha "$env:SOUNDING_LINE_BASE_SHA" --run-id "$env:SOUNDING_LINE_RUN_ID" --out sounding-line-acceptance-envelope.json
      - name: Normalize sealed plan for protected binding
        shell: pwsh
        run: Copy-Item -LiteralPath train-prepared/${{ matrix.planPath }} -Destination sounding-line-plan.json
      - name: Bind the current train head to protected merge identity
        if: ${{ matrix.position == 0 }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.prNumber }}
          CANDIDATE_SHA: ${{ matrix.candidateSha }}
          AUTHORITY_RUN_ID: ${{ github.run_id }}
        run: |
          git fetch origin main "refs/pull/$env:PR_NUMBER/merge:refs/remotes/origin/sounding-line-train-head-merge"
          if ($LASTEXITCODE -ne 0) { throw 'TRAIN_HEAD_MERGE_IDENTITY_UNAVAILABLE' }
          $merge = (git rev-parse origin/sounding-line-train-head-merge).Trim()
          $base = (git rev-parse origin/main).Trim()
          node scripts/sounding-line/protected-merge-binding-ci.mjs --authority testing/sounding-line-authority.json --finalization sounding-line-finalization.json --plan sounding-line-plan.json --envelope sounding-line-acceptance-envelope.json --pr-number $env:PR_NUMBER --candidate-sha $env:CANDIDATE_SHA --base-sha $base --merge-sha $merge --authority-run-id $env:AUTHORITY_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'TRAIN_HEAD_PROTECTED_BINDING_NO_GO' }
          $body = @{ name = 'Sounding Line / Mainline Decision'; head_sha = $merge; status = 'completed'; conclusion = 'success'; output = @{ title = 'Train head bound'; summary = 'Exact sealed train-head authority bound to the current protected merge identity.' } } | ConvertTo-Json -Depth 8
          Invoke-RestMethod -Method Post -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -Uri "https://api.github.com/repos/$env:REPOSITORY/check-runs" -ContentType 'application/json' -Body $body | Out-Null
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ matrix.finalizationArtifact }}
          path: sounding-line-finalization.json
          retention-days: 14
      - if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ matrix.qualificationArtifact }}
          path: mainline-train-qualified.json
          retention-days: 14
      - if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ matrix.acceptanceArtifact }}
          path: |
            sounding-line-acceptance-envelope.json
            sounding-line-finalization.json
            sounding-line-plan.json
          retention-days: 14
      - if: ${{ success() && matrix.position == 0 }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sounding-line-mainline-train-head-live-${{ inputs.train_id }}
          path: |
            mainline-train-qualified.json
            mainline-train-head-ready.json
          retention-days: 14
  complete:
    needs: finalize
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          PRESENT: ${{ inputs.present }}
          RESULT: ${{ needs.finalize.result }}
        run: |
          if ($env:PRESENT -eq 'true' -and $env:RESULT -ne 'success') { throw 'TRAIN_PER_CAR_FINALIZATION_FAILED' }
