name: Sounding Line posttechnical replay diagnostic
run-name: Sounding Line posttechnical diagnostic 1 ordinary6

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: crossdeck-ordinary6-posttechnical-diagnostic-20261017
  cancel-in-progress: false

jobs:
  reserve-diagnostic:
    name: Reserve the single nonqualifying posttechnical diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Kgray44/treasurehuntSoT' && github.ref == 'refs/heads/main' && github.actor == 'Kgray44' && github.triggering_actor == 'Kgray44' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      reservation: ${{ steps.reserve.outputs.reservation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: installer
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Reserve before transfer, setup or technical product execution
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node installer/scripts/sounding-line/replay-posttechnical-diagnostic.mjs reserve --installer "$GITHUB_WORKSPACE/installer" --output "$GITHUB_WORKSPACE/receipts/reservation.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posttechnical-diagnostic-reservation-${{ github.run_id }}
          path: receipts/reservation.json
          if-no-files-found: warn
          retention-days: 90

  posttechnical-diagnostic:
    name: Reconstruct the fixed technical workload then observe source
    needs: reserve-diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Kgray44/treasurehuntSoT' && github.ref == 'refs/heads/main' && github.actor == 'Kgray44' && github.triggering_actor == 'Kgray44' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: installer
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 24fb189a90435ccb6021b63fd6953603ae090bc0
          path: authority
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7681d297f281ab03f30b4224b8288b7c942024c6
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Run the finite technical workload and same-process source observation
        id: diagnose
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RESERVATION: ${{ needs.reserve-diagnostic.outputs.reservation }}
        run: node installer/scripts/sounding-line/replay-posttechnical-diagnostic.mjs diagnose --installer "$GITHUB_WORKSPACE/installer" --authority "$GITHUB_WORKSPACE/authority" --candidate "$GITHUB_WORKSPACE/candidate" --reservation "$DIAGNOSTIC_RESERVATION" --output "$GITHUB_WORKSPACE/receipts/reproduction.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.diagnose.outputs.evidence_safe == 'true' }}
        with:
          name: posttechnical-diagnostic-evidence-${{ github.run_id }}
          path: |
            receipts/reproduction.json
            receipts/private-evidence.encrypted
          if-no-files-found: warn
          retention-days: 90
