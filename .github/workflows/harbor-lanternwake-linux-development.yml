name: Lanternwake isolated Linux benchmark
run-name: Reproduce the Creator review obscured after responsive form reflow

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  creator-focus-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 34965b97d2824fb8a2e21d84d1012acda5cce837
          persist-credentials: false
          sparse-checkout: |
            src
            tests
            scripts
            prisma
            testing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce the focused browser layout failure at the helper boundary
        run: |
          test "$(git rev-parse HEAD)" = "34965b97d2824fb8a2e21d84d1012acda5cce837"
          test "$(git rev-parse HEAD^{tree})" = "4073de6914319de1018f3ab7f0724df213633746"
          npx --no-install vitest run src/components/community/focus-exchange-heading.test.ts
