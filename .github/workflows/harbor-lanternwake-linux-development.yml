name: Lanternwake isolated Linux benchmark
run-name: Run the complete V3 Lanternwake job with a fresh timing runtime

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  browser-probe:
    name: Full Lanternwake V3 job with isolated benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: 67ba7699f548aadbffbf7a10d947264ef3b98884
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: 67ba7699f548aadbffbf7a10d947264ef3b98884
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67ba7699f548aadbffbf7a10d947264ef3b98884
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Run tracked runner assertions and the entire Lanternwake V3 browser job
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "030f7ca800cb850b896e41ee2cfa6c5d30d67a13"
          node --test tests/sounding-line-v3.test.mjs
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "browser-lanternwake", kind: "browser-full", files: [] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain V3 benchmark receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-fresh-v3-runtime-benchmark
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/*
          if-no-files-found: ignore
          retention-days: 30
