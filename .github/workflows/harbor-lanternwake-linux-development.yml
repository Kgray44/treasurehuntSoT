name: Lanternwake isolated Linux benchmark
run-name: Journal PR 905 guarded readiness unit and component tests

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Focused Journal readiness regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: e7a17fab39173fbd4a18ba53332e2033bf3f69eb
      BASE_SHA: 9e612bd42dee2561d75dfac9263ac3307d5dee24
      FOREVER_VALIDATION_SOURCE_SHA: e7a17fab39173fbd4a18ba53332e2033bf3f69eb
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7a17fab39173fbd4a18ba53332e2033bf3f69eb
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run registered Journal unit and component suites for the exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import {changes, git, registry, select} from "./scripts/sounding-line-v3/plan.mjs";
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          const base = process.env.BASE_SHA;
          const tree = process.env.CANDIDATE_SHA;
          const entries = changes(base, tree);
          const jobs = select(entries, (file) => git(["show", tree + ":" + file]), {},
            registry(tree), (file) => git(["show", base + ":" + file])).jobs;
          const selected = jobs.filter(({id}) => ["unit.journal", "component.journal"].includes(id));
          if (selected.length !== 2) throw new Error("Both registered Journal suites are required");
          for (const job of selected) await runJob(job, {base, tree, entries});
          EOF
