name: Native Sounding Line V3 plan
run-name: Resolve exact ordinary V3 test selection for the reconciled Native candidate
on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: e68eb73782ba4e13ac3fca30972c6f72f02d7314
      BASE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
      EXPECTED_TREE: 491043e4d1c5b3d17f4957a9ae3ab43d44dfe068
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e68eb73782ba4e13ac3fca30972c6f72f02d7314
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            scripts/sounding-line-v3
            testing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify the exact staged tree and resolve V3 coverage without running the gate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse 'HEAD^2')" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          node scripts/sounding-line-v3/cli.mjs plan --base "$BASE_SHA" --head "$CANDIDATE_SHA" --json > "$RUNNER_TEMP/v3-native-plan.json"
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/v3-native-plan.json","utf8"));
          const git=(...args)=>execFileSync("git",args,{encoding:"utf8"}).trim();
          const performance="tests/e2e/phase3-performance.spec.ts";
          const config="tests/config/playwright/playwright.phase3-performance.config.ts";
          console.log("NATIVE_V3_EXACT_PLAN "+JSON.stringify({
            category:p.category,
            base:p.base,
            candidate:p.tree,
            performanceSource:git("rev-parse","HEAD:"+performance),
            performanceConfig:git("rev-parse","HEAD:"+config),
            jobs:p.jobs.map(({id,kind,files})=>({id,kind,files:files.length,performance:files.includes(performance)})),
          }));
          EOF
