name: Lanternwake isolated Linux benchmark
run-name: Verify the explicit Skip repair against the landed Journal and original cleanup budget

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Matched Skip transition comparison (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: control
            source: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
          - lane: patched
            source: 0a1fdf912bc30f3bde4accd5284ff125f7155227
    timeout-minutes: 22
    env:
      SKIP_LANE: ${{ matrix.lane }}
      CANDIDATE_SHA: ${{ matrix.source }}
      BASE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
      FOREVER_VALIDATION_SOURCE_SHA: ${{ matrix.source }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Install only the staged diagnostic fixture
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:tests/e2e/parallax-shared-consumers.spec.ts" > tests/e2e/parallax-shared-consumers.spec.ts
      - name: Capture actual transition owners during requested Skip
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/parallax-shared-consumers.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-skip-owners-${{ matrix.lane }}
          path: artifacts/sounding-line/journal-skip-owners/**
          if-no-files-found: ignore
          retention-days: 30
  canonical-budget:
    name: Original canonical Skip cleanup budget
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 0a1fdf912bc30f3bde4accd5284ff125f7155227
      BASE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
      FOREVER_VALIDATION_SOURCE_SHA: 0a1fdf912bc30f3bde4accd5284ff125f7155227
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a1fdf912bc30f3bde4accd5284ff125f7155227
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Preserve canonical benchmark and unmodified recording settings
        run: |
          git fetch --no-tags --depth=1 origin 186e0d868f5cb1aaf542e7885486f7e5ce144f16
          git show 186e0d868f5cb1aaf542e7885486f7e5ce144f16:tests/e2e/phase3-performance.spec.ts > tests/e2e/phase3-performance.spec.ts
          test "$(git hash-object tests/e2e/phase3-performance.spec.ts)" = "ce468f106d9bf65548db3ad638af36c7a9cd5196"
          npx --no-install prettier --check src/components/player/journal/ChronicleJournalSession.module.css
      - name: Measure the Skip repair with all required budgets
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-skip-canonical-after-repair
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/*
          if-no-files-found: ignore
          retention-days: 30
