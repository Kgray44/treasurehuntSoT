name: Verify byte-preserving receipt provenance and formatting
run-name: Verify the formatted prerequisite evidence

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  actions: read
  contents: write

jobs:
  format-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PREVIOUS_PROOF: a3aabc93e6c305978f9a30b87e5fdb1d2e0ffaa0
      PROTECTED_BASE: 00420421bacc6e9b923c5e50852a83a858886131
      PROOF_REF: refs/heads/codex/harbor-901-formatted-proof-d2d80e1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3aabc93e6c305978f9a30b87e5fdb1d2e0ffaa0
          fetch-depth: 64
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
            /Development_Docs/Testing/Product_Experience/evidence/harbor-901/d2d80e1a0c09/
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned formatting dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve raw receipt identity and verify all formatting constraints
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PREVIOUS_PROOF"
          git fetch --no-tags --filter=blob:none --depth=64 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$PROTECTED_BASE"
          node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import prettier from "prettier";
          import { experienceDigest, planProductExperience } from "./scripts/sounding-line/product-experience.mjs";
          const root=process.cwd();
          const recordPath="Development_Docs/Testing/Product_Experience/candidate-review.json";
          const prefix="Development_Docs/Testing/Product_Experience/evidence/harbor-901/d2d80e1a0c09/";
          const [proof,base]=[process.env.PREVIOUS_PROOF,process.env.PROTECTED_BASE];
          const hash=(bytes)=>createHash("sha256").update(bytes).digest("hex");
          const git=(...args)=>execFileSync("git",args,{encoding:"utf8",maxBuffer:16*1024*1024}).trim();
          const original=JSON.parse(readFileSync(recordPath,"utf8"));
          const record=structuredClone(original);
          const paths=[
           prefix+"development-capture-receipt.json",
           record.pairedEvidence.report.path,
           ...record.pairedEvidence.cases.map(item=>item.witness.path),
          ];
          if(new Set(paths).size!==5 || paths.some(file=>!file.startsWith(prefix))) throw Error("Unexpected receipt scope");
          async function format(file,text) {
           return prettier.format(text,{...await prettier.resolveConfig(file),filepath:file});
          }
          const provenance=[];
          for(const file of paths){
           const prior=readFileSync(file,"utf8");
           const formatted=await format(file,prior);
           if(formatted===prior||JSON.stringify(JSON.parse(prior))!==JSON.stringify(JSON.parse(formatted)))
            throw Error("The expected formatting-only change did not hold: "+file);
           const before=hash(prior), after=hash(formatted);
           const reference=[record.pairedEvidence.report,...record.pairedEvidence.cases.map(item=>item.witness)].find(item=>item.path===file);
           if(reference){
            if(reference.sha256!==before) throw Error("Original verified receipt hash differs: "+file);
            reference.sha256=after;
           }
           writeFileSync(file,formatted);
           provenance.push({path:file,originalSha256:before,formattedSha256:after});
          }
          const common={root,baseSha:base,candidateSha:proof,changedPaths:git("diff","--name-only","--no-renames",base,proof).split("\n").filter(Boolean)};
          const plan=planProductExperience(common);
          if(plan.sourceDigest!==record.sourceDigest||plan.contractDigest!==record.contractDigest||plan.contracts.length!==31)
           throw Error("Capture source or contract plan changed");
          for(const review of record.reviews){
           const contract=plan.contracts.find(item=>item.id===review.contractId);
           if(!contract) throw Error("Review contract disappeared");
           const media=record.artifacts.filter(item=>item.contractId===contract.id).map(({id,sha256})=>({id,sha256}));
           const binding={sourceDigest:plan.sourceDigest,contract,artifacts:media};
           const former=experienceDigest({...binding,...(contract.experience.pairedEvidence?{pairedEvidence:original.pairedEvidence}:{})});
           if(former!==review.packetDigest) throw Error("Original review packet differs: "+contract.id);
           review.packetDigest=experienceDigest({...binding,...(contract.experience.pairedEvidence?{pairedEvidence:record.pairedEvidence}:{})});
          }
          const manifest=prefix+"published-receipt-normalization.json";
          writeFileSync(recordPath,await format(recordPath,JSON.stringify(record)));
          writeFileSync(manifest,await format(manifest,JSON.stringify({
           captureArtifactId:14836984644,
           captureArchiveSha256:"b287092438f36332a011d990716f649d1fcab6e1fa90065d553a3f5f8f5c9b29",
           originalGitCommit:proof,
           verification:"Each formatted file parsed to the same JSON as its producer original. The original bytes remain in the immutable capture archive and parent commit.",
           receipts:provenance,
          })));
          console.log("Verified JSON-only formatting for "+paths.length+" captured receipts.");
          EOF
          git add --sparse -f -- Development_Docs/Testing/Product_Experience/candidate-review.json Development_Docs/Testing/Product_Experience/evidence/harbor-901/d2d80e1a0c09
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format published receipts and preserve their original provenance"
          SL_JOB=format node scripts/sounding-line-v3/cli.mjs ci-job --base "$PROTECTED_BASE"
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { planProductExperience, verifyProductExperience } from "./scripts/sounding-line/product-experience.mjs";
          const git=(...args)=>execFileSync("git",args,{encoding:"utf8",maxBuffer:16*1024*1024}).trim();
          const path="Development_Docs/Testing/Product_Experience/candidate-review.json";
          const root=process.cwd();
          const baseSha=process.env.PROTECTED_BASE;
          const candidateSha=git("rev-parse","HEAD");
          const changedPaths=git("diff","--name-only","--no-renames",baseSha,candidateSha).split("\n").filter(Boolean);
          const plan=planProductExperience({root,baseSha,candidateSha,changedPaths});
          const record=JSON.parse(readFileSync(path,"utf8"));
          if(git("rev-parse","HEAD^")!==process.env.PREVIOUS_PROOF || plan.sourceDigest!==record.sourceDigest ||
           plan.contractDigest!==record.contractDigest || plan.contracts.length!==31 ||
           verifyProductExperience(root,candidateSha,plan).status!=="PASS") throw Error("Formatted proof did not verify");
          console.log(JSON.stringify({status:"PASS",proofSha:candidateSha,sourceDigest:plan.sourceDigest,contracts:plan.contracts.length}));
          EOF
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PROTECTED_BASE"
          test -z "$(git ls-remote origin "$PROOF_REF")"
          git push origin "HEAD:$PROOF_REF"
          test "$(git ls-remote origin "$PROOF_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'HARBOR_FORMATTED_PROOF_SHA=%s\n' "$(git rev-parse HEAD)"
