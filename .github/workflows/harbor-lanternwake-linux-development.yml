name: Player invitation contrast diagnostic
run-name: Compare reporter Git diff collection on identical Journal workloads

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  contrast:
    name: Compare Journal timing with and without reporter diff metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 30b60617981b748b5eb176128756942dc8c9e862
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: 30b60617981b748b5eb176128756942dc8c9e862
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30b60617981b748b5eb176128756942dc8c9e862
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Run both reporter modes on the same runner and exact product
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags --filter=blob:none --depth=64 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          test "$(git hash-object tests/e2e/phase3-performance.spec.ts)" = "2e10c383fa2accb79fbad09f92d61631b23e2d78"
          jq -n --arg base "$BASE_SHA" --arg head "$CANDIDATE_SHA" '
            {pull_request: {number: 901, base: {sha: $base, ref:"main"}, head:{sha:$head}}}
          ' > "$RUNNER_TEMP/harbor-git-metadata-event.json"
          lscpu | sed -n '1,20p'
          mkdir -p "$RUNNER_TEMP/harbor-timing"
          export GITHUB_EVENT_NAME=pull_request
          export GITHUB_EVENT_PATH="$RUNNER_TEMP/harbor-git-metadata-event.json"
          for lane in default without-reporter-diff; do
            if [[ "$lane" == without-reporter-diff ]]; then
              python - <<'PY'
          from pathlib import Path
          config=Path("playwright.config.ts")
          text=config.read_text()
          anchor="export default defineConfig({\n"
          assert text.count(anchor)==1
          config.write_text(text.replace(anchor,anchor+"  captureGitInfo: { commit: true, diff: false },\n"))
          PY
            fi
            echo "HARBOR_TIMING_LANE=$lane"
            if node --input-type=module <<'EOF'
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          await runJob({id:"harbor-journal-git-metadata",kind:"browser",files:["tests/e2e/phase3-performance.spec.ts"]},
            {base:process.env.BASE_SHA,tree:process.env.CANDIDATE_SHA});
          EOF
            then
              echo "$lane PASS"
            else
              echo "$lane FAILED"
            fi
            output="$(find artifacts/sounding-line -name phase3-performance-metrics.json -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
            test -s "$output"
            cp "$output" "$RUNNER_TEMP/harbor-timing/$lane.json"
            jq '{provenance:.provenance.testedSourceSha, failedBudgets, metrics: {desktopFrameP95Ms:.metrics.desktopFrameP95Ms,ordinaryCumulativeLongTaskMs:.metrics.ordinaryCumulativeLongTaskMs}}' "$output"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-journal-reporter-diff-comparison
          path: ${{ runner.temp }}/harbor-timing/*.json
          if-no-files-found: error
          retention-days: 15
