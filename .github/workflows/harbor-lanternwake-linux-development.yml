name: Lanternwake isolated Linux benchmark
run-name: Matched desktop frame comparison with locally isolated cover and paper effects

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Recorded desktop comparison (${{ matrix.artwork }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        artwork: [control, isolated]
    timeout-minutes: 22
    env:
      JOURNAL_COMPARE_BROWSER: shell
      JOURNAL_COMPARE_CAPTURE: record
      ARTWORK_TREATMENT: ${{ matrix.artwork }}
      CANDIDATE_SHA: ${{ github.sha }}
      BASE_SHA: fc813a4c03a4916c6b0aab346abbb8b1caa8cf38
      FOREVER_VALIDATION_SOURCE_SHA: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Keep cover grain and sealed-page grain inside their opaque paint surfaces
        if: matrix.artwork == 'isolated'
        run: |
          cat >> src/components/player/journal/ChronicleJournalSession.module.css <<'EOF'

          @media (min-width: 961px) {
            .journalShell[data-motion-level="full"] :global(.cover-front),
            .journalShell[data-motion-level="full"] :global(.opening-sealed-page) {
              isolation: isolate;
            }
          }
          EOF
      - name: Run the same full canonical workload and recorded desktop metrics
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-local-grain-isolation-${{ matrix.artwork }}
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/*
          if-no-files-found: ignore
          retention-days: 30
