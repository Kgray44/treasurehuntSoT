name: Lanternwake isolated Linux benchmark
run-name: Capture the targeted Journal Skip cleanup source and five affected contracts

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Source-bound Journal experience capture
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      CANDIDATE_SHA: 0a1fdf912bc30f3bde4accd5284ff125f7155227
      BASE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
      FOREVER_VALIDATION_SOURCE_SHA: 0a1fdf912bc30f3bde4accd5284ff125f7155227
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a1fdf912bc30f3bde4accd5284ff125f7155227
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify the actual protected base and its candidate ancestry
        run: |
          git fetch --no-tags --filter=blob:none --depth=16 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Capture the actual Journal and Crossdeck browser journeys
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import {execFileSync} from "node:child_process";
          import {writeFile} from "node:fs/promises";
          import {runTrustedExperienceReplay} from "./scripts/sounding-line/experience-browser.mjs";
          import {recognizeExceptionExecution} from "./scripts/sounding-line/experience-exception.mjs";
          const root = process.cwd();
          if (recognizeExceptionExecution({root, baseSha: process.env.BASE_SHA, candidateSha: process.env.CANDIDATE_SHA}))
            throw new Error("Current source was classified as a separate exception campaign");
          const plan = JSON.parse(execFileSync(process.execPath, [
            "scripts/sounding-line/experience-browser.mjs", "--base", process.env.BASE_SHA,
            "--candidate", process.env.CANDIDATE_SHA, "--plan", "true",
          ], {encoding: "utf8"}));
          if (!plan.applicable || plan.sourceDigest !== "e8cd334f089255752e02cbcc5420d8b367eae3816c0ad5bfd319674cb9d020bb" ||
              plan.contractDigest !== "353a6515594fe39c41300eb093e5e1f78ac6e9293a6d3494a77131cd9f20f41f")
            throw new Error("Exact source-bound Product Experience plan required");
          plan.outputDirectory = "artifacts/sounding-line/journal-skip-experience";
          delete process.env.GH_TOKEN;
          delete process.env.GITHUB_TOKEN;
          const receipt = await runTrustedExperienceReplay({
            root, plan, validateReplay: false,
            environment: { SOUNDING_LINE_BASE_SHA: plan.baseSha },
          });
          if (receipt.status !== "PASS") throw new Error("The actual browser capture did not complete");
          await writeFile(plan.outputDirectory + "/development-capture-receipt.json",
            JSON.stringify({candidate: plan.candidateSha, base: plan.baseSha, status: receipt.status,
              sourceDigest: plan.sourceDigest, contractDigest: plan.contractDigest, profiles: receipt.profiles,
              contracts: plan.contracts.map((contract) => contract.id), workflowRole: "DEVELOPMENT_CAPTURE"}, null, 2) + "\n");
          EOF
      - name: Retain source-bound synthetic browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-skip-source-bound-experience
          path: artifacts/sounding-line/journal-skip-experience/**
          if-no-files-found: ignore
          retention-days: 30
