name: Lanternwake isolated Linux benchmark
run-name: Verify in-test Metal and isolate recorder overhead on exact protected and Native trees

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Journal benchmark with in-test renderer verification (${{ matrix.lane }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: main-normal
            source: 627a4e651641b6765ac789d378672ea6e903c120
            recording: normal
          - lane: native-normal
            source: e68eb73782ba4e13ac3fca30972c6f72f02d7314
            recording: normal
          - lane: native-reduced
            source: e68eb73782ba4e13ac3fca30972c6f72f02d7314
            recording: reduced
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: ${{ matrix.source }}
      BASE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
      FOREVER_VALIDATION_SOURCE_SHA: ${{ matrix.source }}
      NEXT_TELEMETRY_DISABLED: "1"
      JOURNAL_DIAGNOSTIC_RECORDING: ${{ matrix.recording }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Apply the selected recorder settings to the root Playwright config
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD:tests/config/playwright/playwright.phase3-performance.config.ts)" = "4347403eaf7ccbcc7fe0cf1dca8f62f148f24857"
          git fetch --no-tags --depth=1 origin 186e0d868f5cb1aaf542e7885486f7e5ce144f16
          git show 186e0d868f5cb1aaf542e7885486f7e5ce144f16:tests/e2e/phase3-performance.spec.ts > tests/e2e/phase3-performance.spec.ts
          test "$(git hash-object tests/e2e/phase3-performance.spec.ts)" = "ce468f106d9bf65548db3ad638af36c7a9cd5196"
          test "$(git hash-object playwright.config.ts)" = "e43e9912bc263909c58a31ded843a25209761917"
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const replace = (source, from, to) => {
            if (source.split(from).length!==2) throw Error("Unexpected diagnostic source anchor");
            return source.replace(from,to);
          };
          const configPath="playwright.config.ts";
          let config=fs.readFileSync(configPath,"utf8");
          config=replace(config,'use: { baseURL, trace:','use: { baseURL, channel: "chromium", trace:');
          if (process.env.JOURNAL_DIAGNOSTIC_RECORDING==="reduced") {
            config=replace(config,'trace: "retain-on-failure"','trace: {mode:"retain-on-failure",screenshots:false,snapshots:false}');
            config=replace(config,'video: "retain-on-failure"','video: "off"');
          } else if (process.env.JOURNAL_DIAGNOSTIC_RECORDING!=="normal") throw Error("Unknown recorder mode");
          fs.writeFileSync(configPath,config);
          const specPath="tests/e2e/phase3-performance.spec.ts";
          const spec=fs.readFileSync(specPath,"utf8");
          const probe=[
            '    expect(browserName).toBe("chromium");',
            '    const rendererSession = await browser.newBrowserCDPSession();',
            '    const {gpu}=await rendererSession.send("SystemInfo.getInfo");',
            '    await rendererSession.detach();',
            '    const activeRenderer = {renderer:gpu.auxAttributes?.glRenderer,compositor:gpu.featureStatus?.gpu_compositing,raster:gpu.featureStatus?.rasterization};',
            '    console.log("LANTERNWAKE_MEASURED_RENDERER "+JSON.stringify(activeRenderer));',
            '    expect(activeRenderer.renderer).toMatch(/Metal/i);',
            '    expect(activeRenderer.compositor).toMatch(/^enabled/);',
            '    expect(activeRenderer.raster).toMatch(/^enabled/);',
          ].join("\n");
          fs.writeFileSync(specPath,replace(spec.trimEnd()+"\n",'    expect(browserName).toBe("chromium");',probe));
          EOF
      - name: Select the existing Darwin diagnostic guardian for this isolated macOS job
        run: |
          git fetch --no-tags --depth=1 origin f3edff6df19885a14acf5f97990ed355be5777a2
          git show f3edff6df19885a14acf5f97990ed355be5777a2:scripts/sounding-line/owned-process-darwin-diagnostic.py > scripts/sounding-line/owned-process-darwin-diagnostic.py
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          if (process.platform !== "darwin" || process.env.GITHUB_ACTIONS !== "true") throw Error("Ephemeral macOS is required");
          const file = "scripts/sounding-line/owned-process.mjs";
          let source = fs.readFileSync(file,"utf8");
          const replacements = [
            ['new URL("./owned-process-linux.py", import.meta.url)', 'new URL(process.platform === "darwin" ? "./owned-process-darwin-diagnostic.py" : "./owned-process-linux.py", import.meta.url)'],
            ['record.windows ? "WINDOWS_JOB_OBJECT" : "LINUX_SUBREAPER_AND_PIDFD"', 'record.windows ? "WINDOWS_JOB_OBJECT" : process.platform === "darwin" ? "DARWIN_DIAGNOSTIC_PROCESS_GROUP" : "LINUX_SUBREAPER_AND_PIDFD"'],
          ];
          for (const [before, after] of replacements) {
            if (source.split(before).length !== 2) throw Error("Unexpected launcher anchor");
            source = source.replace(before, after);
          }
          fs.writeFileSync(file,source);
          EOF
      - name: Measure all original budgets with this verified renderer
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          sysctl hw.memsize
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-hosted-metal-${{ matrix.lane }}
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/phase3-performance-metrics.json
          if-no-files-found: ignore
          retention-days: 30
