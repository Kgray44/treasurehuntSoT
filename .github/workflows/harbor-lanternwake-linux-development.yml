name: Lanternwake isolated Linux benchmark
run-name: Landed Journal and reduced-motion Home smoke

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Verify landed source and focused behaviors
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
      BASE_SHA: fc813a4c03a4916c6b0aab346abbb8b1caa8cf38
      FOREVER_VALIDATION_SOURCE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_TREE: 7d55264d77fba15896fd1760e28d643eb3347245
      HOME_PRODUCT_ROLE: landed-main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify exact landed tree and focused animation suites
        run: |
          git fetch --no-tags --depth=8 --filter=blob:none origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          npx --no-install vitest run src/animation/platform/RouteMotionBoundary.test.tsx src/animation/scenes/scene-builders.test.ts src/components/landing/HarborLanding.test.tsx
          git fetch --no-tags --depth=1 origin 9967a123bff45446e7b40fb41101d077205f465a
          git show 9967a123bff45446e7b40fb41101d077205f465a:tests/e2e/parallax-shared-consumers.spec.ts > tests/e2e/parallax-shared-consumers.spec.ts
      - name: Confirm the restored Journal opens on protected main
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/parallax-shared-consumers.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-906-landed-settling
          path: artifacts/sounding-line/journal-906-settling-proof/**
          if-no-files-found: ignore
          retention-days: 30
