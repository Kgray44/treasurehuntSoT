name: Creator Community experience capture
run-name: Creator Community source-bound experience capture

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Experience capture (${{ matrix.batch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        batch: [batch-1, batch-2]
    env:
      CANDIDATE_SHA: 14b30bfcac8c0069ee09bbc1c89b57e10df7dcbe
      BASE_SHA: c6ad7cb674e8fe1d8780d5c7c66a46061c3f6f0d
      SC07_BATCH: ${{ matrix.batch }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 14b30bfcac8c0069ee09bbc1c89b57e10df7dcbe
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Capture the exact source with the production browser authority
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { createBrowserDiagnosticSession } from "./scripts/sounding-line/browser-diagnostics.mjs";
          import { experienceChangedPaths, runTrustedExperienceReplay } from "./scripts/sounding-line/experience-browser.mjs";
          import { planPairedEvidence } from "./scripts/sounding-line/experience-paired.mjs";
          import { experienceDigest, planProductExperience, validateExperienceEvidence } from "./scripts/sounding-line/product-experience.mjs";

          const root = process.cwd();
          const { BASE_SHA: baseSha, CANDIDATE_SHA: candidateSha, SC07_BATCH: mode, RUNNER_TEMP: temporary } = process.env;
          const partitions = {"batch-1":["chronicle.creation","spatial-pilot.experience","crossdeck.refit.published-lens","homeport.community.public-projection","homeport.phase7.account.canonical-lifecycle","homeport.transition.auth-routes","admiralty.phase1.registry","admiralty.phase2.community-operations-providers","reach.phase1.foundation","homeport.shell.crossdeck-companion","homeport.shell.crossdeck-companion-mobile","parallax.floating-controls.experience","parallax.rooms-and-surfaces.experience","parallax.parametric-room-correction.experience","parallax.protected-photo-room.experience","parallax.integration.pilot-owner-boundary"],"batch-2":["homeport.community.quarantine","homeport.community.voyage-logs","homeport.owner-correction.round1.workspaces","homeport.passport.product-surface","homeport.transition.reduced-motion","admiralty.phase2.read-projection-redaction","admiralty.phase2.account-dossier-support","admiralty.phase2.registry-activation","crossdeck.phase2.continuity","homeport.shell.crossdeck-access-recovery","crossdeck.refit.companion","parallax.sc00b.inspector.experience","parallax.authored-library-and-simulation.experience","parallax.scene-manager.experience","parallax.spatial-community-publishing.experience"]};
          const plan = planProductExperience({ root, baseSha, candidateSha, changedPaths: experienceChangedPaths(root, baseSha, candidateSha) });
          assert.equal(plan.sourceDigest, "53d2c54b642ecb7fbeecd628b60dc665f4a5890b13aeee635b418ff2503b987f");
          assert.equal(plan.contractDigest, "6c7c1c0af5d3535de78c4ec34e16582e2e68a8dc46af94762073aa1a819ecf7a");
          assert.equal(plan.exception, undefined);
          assert.equal(plan.contracts.length, 32);
          const ids = partitions[mode];
          const contracts = plan.contracts.filter(({ id }) => ids.includes(id));
          assert.deepEqual(contracts.map(({ id }) => id), ids);
          const generic = plan.contracts.filter(({ experience }) => (experience.fixtureProfile ?? "generic") === "generic");
          assert.deepEqual(new Set(Object.values(partitions).flat()), new Set(generic.map(({ id }) => id)));
          const outputDirectory = "artifacts/sc07-experience-" + candidateSha.slice(0, 12) + "/" + mode;
          const scoped = { ...plan, contracts, outputDirectory };
          const paired = planPairedEvidence(contracts);
          if (paired) scoped.paired = paired;
          else delete scoped.paired;
          const diagnostics = createBrowserDiagnosticSession(root, { baseSha, candidateSha, planDigest: experienceDigest(scoped) });
          const result = await runTrustedExperienceReplay({ root, plan: scoped, diagnostics });
          assert.equal(result.status, "PASS");
          const { runtime, profile } = await diagnostics.read();
          assert.equal(runtime.lifecycle.capture, "PASS");
          assert.equal(runtime.lifecycle.cleanup.status, "PASS");
          assert.equal(runtime.lifecycle.cleanup.portsReleased, true);
          assert.equal(profile.status, "PASS");
          assert.deepEqual(runtime.diagnosticBinding, profile.diagnosticBinding);

          const capturePath = outputDirectory + "/capture.json";
          const receiptPath = outputDirectory + "/verified-execution.json";
          const capture = JSON.parse(fs.readFileSync(capturePath, "utf8"));
          const pairedIds = new Set((capture.pairedEvidence?.cases ?? []).flatMap(({ artifactIds }) => artifactIds));
          capture.artifacts = capture.artifacts.filter(({ id, type }) => type !== "trace" || pairedIds.has(id));
          validateExperienceEvidence({ root, plan: scoped, evidence: capture, automatedOnly: true });
          fs.writeFileSync(capturePath, JSON.stringify(capture, null, 2) + "\n");
          const captureDigest = experienceDigest(capture);
          fs.writeFileSync(receiptPath, JSON.stringify({ status: result.status, baseSha, candidateSha,
            sourceDigest: result.sourceDigest, contracts: ids, captureDigest, captureAuthority: "HOSTED_ISOLATED",
            runId: process.env.GITHUB_RUN_ID, runtime: { capture: runtime.lifecycle.capture, cleanup: runtime.lifecycle.cleanup.status,
              portsReleased: runtime.lifecycle.cleanup.portsReleased }, profile: profile.status }, null, 2) + "\n", { flag: "wx" });
          const pair = capture.pairedEvidence;
          const companions = pair ? [pair.report, pair.profile, pair.runtime, ...pair.cases.map(({ witness }) => witness)] : [];
          const files = [...new Set([capturePath, receiptPath, ...[...capture.artifacts, ...companions].map(({ path: file }) => file)])];
          let bytes = 0;
          for (const file of files) {
            assert(file.startsWith(outputDirectory + "/") && file === path.posix.normalize(file) && !/[\r\n\\]/u.test(file));
            const info = fs.lstatSync(file);
            assert(info.isFile() && info.size <= 95 * 1024 ** 2);
            bytes += info.size;
          }
          assert(bytes <= 1200 * 1024 ** 2 && files.length <= 800);
          fs.writeFileSync(path.join(temporary, "sc07-files.txt"), files.join("\n") + "\n");
          console.log(JSON.stringify({ status: "CAPTURE_READY_FOR_INDEPENDENT_REVIEW", mode, baseSha, candidateSha,
            sourceDigest: plan.sourceDigest, captureDigest, files: files.length, bytes, journeys: capture.journeys.length, paired: pair?.cases.length ?? 0 }));
          EOF
          tar -cf "$RUNNER_TEMP/sc07-evidence.tar" --verbatim-files-from -T "$RUNNER_TEMP/sc07-files.txt"
          cd "$RUNNER_TEMP"
          sha256sum sc07-evidence.tar > sc07-evidence.tar.sha256
      - name: Publish only bounded synthetic review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sc07-14b30bfcac8c-${{ matrix.batch }}
          path: |
            ${{ runner.temp }}/sc07-evidence.tar
            ${{ runner.temp }}/sc07-evidence.tar.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
