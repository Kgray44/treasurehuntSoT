name: Player invitation contrast diagnostic
run-name: Prove the invitation contrast regression and its focused repair

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  contrast:
    name: Read computed contrast during the invitation handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 1d76ff945c81b25615fb1212426bb1e1e4ff47e4
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: 1d76ff945c81b25615fb1212426bb1e1e4ff47e4
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d76ff945c81b25615fb1212426bb1e1e4ff47e4
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Reproduce the contrast transition before changing the source
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cat >> tests/e2e/access-gates.spec.ts <<'SPEC'

          test("the Player invitation form stays readable while it slides into view", async ({ page }) => {
            await page.emulateMedia({ reducedMotion: "no-preference" });
            await page.goto("/player/sign-in");
            const samples = await page.evaluateHandle(() => {
              const samples: { opacity: number; moving: boolean }[] = [];
              const observer = new MutationObserver(() => {
                const form = document.querySelector<HTMLElement>("#invitation-code");
                if (!form) return;
                const style = getComputedStyle(form);
                samples.push({ opacity: Number(style.opacity), moving: style.transform !== "none" });
              });
              observer.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["style"] });
              return { samples, stop: () => observer.disconnect() };
            });
            try {
              await page.getByRole("tab", { name: "Invitation code" }).focus();
              await page.keyboard.press("Enter");
              const form = page.locator("#invitation-code");
              await expect(form.getByRole("button", { name: "Find my invitation" })).toBeVisible();
              await expect(form).toHaveCSS("transform", "none");
              const frames = await samples.evaluate((record) => record.samples);
              expect(frames.some((frame) => frame.moving)).toBe(true);
              expect(frames.filter((frame) => frame.opacity < 1), "Invitation form opacity samples").toEqual([]);
              expect((await page.request.get("/api/player/library")).status()).toBe(401);
            } finally {
              await samples.evaluate((record) => record.stop());
              await samples.dispose();
            }
          });
          SPEC
          cat > "$RUNNER_TEMP/harbor-invitation-focus.mjs" <<'EOF'
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          await runJob({id:"harbor-invitation-focus",kind:"browser",files:["tests/e2e/access-gates.spec.ts"]},
            {base:process.env.BASE_SHA,tree:process.env.CANDIDATE_SHA});
          EOF
          if node --input-type=module < "$RUNNER_TEMP/harbor-invitation-focus.mjs" 2>&1 | tee "$RUNNER_TEMP/invitation-red.log"; then
            echo 'Expected a failing opacity assertion in the original invitation panel'
            exit 1
          fi
          grep -F 'Error: Invitation form opacity samples' "$RUNNER_TEMP/invitation-red.log"
      - name: Keep the invitation panel opaque and verify the complete focused suite
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/platform/PlayerSignIn.tsx")
          text = path.read_text()
          marker = 'id="invitation-code"'
          before, after = text.split(marker, 1)
          old = '''\n                initial={{ opacity: 0, x: mode === "reduced" ? 0 : stateToken.distancePx }}
                          animate={{ opacity: 1, x: 0 }}
                          exit={{ opacity: 0, x: mode === "reduced" ? 0 : stateToken.distancePx / 2 }}'''
          new = '''\n                initial={{ x: mode === "reduced" ? 0 : stateToken.distancePx }}
                          animate={{ x: 0 }}
                          exit={{ x: mode === "reduced" ? 0 : stateToken.distancePx / 2 }}'''
          assert after.count(old) == 1
          path.write_text(before + marker + after.replace(old, new, 1))
          PY
          git diff --check
          node --input-type=module < "$RUNNER_TEMP/harbor-invitation-focus.mjs"
