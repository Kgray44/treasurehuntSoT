name: Lanternwake isolated Linux benchmark
run-name: Recorded Journal comparison using a raster copy of the existing paper grain

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Recorded Journal grain (${{ matrix.texture }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        texture: [control, bitmap]
    timeout-minutes: 22
    env:
      JOURNAL_COMPARE_BROWSER: shell
      JOURNAL_COMPARE_CAPTURE: record
      CANDIDATE_SHA: ${{ github.sha }}
      BASE_SHA: fc813a4c03a4916c6b0aab346abbb8b1caa8cf38
      FOREVER_VALIDATION_SOURCE_SHA: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Render the current grain tile as a transparent bitmap
        if: matrix.texture == 'bitmap'
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";
          import { chromium } from "playwright";
          const original = await readFile("public/textures/paper-grain.svg");
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 180, height: 180 }, deviceScaleFactor: 1 });
            await page.setContent('<style>body{margin:0}</style><img alt="" src="data:image/svg+xml;base64,' + original.toString("base64") + '">');
            await page.locator("img").evaluate(image => image.decode());
            await page.screenshot({ path: "public/textures/paper-grain-benchmark.png", omitBackground: true });
          } finally {
            await browser.close();
          }
          for (const file of ["src/styles/player.css", "src/styles/chronicle.css", "src/components/player/journal/ChronicleJournalSession.module.css"]) {
            const source = await readFile(file, "utf8");
            if (!source.includes("/textures/paper-grain.svg")) throw new Error("Missing grain binding: " + file);
            await writeFile(file, source.replaceAll("/textures/paper-grain.svg", "/textures/paper-grain-benchmark.png"));
          }
          EOF
      - name: Run unchanged recorded canonical workload and performance budgets
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-raster-grain-${{ matrix.texture }}
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/*
          if-no-files-found: ignore
          retention-days: 30
