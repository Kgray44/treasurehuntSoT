name: Lanternwake isolated Linux benchmark
run-name: Verify exact canonical Journal cover timing on desktop and mobile

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Canonical Journal settling (exact source)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: ef6d31b1b80e9ffbdf980ddc2b63f45514965760
      BASE_SHA: fc813a4c03a4916c6b0aab346abbb8b1caa8cf38
      FOREVER_VALIDATION_SOURCE_SHA: ef6d31b1b80e9ffbdf980ddc2b63f45514965760
      NEXT_TELEMETRY_DISABLED: "1"
      HOME_PRODUCT_ROLE: exact-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef6d31b1b80e9ffbdf980ddc2b63f45514965760
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Install only the already measured browser diagnostic
        run: |
          git fetch --no-tags --depth=1 origin "9967a123bff45446e7b40fb41101d077205f465a"
          git show "9967a123bff45446e7b40fb41101d077205f465a:tests/e2e/parallax-shared-consumers.spec.ts" > tests/e2e/parallax-shared-consumers.spec.ts
          npx --no-install prettier --check src/components/player/journal/ChronicleJournalSession.module.css src/animation/scenes/arrival.scene.ts src/animation/platform/RouteMotionBoundary.tsx
      - name: Verify normal-motion Journal settling on the exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/parallax-shared-consumers.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-906-exact-canonical-settling
          path: artifacts/sounding-line/journal-906-settling-proof/**
          if-no-files-found: ignore
          retention-days: 30
