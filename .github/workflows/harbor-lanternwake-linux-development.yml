name: Lanternwake isolated Linux benchmark
run-name: Measure the live mobile account dossier geometry

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  mobile-dossier:
    name: Mobile account dossier ID and keyboard Copy
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CANDIDATE_SHA: a3a9857ca3cf5f75ddcae639129389a812a2e4f4
      BASE_SHA: 5be59f18590f2c48a4a7672a14a25dee5bf0e82d
      FOREVER_VALIDATION_SOURCE_SHA: a3a9857ca3cf5f75ddcae639129389a812a2e4f4
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3a9857ca3cf5f75ddcae639129389a812a2e4f4
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Verify visible account ID and keyboard clipboard readback in Chromium
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "88f198ff10f017f161d9b0e060452efc2c712a31"
          test "$(git rev-parse HEAD:native)" = "6795af566a32e2196088551de5b5c89840cc589f"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/admiralty-dossier-mobile.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain bounded failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-mobile-dossier-layout-diagnostic
          path: test-results/**/test-failed-1.png
          if-no-files-found: ignore
          retention-days: 7
