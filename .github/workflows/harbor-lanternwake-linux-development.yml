name: Lanternwake isolated Linux benchmark
run-name: Measure main and Native with full recording on Metal and the existing Darwin diagnostic guardian

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Canonical recorded workload on hosted Metal (${{ matrix.lane }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: main
            source: 627a4e651641b6765ac789d378672ea6e903c120
          - lane: native
            source: e68eb73782ba4e13ac3fca30972c6f72f02d7314
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: ${{ matrix.source }}
      BASE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
      FOREVER_VALIDATION_SOURCE_SHA: ${{ matrix.source }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Confirm Metal and preserve the full canonical benchmark
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD:tests/config/playwright/playwright.phase3-performance.config.ts)" = "4347403eaf7ccbcc7fe0cf1dca8f62f148f24857"
          git fetch --no-tags --depth=1 origin 186e0d868f5cb1aaf542e7885486f7e5ce144f16
          git show 186e0d868f5cb1aaf542e7885486f7e5ce144f16:tests/e2e/phase3-performance.spec.ts > tests/e2e/phase3-performance.spec.ts
          test "$(git hash-object tests/e2e/phase3-performance.spec.ts)" = "ce468f106d9bf65548db3ad638af36c7a9cd5196"
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const configPath="tests/config/playwright/playwright.phase3-performance.config.ts";
          const config=fs.readFileSync(configPath,"utf8");
          const origin='use: { browserName: "chromium" }';
          if (config.split(origin).length!==2) throw Error("The exact browser-channel anchor is required.");
          fs.writeFileSync(configPath,config.replace(origin,'use: { browserName: "chromium", channel: "chromium" }'));
          const browser = await chromium.launch({channel:"chromium"});
          try {
            const session = await browser.newBrowserCDPSession();
            const {gpu}=await session.send("SystemInfo.getInfo");
            const receipt={
              renderer:gpu.auxAttributes?.glRenderer,
              compositor:gpu.featureStatus?.gpu_compositing,
              raster:gpu.featureStatus?.rasterization,
            };
            console.log("LANTERNWAKE_HOSTED_METAL "+JSON.stringify(receipt));
            if (!receipt.renderer?.includes("Metal") || !receipt.compositor?.startsWith("enabled") || !receipt.raster?.startsWith("enabled"))
              throw Error("The hosted Chromium instance did not expose a hardware Metal compositor and rasterizer.");
          } finally {
            await browser.close();
          }
          EOF
      - name: Select the existing Darwin diagnostic guardian for this isolated macOS job
        run: |
          git fetch --no-tags --depth=1 origin f3edff6df19885a14acf5f97990ed355be5777a2
          git show f3edff6df19885a14acf5f97990ed355be5777a2:scripts/sounding-line/owned-process-darwin-diagnostic.py > scripts/sounding-line/owned-process-darwin-diagnostic.py
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          if (process.platform !== "darwin" || process.env.GITHUB_ACTIONS !== "true") throw Error("Ephemeral macOS is required");
          const file = "scripts/sounding-line/owned-process.mjs";
          let source = fs.readFileSync(file,"utf8");
          const replacements = [
            ['new URL("./owned-process-linux.py", import.meta.url)', 'new URL(process.platform === "darwin" ? "./owned-process-darwin-diagnostic.py" : "./owned-process-linux.py", import.meta.url)'],
            ['record.windows ? "WINDOWS_JOB_OBJECT" : "LINUX_SUBREAPER_AND_PIDFD"', 'record.windows ? "WINDOWS_JOB_OBJECT" : process.platform === "darwin" ? "DARWIN_DIAGNOSTIC_PROCESS_GROUP" : "LINUX_SUBREAPER_AND_PIDFD"'],
          ];
          for (const [before, after] of replacements) {
            if (source.split(before).length !== 2) throw Error("Unexpected launcher anchor");
            source = source.replace(before, after);
          }
          fs.writeFileSync(file,source);
          EOF
      - name: Measure every original budget with normal recording
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          sysctl hw.memsize
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-hosted-metal-${{ matrix.lane }}
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/phase3-performance-metrics.json
          if-no-files-found: ignore
          retention-days: 30



