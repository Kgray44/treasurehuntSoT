name: Lanternwake isolated Linux benchmark
run-name: Creator Community exact scroll geometry diagnosis

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Creator moderation scroll geometry (development)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 2ea51d0e0e8d07b9aec96ef56e3787a98ece57aa
      BASE_SHA: c6ad7cb674e8fe1d8780d5c7c66a46061c3f6f0d
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ea51d0e0e8d07b9aec96ef56e3787a98ece57aa
          fetch-depth: 8
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify the complete generic browser profile
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { runJob, snapshotReader } from "./scripts/sounding-line-v3/checks.mjs";
          import { changes, registry, select } from "./scripts/sounding-line-v3/plan.mjs";
          import { resolveBrowserSuiteDispatches } from "./scripts/sounding-line/browser-suite-profiles.mjs";
          const base = process.env.BASE_SHA;
          const tree = process.env.CANDIDATE_SHA;
          const plan = select(changes(base, tree), snapshotReader(tree), { projects: [], suites: [] }, registry(tree), snapshotReader(base));
          const selected = plan.jobs.find(({ id }) => id === "browser").files;
          const profile = resolveBrowserSuiteDispatches(selected).find(({ browserTests }) =>
            browserTests.includes("tests/e2e/sc07-creator-community.spec.ts"));
          assert(profile.browserTests.includes("tests/e2e/crossdeck-phase2.spec.ts"));
          assert(profile.browserTests.length < selected.length);
          console.log(JSON.stringify({ purpose: "DEVELOPMENT_ONLY", selectedGenericSpecs: profile.browserTests.length }));
          await runJob({ id: "creator-generic-sequence", kind: "browser", files: profile.browserTests }, { base, tree });
          EOF
