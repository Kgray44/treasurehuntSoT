name: Player invitation contrast diagnostic
run-name: Isolate the approved Creator listing navigation failure

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  contrast:
    name: Trace the installed Chapter template release handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: d2d80e1a0c0951d3d8edc4b20501f0a697a05130
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: d2d80e1a0c0951d3d8edc4b20501f0a697a05130
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2d80e1a0c0951d3d8edc4b20501f0a697a05130
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Trace the approved Chapter template navigation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python - <<'PY'
          from pathlib import Path
          p=Path("tests/e2e/sc07-creator-community.spec.ts")
          source=p.read_text()
          old='''  await installerPage.goto("/community/templates");
            await installerPage.locator(listingLink).first().press("Enter");
            const install = installerPage.getByRole("button", { name: "Install to my reusable Library" });
            await expect(installerPage.getByText(/release 2\\.0\\.0 by Synthetic owner Creator/)).toBeVisible();'''
          new='''  const interaction = [];
            installerPage.on("framenavigated", (frame) => {
              if (frame === installerPage.mainFrame()) interaction.push({ event: "navigation", pathname: new URL(frame.url()).pathname });
            });
            installerPage.on("response", (response) => {
              const url = new URL(response.url());
              if (url.pathname === `/community/${slug}` || url.pathname === "/community/templates") {
                interaction.push({ event: "response", status: response.status(), pathname: url.pathname, rsc: url.searchParams.has("_rsc") });
              }
            });
            await installerPage.goto("/community/templates");
            const candidateLink = installerPage.locator(listingLink).first();
            await candidateLink.evaluate((anchor) => {
              const events: string[] = [];
              window.addEventListener("keydown", (event) => { if (event.key === "Enter") events.push("keydown:" + (event.target === anchor)); }, true);
              window.addEventListener("click", (event) => { if (event.target === anchor) events.push("click"); }, true);
              Object.assign(window, { __harborListingEvents: events });
            });
            const before = await candidateLink.evaluate(anchor=>({ visible: Boolean(anchor.getClientRects().length), text: anchor.textContent, href: anchor.getAttribute("href") }));
            await candidateLink.press("Enter");
            const install = installerPage.getByRole("button", { name: "Install to my reusable Library" });
            try {
              await expect(installerPage.getByText(/release 2\\.0\\.0 by Synthetic owner Creator/)).toBeVisible();
            } finally {
              const after = await installerPage.evaluate(() => ({
                pathname: location.pathname,
                heading: document.querySelector("main h1")?.textContent,
                focused: document.activeElement?.tagName,
                events: Reflect.get(window, "__harborListingEvents") || [],
              })).catch(()=>null);
              console.log("HARBOR_RELEASE_NAVIGATION " + JSON.stringify({ before, after, interaction }));
            }'''
          assert source.count(old)==1
          p.write_text(source.replace(old,new,1))
          PY
          node --input-type=module <<'EOF'
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          await runJob({id:"harbor-creator-listing-navigation",kind:"browser",files:["tests/e2e/sc07-creator-community.spec.ts"]},
            {base:process.env.BASE_SHA,tree:process.env.CANDIDATE_SHA});
          EOF
