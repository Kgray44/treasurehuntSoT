name: Lanternwake isolated Linux benchmark
run-name: Lanternwake standard macOS Chromium renderer probe

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Chromium graphics (development)
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e612bd42dee2561d75dfac9263ac3307d5dee24
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /package.json
            /package-lock.json
            /bridgewatch/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Read the graphics device exposed to the runner
        run: system_profiler SPDisplaysDataType -detailLevel mini
      - name: Read the compositor actually selected by Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          for (const [mode, args] of [["default", []], ["enable-gpu", ["--enable-gpu"]]]) {
            const browser = await chromium.launch({ channel: "chromium", args });
            try {
              const cdp = await browser.newBrowserCDPSession();
              const {gpu} = await cdp.send("SystemInfo.getInfo");
              console.log(JSON.stringify({purpose: "DEVELOPMENT_ONLY", mode, renderer: gpu.auxAttributes?.glRenderer,
                compositor: gpu.featureStatus?.gpu_compositing, rasterization: gpu.featureStatus?.rasterization}));
            } finally {
              await browser.close();
            }
          }
          EOF
