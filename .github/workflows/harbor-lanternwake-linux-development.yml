name: Lanternwake isolated Linux benchmark
run-name: Verify the proposed independent Journal repair and identify its experience contracts

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  canonical-budget:
    name: Tracked timing spec on the exact independent Journal repair
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 800506afe2538d67e6f144f3f9b1e5115c7b8d5e
      BASE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
      FOREVER_VALIDATION_SOURCE_SHA: 800506afe2538d67e6f144f3f9b1e5115c7b8d5e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 800506afe2538d67e6f144f3f9b1e5115c7b8d5e
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify the exact tracked timing spec and browser config
        run: |
          test "$(git rev-parse HEAD^{tree})" = "9118958cffa5dc6d9d83e82d0adbff1c0f1b14b0"
          test "$(git hash-object tests/e2e/phase3-performance.spec.ts)" = "2e10c383fa2accb79fbad09f92d61631b23e2d78"
          test "$(git hash-object playwright.config.ts)" = "e43e9912bc263909c58a31ded843a25209761917"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          npx --no-install prettier --check tests/e2e/phase3-performance.spec.ts
      - name: Measure all unchanged Journal budgets
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-independent-repair-all-budgets
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/*
          if-no-files-found: ignore
          retention-days: 30
  experience-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 800506afe2538d67e6f144f3f9b1e5115c7b8d5e
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /testing/
            /src/
            **/*.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Print the source-bound experience plan
        env:
          BASE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
          CANDIDATE_SHA: 800506afe2538d67e6f144f3f9b1e5115c7b8d5e
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "9118958cffa5dc6d9d83e82d0adbff1c0f1b14b0"
          node --input-type=module > "$RUNNER_TEMP/native-experience-source-objects" <<'EOF'
          import { execFileSync } from "node:child_process";
          import { sourceSnapshotReadsPath } from "./scripts/sounding-line/product-experience.mjs";
          const blobs=new Set();
          for(const revision of [process.env.BASE_SHA,process.env.CANDIDATE_SHA]){
            const tree=execFileSync("git",["ls-tree","-rz",revision],{encoding:"utf8",maxBuffer:32*1024*1024});
            for(const entry of tree.split("\0").filter(Boolean)){
              const [metadata,file]=entry.split("\t");
              const [,type,oid]=metadata.split(" ");
              if(type==="blob" && sourceSnapshotReadsPath(file)) blobs.add(oid);
            }
          }
          console.log([...blobs].sort().join("\n"));
          EOF
          GIT_NO_LAZY_FETCH=1 git cat-file --batch-check < "$RUNNER_TEMP/native-experience-source-objects" |
            awk '$2=="missing" { print $1 }' > "$RUNNER_TEMP/native-experience-missing-objects"
          if [[ -s "$RUNNER_TEMP/native-experience-missing-objects" ]]; then
            git fetch --no-tags --no-write-fetch-head --filter=blob:none origin --stdin < "$RUNNER_TEMP/native-experience-missing-objects"
          fi
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { planProductExperience } from "./scripts/sounding-line/product-experience.mjs";
          const root=process.cwd();
          const baseSha=process.env.BASE_SHA;
          const candidateSha=process.env.CANDIDATE_SHA;
          const changedPaths=execFileSync("git",["diff","--name-only","--no-renames",baseSha,candidateSha],{encoding:"utf8"}).trim().split("\n");
          const plan=planProductExperience({root,baseSha,candidateSha,changedPaths});
          console.log("JOURNAL_EXPERIENCE_SCOPE "+JSON.stringify({
            baseSha,candidateSha,changedPaths,applicable:plan.applicable,classification:plan.classification,
            sourceDigest:plan.sourceDigest,contractDigest:plan.contractDigest,
            contracts:(plan.contracts??[]).map(item=>({id:item.id,profile:item.experience?.executionProfile})),
          }));
          EOF

