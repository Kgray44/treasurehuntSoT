name: Lanternwake isolated Linux benchmark
run-name: Verify the Native Scene Runtime from its protected merge

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  landed-smoke:
    name: Native Scene Runtime landed-tree browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CANDIDATE_SHA: e5d583d600ad82e1a81c7067c77c48b66aaea3c5
      BASE_SHA: 5be59f18590f2c48a4a7672a14a25dee5bf0e82d
      FOREVER_VALIDATION_SOURCE_SHA: e5d583d600ad82e1a81c7067c77c48b66aaea3c5
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e5d583d600ad82e1a81c7067c77c48b66aaea3c5
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Run the Native Scene receipt and real Voyage transfer suites
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "e8b2d6e1c29f7bd70f88d8aa50c25d05042d4d64"
          test "$(git rev-parse HEAD:native)" = "6795af566a32e2196088551de5b5c89840cc589f"
          test "$(git rev-parse "HEAD^1")" = "$BASE_SHA"
          test "$(git rev-parse "HEAD^2")" = "aa110c473e346abe89c4570369631bb8280d16ba"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/parallax-native-authority.spec.ts","tests/e2e/crossdeck-refit-recovery.spec.ts","tests/e2e/crossdeck-phase2.spec.ts","tests/e2e/spatial-chronicle-pilot.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF

