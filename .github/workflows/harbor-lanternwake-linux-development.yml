name: Player invitation contrast diagnostic
run-name: Measure invitation contrast through its browser transition

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  contrast:
    name: Read computed contrast during the invitation handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 1d76ff945c81b25615fb1212426bb1e1e4ff47e4
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: 1d76ff945c81b25615fb1212426bb1e1e4ff47e4
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d76ff945c81b25615fb1212426bb1e1e4ff47e4
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Measure the live and settled invitation panel
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cat > tests/e2e/harbor-invitation-contrast.diag.spec.ts <<'SPEC'
          import AxeBuilder from "@axe-core/playwright";
          import { expect, test } from "@playwright/test";
          
          test("measure actual invitation contrast during and after the mode handoff", async ({ page }, info) => {
            const reports = [];
            for (const reducedMotion of ["no-preference", "reduce"] as const) {
              await page.emulateMedia({ reducedMotion });
              await page.goto("/player/sign-in#invitation-code");
              const invitation = page.locator("#invitation-code");
              const button = invitation.getByRole("button", { name: "Find my invitation" });
              await expect(button).toBeVisible();
              const snapshot = () => button.evaluate((node) => {
                const style = getComputedStyle(node);
                const ancestors = [];
                for (let item: Element | null = node; item; item = item.parentElement) {
                  const current = getComputedStyle(item);
                  if (current.opacity !== "1" || item.id === "invitation-code")
                    ancestors.push({ id:item.id, opacity:current.opacity, transform:current.transform });
                }
                return {color:style.color, background:style.backgroundColor, ancestors};
              });
              const scan = async () => (await new AxeBuilder({page}).withRules(["color-contrast"]).analyze()).violations
                .flatMap(rule => rule.nodes.map(node => ({ target:node.target, summary:node.failureSummary })));
              const arrival = await snapshot();
              const early = await scan();
              await expect(invitation).toHaveCSS("opacity","1");
              const settled = await snapshot();
              const stable = await scan();
              const sourceOpacity = Number(arrival.ancestors.find(item=>item.id==="invitation-code")?.opacity);
              const controlled = [];
              if (reducedMotion==="no-preference") {
                for (const opacity of [0.08, 0.18, 0.35, 0.55, 0.75]) {
                  await invitation.evaluate((item, value)=>item.style.opacity=String(value),opacity);
                  controlled.push({ opacity, contrast:await scan() });
                }
                await invitation.evaluate(item=>item.style.opacity="1");
              }
              reports.push({reducedMotion,arrival,early,settled,stable,sourceOpacity,controlled});
              expect(stable).toEqual([]);
            }
            const body = JSON.stringify(reports);
            console.log("INVITATION_CONTRAST "+body);
            await info.attach("invitation-contrast", {body,contentType:"application/json"});
          });
          SPEC
          node --input-type=module <<'EOF'
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          await runJob({id:"harbor-invitation-contrast",kind:"browser",files:["tests/e2e/harbor-invitation-contrast.diag.spec.ts"]},
            {base:process.env.BASE_SHA,tree:process.env.CANDIDATE_SHA});
          EOF
