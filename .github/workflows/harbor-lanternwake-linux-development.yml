name: Validate exact source-bound Journal experience publication
run-name: Verify source-bound Journal Skip evidence against the protected base
on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml
permissions:
  contents: read
jobs:
  validate-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 283f42e5b0de23193237533d8548496ca197e5fa
          fetch-depth: 12
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /testing/
            /src/
            /app/
            /components/
            /lib/
            /styles/
            **/*.json
            /Development_Docs/Testing/Product_Experience/evidence/journal-skip/0a1fdf912b/
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Hydrate exact source and published media objects
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
          CANDIDATE_SHA: 283f42e5b0de23193237533d8548496ca197e5fa
        run: |
          git fetch --no-tags --depth=12 --filter=blob:none origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          node --input-type=module > "$RUNNER_TEMP/evidence-object-ids" <<'EOF'
          import { execFileSync } from "node:child_process";
          import { sourceSnapshotReadsPath } from "./scripts/sounding-line/product-experience.mjs";
          const git=(args)=>execFileSync("git",args,{encoding:"utf8",maxBuffer:64*1024*1024});
          const recordPath="Development_Docs/Testing/Product_Experience/candidate-review.json";
          const receipt=JSON.parse(git(["show",process.env.CANDIDATE_SHA+":"+recordPath]));
          const pair=receipt.pairedEvidence;
          const evidenceFiles=new Set([recordPath,...receipt.artifacts.map(a=>a.path),pair.report.path,pair.profile.path,pair.runtime.path,...pair.cases.map(c=>c.witness.path)]);
          const ids=new Set();
          for (const revision of [process.env.BASE_SHA,process.env.CANDIDATE_SHA]) {
            for (const entry of git(["ls-tree","-rz",revision]).split("\0").filter(Boolean)) {
              const i=entry.indexOf("\t");
              const [,type,oid]=entry.slice(0,i).split(" ");
              const file=entry.slice(i+1);
              if(type==="blob" && (sourceSnapshotReadsPath(file) || (revision===process.env.CANDIDATE_SHA && evidenceFiles.has(file)))) {
                ids.add(oid);
              }
            }
          }
          console.log([...ids].sort().join("\n"));
          EOF
          GIT_NO_LAZY_FETCH=1 git cat-file --batch-check < "$RUNNER_TEMP/evidence-object-ids" |
            awk '$2=="missing" { print $1 }' > "$RUNNER_TEMP/missing-evidence-object-ids"
          count=$(wc -l < "$RUNNER_TEMP/missing-evidence-object-ids")
          echo "Missing objects after path checkout: $count"
          test "$count" -le 100
          while IFS= read -r oid; do
            actual=$(gh api "repos/Kgray44/treasurehuntSoT/git/blobs/$oid" --jq '.content' | base64 --decode | git hash-object -w --stdin)
            test "$actual" = "$oid"
          done < "$RUNNER_TEMP/missing-evidence-object-ids"
      - name: Run the repository source-bound experience verifier
        env:
          BASE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
          CANDIDATE_SHA: 283f42e5b0de23193237533d8548496ca197e5fa
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { planProductExperience, verifyProductExperience } from "./scripts/sounding-line/product-experience.mjs";
          const root=process.cwd();
          const baseSha=process.env.BASE_SHA;
          const candidateSha=process.env.CANDIDATE_SHA;
          const changedPaths=execFileSync("git",["diff","--name-only","--no-renames",baseSha,candidateSha],{encoding:"utf8",maxBuffer:8*1024*1024}).trim().split("\n");
          const plan=planProductExperience({root,baseSha,candidateSha,changedPaths});
          if(!plan.applicable || plan.sourceDigest!=="e8cd334f089255752e02cbcc5420d8b367eae3816c0ad5bfd319674cb9d020bb" || plan.contractDigest!=="353a6515594fe39c41300eb093e5e1f78ac6e9293a6d3494a77131cd9f20f41f") throw new Error("Expected verified source and contract boundaries");
          const receipt=verifyProductExperience(root,candidateSha,plan);
          console.log("JOURNAL_SKIP_EXPERIENCE_VERIFICATION "+JSON.stringify({baseSha,candidateSha,receipt}));
          if(receipt.status!=="PASS") throw new Error("Product Experience evidence did not pass");
          EOF
