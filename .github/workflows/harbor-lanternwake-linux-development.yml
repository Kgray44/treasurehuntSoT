name: Lanternwake isolated Linux benchmark
run-name: Diagnose the Homeport Round 2 publication selection under the V3 checkout

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  homeport-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: refs/heads/main
            sha: 627a4e651641b6765ac789d378672ea6e903c120
          - ref: refs/pull/901/merge
            sha: 5f4e676df32d72c96b28e8d9f1a64abd4c2b858f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
      - name: Inspect exact publication history in the GitHub runner
        env:
          EXACT_REF: ${{ matrix.ref }}
          EXACT_SHA: ${{ matrix.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          file=Development_Docs/Projects/Project_Homeport/evidence/phase7-owner-correction-round2/experience-images-manifest.json
          expected=8e3900a734674cb58800878aaeaf91a0e9f2285e
          echo "shallow before: $(git rev-parse --is-shallow-repository)"
          git fetch --no-tags --filter=blob:none --unshallow origin "$EXACT_REF"
          echo "shallow after: $(git rev-parse --is-shallow-repository)"
          git merge-base --is-ancestor "$expected" HEAD
          actual="$(git log --diff-filter=A --format=%H -- "$file")"
          printf 'selected publication: %s\n' "$actual"
          printf 'expected publication: %s\n' "$expected"
          printf 'current tracked manifest blob: %s\n' "$(git rev-parse "HEAD:$file")"
          printf 'selected image manifest blob: %s\n' "$(git rev-parse "$actual:Experience_Images/manifest.json")"
          printf 'historical image manifest blob: %s\n' "$(git rev-parse "$expected:Experience_Images/manifest.json")"
          test "$actual" = "$expected"
