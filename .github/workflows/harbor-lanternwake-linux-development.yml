name: Ordinary verification scope for canonical Journal candidate
run-name: Read the ordinary Sounding Line plan for the exact Journal repairs
on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml
permissions:
  contents: read
jobs:
  ordinary-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef6d31b1b80e9ffbdf980ddc2b63f45514965760
          fetch-depth: 4
          persist-credentials: false
          sparse-checkout: |
            scripts
            testing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Print the source-only candidate ordinary plan
        env:
          BASE_SHA: fc813a4c03a4916c6b0aab346abbb8b1caa8cf38
          CANDIDATE_SHA: ef6d31b1b80e9ffbdf980ddc2b63f45514965760
        run: |
          git fetch --no-tags --filter=blob:none --depth=4 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          node scripts/sounding-line-v3/cli.mjs plan --base "$BASE_SHA" --head "$CANDIDATE_SHA" --json |
            jq -c '{base,tree,category,projects,jobs:[.jobs[]|{id,kind,fileCount:(.files|length)}],notes}'
