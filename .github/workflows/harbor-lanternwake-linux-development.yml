name: Lanternwake isolated Linux benchmark
run-name: Lanternwake unchanged desktop frame budget on hosted Windows

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Phase 3 performance only (development)
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 05f92b75885b35b5344dcbf76cf8993f2a840607
      BASE_SHA: aaf7aa6e80d0c71c02018432c1e8a66ef5e1e21f
      FOREVER_VALIDATION_SOURCE_SHA: 05f92b75885b35b5344dcbf76cf8993f2a840607
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Allow repository evidence paths on disposable Windows
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: 05f92b75885b35b5344dcbf76cf8993f2a840607
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Measure the original cold and warm desktop frame workload
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw "Unexpected source identity" }
          @'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-windows-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanternwake-hosted-windows-desktop-metrics
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/phase3-performance-metrics.json
          if-no-files-found: ignore
          retention-days: 30
