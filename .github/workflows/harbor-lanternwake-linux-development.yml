name: Sounding Line browser dependency transport
run-name: Qualify the standard Ubuntu archive for the required browser dependencies

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  browser-dependency-archive:
    name: Verify unchanged Playwright package coverage through the Ubuntu archive
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: f8873659a79379c17c86346bf2232428efe690fa
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: f8873659a79379c17c86346bf2232428efe690fa
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8873659a79379c17c86346bf2232428efe690fa
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use the Ubuntu HTTPS archive on the ephemeral runner
        run: |
          source=/etc/apt/sources.list.d/ubuntu.sources
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD:package-lock.json)" = "7e94051457947e82cf639d3162a7713d692bbce2"
          grep -E '^(URIs|Suites|Signed-By):' "$source"
          sudo sed -E -i 's|mirror[+]file:/etc/apt/apt-mirrors[.]txt|https://archive.ubuntu.com/ubuntu/|g; s|http://[^[:space:]]*[.]ec2[.]archive[.]ubuntu[.]com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' "$source"
          grep -E '^URIs:.*https://archive[.]ubuntu[.]com/ubuntu/' "$source"
          grep -E '^(URIs|Suites|Signed-By):' "$source"
      - name: Install full browser compatibility coverage
        timeout-minutes: 18
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Launch both required engines with the locked Playwright version
        run: |
          npx --no-install playwright --version
          node --input-type=module <<'EOF'
          import { chromium, webkit } from "playwright";
          for (const engine of [chromium, webkit]) {
            const browser = await engine.launch();
            try {
              const page = await browser.newPage();
              await page.setContent("<h1>Browser dependency proof</h1>");
              if (await page.getByRole("heading", { name: "Browser dependency proof" }).count() !== 1)
                throw new Error("Installed browser did not render the probe");
              console.log(engine.name(), browser.version(), "PASS");
            } finally {
              await browser.close();
            }
          }
          EOF
