name: Stage source-bound Harbor review evidence
run-name: Validate and stage the independently reviewed prerequisite evidence

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAPTURED_SHA: d2d80e1a0c0951d3d8edc4b20501f0a697a05130
      CAPTURED_TREE: a03102dd59d2b48ea98d6474b7b832264d0d11c3
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      TRANSPORT_RUN: "45216007396"
      TRANSPORT_ARTIFACT: "14839785717"
      TRANSPORT_DIGEST: sha256:ae04a2135f6759313f98613d5b32a4700e50e7c5c56526507f4c485f39c2b6b9
      TRANSPORT_NAME: harbor-d2d80-source-bound-review-media
      REVIEW_INPUT_DIGEST: 2cd9c22c6736e57d597aa243a967751b4c4e13202b8c4813a36b39d92eec1ad3
      PROOF_REF: refs/heads/codex/harbor-901-reviewed-proof-d2d80e1a0c09
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2d80e1a0c0951d3d8edc4b20501f0a697a05130
          fetch-depth: 64
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify the captured source and retrieve the reviewed bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CAPTURED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CAPTURED_TREE"
          git fetch --no-tags --filter=blob:none --depth=64 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CAPTURED_SHA"
          test -z "$(git ls-remote origin "$PROOF_REF")"
          mkdir -p "$RUNNER_TEMP/harbor-proof/media"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$TRANSPORT_ARTIFACT" |
            jq -e --arg run "$TRANSPORT_RUN" --arg digest "$TRANSPORT_DIGEST" --arg name "$TRANSPORT_NAME" '
              .digest == $digest and .name == $name and (.workflow_run.id | tostring) == $run
              and (.expired | not) and .size_in_bytes <= 440401920
            '
          gh run download "$TRANSPORT_RUN" --repo "$GITHUB_REPOSITORY" --name "$TRANSPORT_NAME" --dir "$RUNNER_TEMP/harbor-proof/media"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/.github/harbor-proof-input.json?ref=$GITHUB_SHA" > "$RUNNER_TEMP/harbor-proof/input.json"
          printf '%s  %s\n' "$REVIEW_INPUT_DIGEST" "$RUNNER_TEMP/harbor-proof/input.json" | sha256sum --check
          node --input-type=module <<'EOF'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const directory = join(process.env.RUNNER_TEMP, "harbor-proof");
          const input = JSON.parse(readFileSync(join(directory, "input.json"), "utf8"));
          if (input.candidateSha !== process.env.CAPTURED_SHA || input.baseSha !== process.env.BASE_SHA ||
              !Number.isInteger(input.iterations) || input.iterations < 1 || input.iterations > 3)
            throw new Error("Review input identity is invalid");
          const identities = {};
          for (const { folder, reviewerContext, report } of input.reviews) {
            if (!/^[a-z][a-z0-9-]+$/u.test(folder) || Object.hasOwn(identities, folder) ||
                !/^codex:\/root\/[a-z0-9_]+$/u.test(reviewerContext) || report.candidateSha !== input.candidateSha)
              throw new Error("Independent review is not bound to the candidate");
            identities[folder] = reviewerContext;
            mkdirSync(join(directory, folder));
            writeFileSync(join(directory, folder, "review.json"), JSON.stringify(report));
          }
          writeFileSync(join(directory, "reviewers.json"), JSON.stringify(identities));
          writeFileSync(join(directory, "evidence.mjs"), input.verifier);
          writeFileSync(join(directory, "iterations"), String(input.iterations));
          EOF
      - name: Assemble the independently accepted evidence and validate the commit
        shell: bash
        run: |
          directory="$RUNNER_TEMP/harbor-proof"
          node --check "$directory/evidence.mjs"
          node "$directory/evidence.mjs" stage "$BASE_SHA" "$CAPTURED_SHA" "$directory" "$directory/reviewers.json" "$(cat "$directory/iterations")"
          git add --sparse -f -- Development_Docs/Testing/Product_Experience/candidate-review.json "Development_Docs/Testing/Product_Experience/evidence/harbor-901/${CAPTURED_SHA:0:12}"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record independent Product Experience review for Harbor prerequisite"
          node "$directory/evidence.mjs" verify-commit "$BASE_SHA" "$CAPTURED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin "$PROOF_REF")"
          git push origin "HEAD:$PROOF_REF"
          test "$(git ls-remote origin "$PROOF_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'HARBOR_REVIEW_PROOF_SHA=%s\n' "$(git rev-parse HEAD)"

