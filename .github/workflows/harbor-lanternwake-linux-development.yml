name: Lanternwake isolated Linux benchmark
run-name: Compare original and isolated grain in the same hosted runner

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  canonical-budget:
    name: Journal recorded compositor comparison on one Ubuntu runner
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: d2a01fbcb5af901597db54ccab15904abb58dcef
      BASE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
      FOREVER_VALIDATION_SOURCE_SHA: d2a01fbcb5af901597db54ccab15904abb58dcef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2a01fbcb5af901597db54ccab15904abb58dcef
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Preserve canonical benchmark and unmodified recording settings
        run: |
          git fetch --no-tags --depth=1 origin 186e0d868f5cb1aaf542e7885486f7e5ce144f16
          git show 186e0d868f5cb1aaf542e7885486f7e5ce144f16:tests/e2e/phase3-performance.spec.ts > tests/e2e/phase3-performance.spec.ts
          test "$(git hash-object tests/e2e/phase3-performance.spec.ts)" = "ce468f106d9bf65548db3ad638af36c7a9cd5196"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git hash-object playwright.config.ts)" = "e43e9912bc263909c58a31ded843a25209761917"
          npx --no-install prettier --check src/components/player/journal/ChronicleJournalSession.tsx
      - name: Prepare two serial lanes on the same hosted runner
        run: |
          python3 - <<'PAIR_PATCH'
          import base64
          from pathlib import Path
          p = Path("tests/e2e/phase3-performance.spec.ts")
          text = p.read_text()
          split = "    const warmRuns:"
          insertion = "    await page.setViewportSize({ width: 1_440, height: 900 });"
          title = 'phase3Test(
  "canonical production Journal performance and lifecycle budgets",'
          open_line = "    const cold = await measuredFullOpening"
          assert all(text.count(marker)==1 for marker in [split, insertion, title, open_line])
          css = base64.b64decode("").decode()
          verify = base64.b64decode("").decode()
          tail = base64.b64decode("").decode()
          prefix = text.split(split, 1)[0]
          prefix = prefix.replace(title, 'phase3Test.describe.configure({mode: "serial"});
for (const lane of ["control", "static"] as const) {
phase3Test(
  "Journal compositor comparison: " + lane,')
          prefix = prefix.replace(insertion, css + insertion)
          prefix = prefix.replace(open_line, verify + open_line)
          prefix = prefix.replace('"P3-PERFORMANCE-CHAPTER"', '"P3-PERFORMANCE-CHAPTER-" + lane')
          p.write_text(prefix + tail)
          PAIR_PATCH
      - name: Measure control and exact source with untraced recording
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/phase3-performance.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-recorded-static-grain-pair-standard-ubuntu
          path: artifacts/sounding-line/lanternwake-phase3-*/**/phase3-performance/*
          if-no-files-found: ignore
          retention-days: 30

