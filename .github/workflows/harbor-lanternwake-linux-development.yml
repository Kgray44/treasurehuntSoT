name: Player invitation contrast diagnostic
run-name: Reproduce and verify the Player invitation helper copy contrast repair

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  contrast:
    name: Read computed contrast during the invitation handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 7c936058132544030feafc37fd05f2cfdc620d06
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: 7c936058132544030feafc37fd05f2cfdc620d06
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c936058132544030feafc37fd05f2cfdc620d06
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Prove the original helper copy uses the wrong color
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cat >> tests/e2e/access-gates.spec.ts <<'SPEC'

          test("Player invitation instructions use readable parchment ink", async ({ page }) => {
            await page.goto("/player/sign-in#invitation-code");
            const helper = page.locator("#invitation-code").getByText("Invitation links open the same ceremony automatically.", {
              exact: false,
            });
            await expect(helper).toBeVisible();
            await expect(helper, "Invitation instructions use parchment ink").toHaveCSS("color", "rgb(43, 42, 34)");
          });
          SPEC
          cat > "$RUNNER_TEMP/harbor-invitation-focus.mjs" <<'EOF'
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          await runJob({id:"harbor-invitation-help",kind:"browser",files:["tests/e2e/access-gates.spec.ts"]},
            {base:process.env.BASE_SHA,tree:process.env.CANDIDATE_SHA});
          EOF
          if node --input-type=module < "$RUNNER_TEMP/harbor-invitation-focus.mjs" 2>&1 | tee "$RUNNER_TEMP/help-red.log"; then
            echo 'Expected the original helper copy color assertion to fail'
            exit 1
          fi
          grep -F 'Error: Invitation instructions use parchment ink' "$RUNNER_TEMP/help-red.log"
      - name: Apply the shared parchment ink and verify both access surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          form = Path("src/components/platform/PlayerSignIn.tsx")
          text = form.read_text()
          old = '                id="invitation-code"\n'
          assert text.count(old) == 1
          form.write_text(text.replace(old, old + '                className={styles.invitationPanel}\n'))
          css = Path("src/components/platform/PlayerSignIn.module.css")
          text = css.read_text()
          old = ':global(.auth-mode-panel) .accountPanel p,\n'
          assert text.count(old) == 1
          css.write_text(text.replace(old, old + ':global(.auth-mode-panel) .invitationPanel p,\n'))
          PY
          git diff --check
          node --input-type=module <<'EOF'
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          await runJob({id:"harbor-invitation-help",kind:"browser",files:["tests/e2e/access-gates.spec.ts","tests/e2e/lanternwake-phase4.spec.ts"]},
            {base:process.env.BASE_SHA,tree:process.env.CANDIDATE_SHA});
          EOF
