name: Lanternwake isolated Linux benchmark
run-name: Smoke test explicit Journal Skip on protected main

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Verify landed tree and explicit Skip
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SKIP_LANE: patched
      CANDIDATE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
      BASE_SHA: d0f21b9dfc4a7390c34f94beedc72904e1431f1f
      FOREVER_VALIDATION_SOURCE_SHA: 627a4e651641b6765ac789d378672ea6e903c120
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_TREE: b0a8802278c11399f703a2fddf6f5e52ca470a13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 627a4e651641b6765ac789d378672ea6e903c120
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Verify mainline ancestry and stage the proven browser probe
        run: |
          git fetch --no-tags --depth=8 --filter=blob:none origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git fetch --no-tags --depth=1 origin "ca984d10b6af4ff666f00e4ef80aa052e784a07a"
          git show "ca984d10b6af4ff666f00e4ef80aa052e784a07a:tests/e2e/parallax-shared-consumers.spec.ts" > tests/e2e/parallax-shared-consumers.spec.ts
          test "$(git hash-object tests/e2e/parallax-shared-consumers.spec.ts)" = "35f9d2758a71811d8c1195fe7578a9225c37aacb"
      - name: Capture actual transition owners during requested Skip
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/parallax-shared-consumers.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF
      - name: Retain sanitized performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-skip-owners-landed
          path: artifacts/sounding-line/journal-skip-owners/**
          if-no-files-found: ignore
          retention-days: 30
