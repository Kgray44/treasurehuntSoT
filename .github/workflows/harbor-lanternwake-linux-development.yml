name: Lanternwake isolated Linux benchmark
run-name: Measure Parallax replay in independent fixture databases

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  native:
    name: Native candidate saved animation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: aa110c473e346abe89c4570369631bb8280d16ba
      BASE_SHA: 5be59f18590f2c48a4a7672a14a25dee5bf0e82d
      FOREVER_VALIDATION_SOURCE_SHA: aa110c473e346abe89c4570369631bb8280d16ba
      PARALLAX_A1_SOURCE_SHA: aa110c473e346abe89c4570369631bb8280d16ba
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa110c473e346abe89c4570369631bb8280d16ba
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Measure existing scene timing assertions without changing them
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "e8b2d6e1c29f7bd70f88d8aa50c25d05042d4d64"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          python3 <<'PY'
          from pathlib import Path
          test = Path("tests/e2e/parallax-authoring-refinements.spec.ts")
          source = test.read_text()
          for samples, start, phase in (("samples", "startX", "initial"), ("restoredSamples", "restoredStartX", "restored")):
              anchor = f"  expect(new Set({samples}.map((sample) => sample.x.toFixed(4))).size).toBeGreaterThan(5);"
              assert source.count(anchor) == 1
              line = (f'  console.log("HARBOR_PARALLAX_SAMPLE " + JSON.stringify({{phase: "{phase}", repeat: test.info().repeatEachIndex, start: {start}, position: {samples}.map((sample) => [sample.elapsedMs, sample.x])}}));')
              source = source.replace(anchor, line + "\n" + anchor)
          test.write_text(source)
          harness = Path("scripts/sounding-line-v3/checks.mjs")
          source = harness.read_text()
          anchor = "            await runBrowserProfile(profile, browserArgs, tree, fullBrowser, job.shard);"
          assert source.count(anchor) == 1
          probes = """            const probeFailures = [];
                      for (let attempt = 1; attempt <= 3; attempt++) {
                        console.log("HARBOR_PARALLAX_ISOLATED_ATTEMPT " + attempt);
                        try {
                          await runBrowserProfile(profile, browserArgs, tree, fullBrowser, job.shard);
                        } catch (error) {
                          probeFailures.push(error);
                        }
                      }
                      if (probeFailures.length) throw new Error("Focused geometry evidence failed in " + probeFailures.length + " of 3 fresh fixtures");"""
          harness.write_text(source.replace(anchor, probes))
          PY
          node --input-type=module <<'EOF'
          import { runJob } from "./scripts/sounding-line-v3/checks.mjs";
          await runJob(
            { id: "lanternwake-linux-development", kind: "browser", files: ["tests/e2e/parallax-authoring-refinements.spec.ts"] },
            { base: process.env.BASE_SHA, tree: process.env.CANDIDATE_SHA },
          );
          EOF


  main:
    name: Protected main saved animation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 5be59f18590f2c48a4a7672a14a25dee5bf0e82d
