name: Player invitation contrast diagnostic
run-name: Compare the Journal and browser cadence on the same host

on:
  push:
    branches:
      - codex/lanternwake-focused-development-cf6b1d6bbae4
    paths:
      - .github/workflows/harbor-lanternwake-linux-development.yml

permissions:
  contents: read

jobs:
  contrast:
    name: Measure baseline browser cadence around the unchanged Journal workload
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CANDIDATE_SHA: 30b60617981b748b5eb176128756942dc8c9e862
      BASE_SHA: 00420421bacc6e9b923c5e50852a83a858886131
      FOREVER_VALIDATION_SOURCE_SHA: 30b60617981b748b5eb176128756942dc8c9e862
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30b60617981b748b5eb176128756942dc8c9e862
          fetch-depth: 16
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.agents/
            /.github/
            /bridgewatch/
            /deploy/
            /docs/
            /native/
            /prisma/
            /public/
            /scripts/
            /src/
            /testing/
            /tests/
            /Development_Docs/**/*.json
            /Development_Docs/**/*.md
            /Development_Docs/**/*.mdx
            /Development_Docs/**/*.yaml
            /Development_Docs/**/*.yml
            /Development_Docs/**/*.txt
            /Development_Docs/**/*.sql
            /Development_Docs/**/*.csv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Measure the browser control and exact Journal workload
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags --filter=blob:none --depth=64 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git hash-object tests/e2e/phase3-performance.spec.ts)" = "2e10c383fa2accb79fbad09f92d61631b23e2d78"
          mkdir -p "$RUNNER_TEMP/harbor-cadence"
          test ! -e .harbor-cadence.diag.mjs
          cat > .harbor-cadence.diag.mjs <<'EOF'
          import { chromium, devices } from "playwright";
          const browser = await chromium.launch({headless:true});
          try {
           const page=await browser.newPage({...devices["Desktop Chrome"]});
           await page.setContent("<body style='margin:0;background:#0d1920'><main></main></body>");
           const results=[];
           for (const control of ["idle", "compositor-transform"]) {
            if (control==="compositor-transform") {
             await page.locator("main").evaluate(node=>{
              Object.assign(node.style,{width:"32rem",height:"24rem",background:"#d1bb83",willChange:"transform"});
              node.animate([{transform:"translateX(0)"},{transform:"translateX(108px)"}],{duration:1000,iterations:Infinity,direction:"alternate"});
             });
            }
            const result=await page.evaluate(async ()=>{
             const values=[];
             let prior;
             await new Promise(resolve=>{
              const frame=(time)=>{
               if(prior!==undefined) values.push(time-prior);
               prior=time;
               if(values.length===270) resolve(true);
               else requestAnimationFrame(frame);
              };
              requestAnimationFrame(frame);
             });
             const intervals=values.slice(30).sort((a,b)=>a-b);
             return {samples:intervals.length,p50Ms:intervals[Math.ceil(intervals.length*.5)-1],p95Ms:intervals[Math.ceil(intervals.length*.95)-1]};
            });
            results.push({control,...result});
           }
           console.log(JSON.stringify({phase:process.env.HARBOR_CONTROL_PHASE,device:devices["Desktop Chrome"].viewport,results}));
          } finally {
           await browser.close();
          }
          EOF
          lscpu | sed -n '1,20p'
          HARBOR_CONTROL_PHASE=before node .harbor-cadence.diag.mjs | tee "$RUNNER_TEMP/harbor-cadence/before.json"
          if node --input-type=module <<'EOF'
          import {runJob} from "./scripts/sounding-line-v3/checks.mjs";
          await runJob({id:"harbor-journal-cadence",kind:"browser",files:["tests/e2e/phase3-performance.spec.ts"]},
            {base:process.env.BASE_SHA,tree:process.env.CANDIDATE_SHA});
          EOF
          then
            echo PASS
          else
            echo FAILED
          fi
          HARBOR_CONTROL_PHASE=after node .harbor-cadence.diag.mjs | tee "$RUNNER_TEMP/harbor-cadence/after.json"
          output="$(find artifacts/sounding-line -name phase3-performance-metrics.json -type f | head -1)"
          test -s "$output"
          cp "$output" "$RUNNER_TEMP/harbor-cadence/journal.json"
          jq '{testedSource:.provenance.testedSourceSha, desktop:.metrics.desktopFrameP95Ms, ordinary:.metrics.ordinaryCumulativeLongTaskMs, failedBudgets}' "$output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-journal-host-cadence
          path: ${{ runner.temp }}/harbor-cadence/*.json
          if-no-files-found: error
          retention-days: 15
