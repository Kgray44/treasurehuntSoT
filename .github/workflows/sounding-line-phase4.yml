name: Sounding Line final closure

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "prisma/**"
      - "public/**"
      - "scripts/sounding-line/**"
      - "tests/sounding-line/**"
      - "testing/**"
      - "Development_Docs/Programs/Sounding_Line/**"
      - ".github/workflows/sounding-line-phase4.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
      - codex/project-sounding-line-final-program-closure
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "prisma/**"
      - "public/**"
      - "scripts/sounding-line/**"
      - "tests/sounding-line/**"
      - "testing/**"
      - "Development_Docs/Programs/Sounding_Line/**"
      - ".github/workflows/sounding-line-phase4.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sounding-line-final-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-local-gates:
    name: sounding-line-final-local-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:policy
      - run: npm run test:inventory
      - run: npm run test:runtime
      - run: npm run test:runtime:phase3
      - run: npm run test:runtime:phase4
      - run: npm run test:runtime:phase4:controller
      - run: npm run test:runtime:phase4:attestation
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm run docs:validate
      - run: npm run features:validate
      - run: npm run architecture:validate
      - run: npm run language:validate
      - run: npm run assets:validate
      - run: npm run private-content:scan
      - run: npm run build
      - if: always()
        run: npm run test:runtime:cleanup
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sounding-line-final-local-gates-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14
