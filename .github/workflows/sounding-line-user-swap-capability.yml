name: Sounding Line user swap capability
run-name: Sounding Line user swap capability on ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected commit with the reviewed bounded user-service test
        required: true
        type: string

permissions: {}

concurrency:
  group: sounding-line-user-swap-capability
  cancel-in-progress: false

jobs:
  observation:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Kgray44/treasurehuntSoT' && github.ref == 'refs/heads/main' && github.actor == 'Kgray44' && github.triggering_actor == 'Kgray44' && github.run_attempt == 1 && github.sha == inputs.source_sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Test zero swap in a disposable user service
        shell: bash
        env:
          OBSERVATION_SOURCE: ${{ inputs.source_sha }}
        run: |
          exec /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 SYSTEMD_PAGER=cat \
            OBSERVATION_SOURCE="$OBSERVATION_SOURCE" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_ARCH="$RUNNER_ARCH" ImageVersion="$ImageVersion" RUNNER_TRACKING_ID="$RUNNER_TRACKING_ID" \
            /usr/bin/python3 -IB - <<'PY'
          import hashlib
          import json
          import os
          import re
          import signal
          import stat
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          uid = os.getuid()
          source = os.environ["OBSERVATION_SOURCE"]
          run_id = os.environ["GITHUB_RUN_ID"]
          kernel = os.uname().release
          image = os.environ["ImageVersion"]
          tracking = os.environ.get("RUNNER_TRACKING_ID", "")
          if not (
              uid == os.geteuid() and uid > 0
              and re.fullmatch(r"[0-9a-f]{40}", source)
              and source == os.environ["GITHUB_SHA"] == os.environ["GITHUB_WORKFLOW_SHA"]
              and os.environ["RUNNER_ENVIRONMENT"] == "github-hosted"
              and os.environ["RUNNER_ARCH"] == "X64"
              and os.environ["GITHUB_RUN_ATTEMPT"] == "1"
              and re.fullmatch(r"[0-9]{1,20}", run_id)
              and re.fullmatch(r"[0-9.]{1,32}", image)
          ):
              raise SystemExit("USER_SWAP_SOURCE_IDENTITY_MISMATCH")

          unit = f"sounding-line-swap-{run_id}.service"
          group = f"/user.slice/user-{uid}.slice/user@{uid}.service/app.slice/{unit}"
          cgroup = Path("/sys/fs/cgroup") / group.lstrip("/")
          runtime = Path(f"/run/user/{uid}")
          bus = runtime / "bus"
          unit_root = runtime / "systemd/user"
          unit_file = unit_root / unit
          user_env = dict(
              os.environ, XDG_RUNTIME_DIR=str(runtime), DBUS_SESSION_BUS_ADDRESS=f"unix:path={bus}",
              SYSTEMD_LOG_TARGET="console", SYSTEMD_LOG_COLOR="0", SYSTEMD_LOG_LEVEL="info",
          )
          payload = r"""
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          expected, uid = sys.argv[1], int(sys.argv[2])
          root = Path("/sys/fs/cgroup") / expected.lstrip("/")
          worker = len(sys.argv) == 4
          print("USER_SWAP_PAYLOAD_ENTERED", file=sys.stderr, flush=True)

          def report_exception(_kind, error, _traceback):
              print("USER_SWAP_PAYLOAD_EXCEPTION", file=sys.stderr, flush=True)
              if isinstance(error, OSError) and isinstance(error.errno, int):
                  print(f"USER_SWAP_PAYLOAD_ERRNO={error.errno}", file=sys.stderr, flush=True)

          sys.excepthook = report_exception

          def verify():
              status = dict(line.split(":", 1) for line in Path("/proc/self/status").read_text().splitlines())
              if not (
                  os.getuid() == os.geteuid() == uid
                  and Path("/proc/self/cgroup").read_text().splitlines() == ["0::" + expected]
                  and status["NoNewPrivs"].strip() == "1"
                  and all(int(status[key].strip(), 16) == 0 for key in ("CapEff", "CapPrm", "CapAmb"))
                  and (root / "memory.swap.max").read_text().strip() == "0"
                  and (root / "memory.max").read_text().strip() == "134217728"
                  and (root / "pids.max").read_text().strip() == "8"
              ):
                  raise SystemExit("USER_SWAP_MEMBERSHIP_OR_LIMIT")

          def shmem():
              return int(dict(line.split() for line in (root / "memory.stat").read_text().splitlines())["shmem"])

          verify()
          size = 2 * 1024 * 1024
          if worker:
              before = shmem()
              with os.fdopen(os.memfd_create("sounding-line-synthetic"), "wb", buffering=0) as data:
                  if data.write(b"\xa5" * size) != size:
                      raise SystemExit("USER_SWAP_SHORT_SYNTHETIC_WRITE")
                  deadline = time.monotonic() + 3
                  delta = shmem() - before
                  while delta < size and time.monotonic() < deadline:
                      time.sleep(0.1)
                      delta = shmem() - before
                  swap = int((root / "memory.swap.current").read_text())
                  verify()
                  if delta < size or swap != 0:
                      raise SystemExit("USER_SWAP_CHARGE_OR_LIMIT")
                  print(json.dumps({"chargedShmemBytes": delta, "swapCurrentBytes": swap}), flush=True)
          else:
              child = subprocess.run(
                  [sys.executable, "-IB", __file__, expected, str(uid), "child"],
                  stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=6, check=False,
              )
              if child.returncode:
                  for line in child.stderr.splitlines():
                      print(line, file=sys.stderr)
                  raise SystemExit("USER_SWAP_DESCENDANT_FAILED")
              print(json.dumps(json.loads(child.stdout)), flush=True)
          """

          def service_diagnostic(stderr):
              lines = stderr[-8192:].splitlines()
              diagnostic = {"serviceFailureStage": "SYSTEMD_CLIENT_OR_STARTUP_UNCLASSIFIED"}
              causes = {
                  "USER_SWAP_MEMBERSHIP_OR_LIMIT", "USER_SWAP_SHORT_SYNTHETIC_WRITE",
                  "USER_SWAP_CHARGE_OR_LIMIT", "USER_SWAP_DESCENDANT_FAILED",
                  "USER_SWAP_PAYLOAD_EXCEPTION",
              }
              startup = {
                  "Failed to start transient service unit: ": "SYSTEMD_START_TRANSIENT_UNIT",
                  "Failed to connect to bus: ": "SYSTEMD_CONNECT_BUS",
                  "Failed to find executable ": "SYSTEMD_FIND_EXECUTABLE",
                  "Unknown assignment: ": "SYSTEMD_PROPERTY_ASSIGNMENT",
                  "Failed to parse ": "SYSTEMD_ARGUMENT_PARSE",
                  f"Job for {unit} failed": "SYSTEMD_START_JOB",
                  f"Failed to start {unit}: ": "SYSTEMD_START_UNIT",
                  f"Timed out starting {unit}": "SYSTEMD_START_JOB_TIMEOUT",
              }
              signals = {
                  "HUP", "INT", "QUIT", "ILL", "TRAP", "ABRT", "BUS", "FPE", "KILL", "USR1",
                  "SEGV", "USR2", "PIPE", "ALRM", "TERM", "STKFLT", "CHLD", "CONT", "STOP",
                  "TSTP", "TTIN", "TTOU", "URG", "XCPU", "XFSZ", "VTALRM", "PROF", "WINCH",
                  "IO", "PWR", "SYS",
              }
              if "USER_SWAP_PAYLOAD_ENTERED" in lines:
                  diagnostic["serviceFailureStage"] = "PAYLOAD_ENTERED"
              if f"Running as unit: {unit}" in lines:
                  diagnostic["systemdAcceptedUnit"] = True
                  if diagnostic["serviceFailureStage"] != "PAYLOAD_ENTERED":
                      diagnostic["serviceFailureStage"] = "SYSTEMD_UNIT_ACCEPTED_BEFORE_PAYLOAD"
              for line in lines:
                  if line in causes:
                      diagnostic.setdefault("payloadFailure", line)
                  if match := re.fullmatch(r"USER_SWAP_PAYLOAD_ERRNO=([0-9]{1,3})", line):
                      diagnostic["payloadErrno"] = int(match[1])
                  if match := re.fullmatch(
                      r"Finished with result: (success|resources|protocol|timeout|exit-code|signal|core-dump|watchdog|start-limit-hit|oom-kill|exec-condition)", line,
                  ):
                      diagnostic["systemdResult"] = match[1]
                  if match := re.fullmatch(
                      r"Main processes terminated with: code=(exited|killed|dumped)/status=(\S{1,12})", line,
                  ):
                      code, value = match.groups()
                      if ((code == "exited" and re.fullmatch(r"[0-9]{1,3}", value))
                          or (code != "exited" and (value in signals or re.fullmatch(r"RTMIN\+(?:[0-9]|[12][0-9]|30)", value)))):
                          diagnostic["systemdProcessCode"], diagnostic["systemdProcessStatus"] = code, value
                  for prefix, stage in startup.items():
                      if line.startswith(prefix) and diagnostic["serviceFailureStage"] != "PAYLOAD_ENTERED":
                          diagnostic["serviceFailureStage"] = stage
                          for reason in (
                              "Access denied", "Permission denied", "Operation not permitted",
                              "Invalid argument", "No such file or directory", "No medium found",
                              "Connection refused", "Unit already exists",
                          ):
                              if reason in line[len(prefix):]:
                                  diagnostic["systemdReason"] = reason
                          for prop in (
                              "MemorySwapMax", "MemoryMax", "TasksMax", "NoNewPrivileges",
                              "RuntimeMaxSec", "RuntimeMaxUSec", "TimeoutStartSec", "TimeoutStartUSec",
                              "TimeoutStopSec", "TimeoutStopUSec", "JobTimeoutSec", "JobTimeoutUSec",
                              "KillMode", "Restart", "StandardInputFileDescriptor",
                              "StandardOutputFileDescriptor", "StandardErrorFileDescriptor",
                          ):
                              if re.search(rf"\b{prop}\b", line[len(prefix):]):
                                  diagnostic["systemdProperty"] = prop
              return diagnostic

          def run(args, timeout):
              try:
                  result = subprocess.run(
                      args, env=user_env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE, text=True, errors="replace", timeout=timeout, check=False,
                  )
                  return result.returncode, result.stdout.strip(), result.stderr
              except subprocess.TimeoutExpired as error:
                  stderr = (error.stderr or b"")[-8192:].decode("utf-8", errors="replace")
                  return None, "", stderr
              except OSError:
                  return None, "", ""

          def load_state():
              return run(["/usr/bin/systemctl", "--user", "show", "--property=LoadState", "--value", unit], 2)[1]

          def user_bus_call(member, argument):
              return run([
                  "/usr/bin/busctl", f"--address=unix:path={bus}", "--timeout=2s", "call",
                  "org.freedesktop.systemd1", "/org/freedesktop/systemd1", "org.freedesktop.systemd1.Manager",
                  member, "s", argument,
              ], 3)

          def unloaded():
              code, _, stderr = user_bus_call("GetUnit", unit)
              return code == 1 and stderr.strip() == f"Call failed: Unit {unit} not loaded."

          def manager_on_user_bus():
              code, result, _ = run([
                  "/usr/bin/busctl", f"--address=unix:path={bus}", "--timeout=2s", "call",
                  "org.freedesktop.DBus", "/org/freedesktop/DBus", "org.freedesktop.DBus",
                  "NameHasOwner", "s", "org.freedesktop.systemd1",
              ], 3)
              return code == 0 and result == "b true"

          def present():
              try:
                  cgroup.stat()
              except FileNotFoundError:
                  return False
              return True

          cancelled = False
          waiting_for_start = False

          def interrupt(_signal, _frame):
              global cancelled
              if not cancelled:
                  cancelled = True
                  if waiting_for_start:
                      raise KeyboardInterrupt

          def owned_directory(path):
              info = path.lstat()
              return stat.S_ISDIR(info.st_mode) and info.st_uid == uid and not info.st_mode & 0o022

          def unit_text(scratch):
              clean_env = f"PATH=/usr/bin:/bin LANG=C.UTF-8 RUNNER_TRACKING_ID={tracking}"
              return (
                  "[Unit]\nJobTimeoutSec=8s\nCollectMode=inactive-or-failed\n"
                  "[Service]\nType=exec\nSlice=app.slice\n"
                  "MemorySwapMax=0\nMemoryMax=128M\nTasksMax=8\nNoNewPrivileges=yes\n"
                  "RuntimeMaxSec=12s\nTimeoutStartSec=5s\nTimeoutStopSec=2s\n"
                  "KillMode=control-group\nRestart=no\nLimitFSIZE=2M\n"
                  f"Environment=RUNNER_TRACKING_ID={tracking}\n"
                  f"StandardOutput=file:{scratch}/stdout\nStandardError=file:{scratch}/stderr\n"
                  f"ExecStart=/usr/bin/env -i {clean_env} /usr/bin/python3 -IB {scratch}/worker.py {group} {uid}\n"
              )

          def configured():
              code, output, _ = run([
                  "/usr/bin/systemctl", "--user", "--all", "show",
                  "--property=FragmentPath,DropInPaths,JobTimeoutUSec,RuntimeMaxUSec,TimeoutStartUSec,TimeoutStopUSec,LoadState",
                  unit,
              ], 3)
              return code == 0 and set(output.splitlines()) == {
                  f"FragmentPath={unit_file}", "JobTimeoutUSec=8s", "RuntimeMaxUSec=12s",
                  "TimeoutStartUSec=5s", "TimeoutStopUSec=2s", "LoadState=loaded", "DropInPaths=",
              }

          def read_output(path):
              with path.open("rb") as stream:
                  data = stream.read(8193)
              if len(data) > 8192:
                  raise ValueError("USER_SWAP_OUTPUT_LIMIT")
              return data.decode("utf-8", errors="replace").strip()

          status = "RUNNER_IMAGE_DRIFT"
          detail = {}
          cleanup = None
          if image == "20261101.347.1" and kernel == "6.8.0-1070-azure":
              in_observed_group = Path("/proc/self/cgroup").read_text().splitlines() == [
                  "0::/system.slice/hosted-compute-agent.service"
              ]
              status = "PRECONDITION_REFUSED"
              detail["observedRunnerGroup"] = in_observed_group
              detail["runnerTrackingAvailable"] = bool(re.fullmatch(r"[A-Za-z0-9_.:-]{1,128}", tracking))
              detail["userBusSocketPresent"] = bus.is_socket()
              detail["managerOnUserBus"] = detail["userBusSocketPresent"] and manager_on_user_bus()
              if all(detail.values()) and load_state() == "not-found" and not present():
                  scratch = None
                  created_root = owned_unit = start_requested = False
                  os.umask(0o077)
                  signal.signal(signal.SIGINT, interrupt)
                  signal.signal(signal.SIGTERM, interrupt)
                  try:
                      if not (owned_directory(runtime) and owned_directory(unit_root.parent)):
                          raise ValueError("USER_SWAP_RUNTIME_DIRECTORY_REFUSED")
                      try:
                          unit_root.mkdir(mode=0o700)
                          created_root = True
                      except FileExistsError:
                          pass
                      if not owned_directory(unit_root):
                          raise ValueError("USER_SWAP_RUNTIME_DIRECTORY_REFUSED")
                      scratch = Path(tempfile.mkdtemp(prefix=f"sl-swap-{run_id}-", dir=runtime))
                      (scratch / "worker.py").write_text(payload, encoding="ascii")
                      for name in ("stdout", "stderr"):
                          (scratch / name).touch(exist_ok=False)
                      with unit_file.open("x", encoding="ascii") as stream:
                          owned_unit = True
                          stream.write(unit_text(scratch))
                      detail["configuredDeadlinesVerified"] = configured()
                      status = "UNIT_CONFIGURATION_REFUSED"
                      if detail["configuredDeadlinesVerified"] and not cancelled:
                          status = "SERVICE_FAILED_OR_TIMED_OUT"
                          try:
                              waiting_for_start = True
                              if cancelled:
                                  raise KeyboardInterrupt
                              start_requested = True
                              returncode, _, stderr = run([
                                  "/usr/bin/systemctl", "--user", "--no-ask-password", "--job-mode=fail",
                                  "start", "--wait", unit,
                              ], 22)
                          finally:
                              waiting_for_start = False
                          detail["serviceExit"] = returncode
                          detail.update(service_diagnostic(stderr + "\n" + read_output(scratch / "stderr")))
                          if returncode == 0:
                              status = "SERVICE_RESULT_REFUSED"
                              measured = json.loads(read_output(scratch / "stdout"))
                              if measured["chargedShmemBytes"] >= 2 * 1024 * 1024 and measured["swapCurrentBytes"] == 0:
                                  detail["chargedShmemBytes"] = measured["chargedShmemBytes"]
                                  detail["swapCurrentBytes"] = measured["swapCurrentBytes"]
                                  status = "ZERO_SWAP_AND_DESCENDANT_CHARGE_OBSERVED"
                  except KeyboardInterrupt:
                      cancelled = True
                      status = "CANCELLED"
                  except (OSError, ValueError, KeyError, TypeError):
                      if not start_requested:
                          status = "UNIT_CONFIGURATION_REFUSED"
                  finally:
                      try:
                          if start_requested and (cancelled or not (unloaded() and not present())):
                              run(["/usr/bin/systemctl", "--user", "--no-ask-password", "stop", unit], 4)
                          if owned_unit:
                              unit_file.unlink()
                          cleanup_deadline = time.monotonic() + 3
                          while True:
                              cleanup = unloaded() and not present()
                              if cleanup or time.monotonic() >= cleanup_deadline:
                                  break
                              time.sleep(0.2)
                          if cleanup and scratch is not None:
                              for name in ("worker.py", "stdout", "stderr"):
                                  (scratch / name).unlink(missing_ok=True)
                              scratch.rmdir()
                          if cleanup and created_root:
                              unit_root.rmdir()
                      except KeyboardInterrupt:
                          status = "CANCELLED"
                          cleanup = False
                      except OSError:
                          cleanup = False
                  if cancelled:
                      status = "CANCELLED"

          receipt = {
              "kind": "USER_SWAP_CAPABILITY_ONLY", "source": source, "workflowSha": source,
              "runId": int(run_id), "attempt": 1, "runner": "ubuntu-22.04", "image": image,
              "kernel": kernel, "uid": uid, "unit": unit, "expectedGroup": group,
              "status": status, "detail": detail, "unitAndCgroupGone": cleanup,
              "qualification": False, "externalIsolationProved": False, "reuseAuthorized": False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode("ascii")
          print(canonical.decode("ascii"), flush=True)
          print("capabilitySha256=" + hashlib.sha256(canonical).hexdigest(), flush=True)
          if status != "ZERO_SWAP_AND_DESCENDANT_CHARGE_OBSERVED" or not cleanup:
              raise SystemExit(1)
          PY
