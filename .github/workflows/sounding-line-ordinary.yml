name: Sounding Line ordinary
run-name: Sounding Line finite 1 ${{ inputs.experience_mode || 'ordinary' }} ${{ github.event.pull_request.number || inputs.pr_number || 'unbound' }} ${{ github.event.pull_request.head.sha || inputs.candidate_sha || 'unbound' }} ${{ github.event.pull_request.draft == true && 'draft' || 'active' }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch ref for an owner-requested final check
        required: true
        type: string
      candidate_sha:
        description: Exact candidate SHA
        required: true
        type: string
      base_sha:
        description: Exact protected-main base SHA
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      experience_mode:
        description: Ordinary acceptance or preparation within the same authority
        type: choice
        default: ordinary
        options: [ordinary, capture, review, verify]
      experience_diagnostic:
        description: Non-qualifying experience diagnostic; ordinary mode checks custody checkout only
        type: boolean
        default: false
      incremental_evidence_shadow:
        description: Retain an encrypted closed-context registry; grants no reuse or acceptance
        type: boolean
        default: false
      evidence_ref:
        description: Evidence-only ref for review or activation verification
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: sounding-line-ordinary-${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  campaign-custody:
    name: Sounding Line / Finite campaign custody
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: read
      actions: read
    outputs:
      campaign: ${{ steps.custody.outputs.campaign }}
      phase: ${{ steps.custody.outputs.phase }}
      verification_job_minutes: ${{ steps.verification-capacity.outputs.verification_job_minutes }}
      verification_capacity_grant: ${{ steps.verification-capacity.outputs.verification_capacity_grant }}
      verification_capacity_id: ${{ steps.verification-capacity.outputs.verification_capacity_id }}
    steps:
      - name: Require the trusted workflow base before executing write authority
        env:
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: test "$REQUESTED_BASE" = "$TRUSTED_WORKFLOW_SHA"
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          path: authority
          fetch-depth: 1
          sparse-checkout: |
            scripts
            testing
            Development_Docs/Testing/Product_Experience/Engineering/pr776-controller-reconciliation-20261025
          fetch-tags: false
          show-progress: true
          persist-credentials: false
      - name: Set up ordinary checkout runtime
        if: ${{ !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout exact ordinary ancestry and installed reader closure
        if: ${{ !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/ordinary-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --purpose campaign-custody
      - name: Set up protected checkout runtime
        if: ${{ github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout selected complete consumer history
        if: ${{ github.event.pull_request.number == 721 || inputs.pr_number == '721' }}
        timeout-minutes: 21
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Checkout PR776 complete history and explicit reader closure
        if: ${{ github.event.pull_request.number == 776 || inputs.pr_number == '776' }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --pr 776
      - uses: actions/checkout@v4
        if: inputs.experience_mode == 'review' || inputs.experience_mode == 'verify'
        timeout-minutes: 10
        with:
          ref: ${{ inputs.evidence_ref || inputs.candidate_sha }}
          path: evidence
          fetch-depth: 1
          fetch-tags: false
          show-progress: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Reserve finite work using installed protected-main authority only
        id: custody
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/experience-exception.mjs --operation reserve --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --evidence evidence
      - name: Bind the finite PR820 verification capacity to exact installed source
        id: verification-capacity
        if: ${{ (github.event.pull_request.number == 820 || inputs.pr_number == '820') && (github.event_name != 'workflow_dispatch' || inputs.experience_mode == 'ordinary') && !inputs.experience_diagnostic }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SOUNDING_LINE_PR_NUMBER: "820"
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/verification-capacity-820.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Verify read-only custody checkout diagnostic identities and lineage
        if: inputs.experience_diagnostic && inputs.experience_mode == 'ordinary'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
        run: node authority/scripts/sounding-line/experience-checkout-probe.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Retain exact checkout receipt after every outcome
        if: ${{ always() && hashFiles('candidate.checkout.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-checkout-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate.checkout.json
          if-no-files-found: error
          retention-days: 90
  experience-preparation:
    needs: campaign-custody
    name: Sounding Line / Experience preparation (no mainline decision)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.experience_mode != 'ordinary' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.experience_mode == 'capture' && 70 || 40 }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - name: Checkout exact protected authority
        id: authority-checkout
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: ${{ inputs.base_sha }}
          path: authority
          fetch-depth: 1
          sparse-checkout: |
            scripts
            testing
            Development_Docs/Testing/Product_Experience/Engineering/pr776-controller-reconciliation-20261025
          fetch-tags: false
          show-progress: true
          persist-credentials: false
      - name: Observe immutable original evidence context
        if: ${{ inputs.pr_number != '721' && inputs.pr_number != '776' && inputs.pr_number != '805' }}
        timeout-minutes: 1
        working-directory: authority
        run: node scripts/sounding-line/native-evidence-context.mjs
      - name: Set up ordinary checkout runtime
        if: ${{ !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout exact ordinary ancestry and installed reader closure
        if: ${{ !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/ordinary-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Set up protected checkout runtime
        if: ${{ github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout selected complete consumer history
        if: ${{ github.event.pull_request.number == 721 || inputs.pr_number == '721' }}
        timeout-minutes: 21
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Checkout PR776 complete history and explicit reader closure
        if: ${{ github.event.pull_request.number == 776 || inputs.pr_number == '776' }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --pr 776
      - name: Checkout review evidence
        id: evidence-checkout
        uses: actions/checkout@v4
        timeout-minutes: 10
        if: inputs.experience_mode != 'capture'
        with:
          ref: ${{ inputs.evidence_ref || inputs.candidate_sha }}
          path: evidence
          fetch-depth: 1
          show-progress: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install isolated browser dependencies
        if: inputs.experience_mode == 'capture'
        working-directory: candidate
        run: |
          npm ci --ignore-scripts
          npx --no-install prisma generate --schema prisma/schema.sqlite.prisma
          npx --no-install playwright install --with-deps chromium
      - name: Prepare through protected-base authority
        id: experience
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIENCE_MODE: ${{ inputs.experience_mode }}
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPERIENCE_DIAGNOSTIC: ${{ inputs.experience_diagnostic }}
          SOUNDING_LINE_PR_NUMBER: ${{ inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ inputs.base_sha }}
          SOUNDING_LINE_EXCEPTION_PHASE: ${{ needs.campaign-custody.outputs.phase }}
        run: |
          if [ "$EXPERIENCE_MODE" = "capture" ]; then
            node authority/scripts/sounding-line/experience-prepare-supervised.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --mode "$EXPERIENCE_MODE" --diagnostic "$EXPERIENCE_DIAGNOSTIC" --evidence evidence
          else
            node authority/scripts/sounding-line/experience-prepare.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --mode "$EXPERIENCE_MODE" --diagnostic "$EXPERIENCE_DIAGNOSTIC" --evidence evidence
          fi
      - name: Retain redacted preparation progress after every outcome
        if: always() && inputs.experience_mode == 'capture' && steps.experience.outputs.preparation_progress_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: preparation-progress-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.experience.outputs.preparation_progress_path }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && inputs.experience_mode == 'capture' && steps.experience.outputs.capture_plan_path != ''
        with:
          name: product-experience-capture-${{ steps.experience.outputs.source_digest }}
          if-no-files-found: error
          path: |
            ${{ steps.experience.outcome == 'success' && steps.experience.outputs.capture_manifest_path || '' }}
            ${{ steps.experience.outputs.capture_plan_path }}
            ${{ steps.experience.outcome == 'success' && steps.experience.outputs.capture_activation_path || '' }}
            ${{ steps.experience.outcome == 'success' && 'candidate/Development_Docs/Testing/Product_Experience/evidence/' || '' }}
            ${{ steps.experience.outcome != 'success' && steps.experience.outputs.capture_stage_path || '' }}
            ${{ steps.experience.outputs.capture_journal_path }}
            ${{ steps.experience.outcome != 'success' && steps.experience.outputs.capture_journal_failure_path || '' }}
            ${{ steps.experience.outcome != 'success' && steps.experience.outputs.capture_journal_pending_path || '' }}
          retention-days: 90
      - name: Retain current raw capture after failure or cancellation
        id: capture-raw-retention
        if: always() && inputs.experience_mode == 'capture' && steps.experience.outcome != 'success' && steps.experience.outputs.capture_raw_verified_paths == '' && steps.experience.outputs.capture_raw_encrypted_path != ''
        env:
          CAPTURE_PLAN: ${{ steps.experience.outputs.capture_plan_path }}
          CAPTURE_ENCRYPTED: ${{ steps.experience.outputs.capture_raw_encrypted_path }}
        run: node authority/scripts/sounding-line/experience-raw-retention.mjs --workspace candidate --plan "$CAPTURE_PLAN" --encrypted "$CAPTURE_ENCRYPTED"
      - uses: actions/upload-artifact@v4
        id: capture-raw-artifact
        if: always() && inputs.experience_mode == 'capture' && (steps.experience.outputs.capture_raw_verified_paths != '' || (steps.capture-raw-retention.outcome == 'success' && steps.capture-raw-retention.outputs.capture_raw_verified_paths != ''))
        with:
          name: product-experience-raw-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: ${{ steps.experience.outputs.capture_raw_verified_paths || steps.capture-raw-retention.outputs.capture_raw_verified_paths }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        id: capture-lifecycle-artifact
        if: always() && inputs.experience_mode == 'capture' && steps.experience.outputs.capture_plan_path != ''
        with:
          name: product-experience-lifecycle-${{ inputs.candidate_sha }}-${{ github.run_id }}
          path: |
            ${{ steps.experience.outputs.capture_runtime_paths }}
            ${{ steps.experience.outputs.capture_profile_paths }}
            ${{ steps.experience.outputs.capture_plan_path }}
          if-no-files-found: warn
          retention-days: 90
      - name: Seal completed-context registry after parent cleanup
        id: context-registry-shadow
        if: ${{ always() && inputs.experience_mode == 'capture' && inputs.incremental_evidence_shadow == true && steps.capture-raw-artifact.outputs.artifact-id != '' && steps.capture-lifecycle-artifact.outputs.artifact-id != '' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SOUNDING_LINE_INCREMENTAL_EVIDENCE_SHADOW: ${{ inputs.incremental_evidence_shadow }}
          CAPTURE_PLAN: ${{ steps.experience.outputs.capture_plan_path }}
          CAPTURE_STAGE: ${{ steps.experience.outputs.capture_stage_path }}
          CAPTURE_RUNTIMES: ${{ steps.experience.outputs.capture_runtime_paths }}
          PREPARATION_SUPERVISION: ${{ steps.experience.outputs.preparation_progress_path }}
          RAW_ARTIFACT_ID: ${{ steps.capture-raw-artifact.outputs.artifact-id }}
          LIFECYCLE_ARTIFACT_ID: ${{ steps.capture-lifecycle-artifact.outputs.artifact-id }}
        run: node authority/scripts/sounding-line/native-registry-producer.mjs --workspace candidate --plan "$CAPTURE_PLAN" --stage "$CAPTURE_STAGE" --runtimes "$CAPTURE_RUNTIMES" --supervision "$PREPARATION_SUPERVISION" --raw-artifact "$RAW_ARTIFACT_ID" --lifecycle-artifact "$LIFECYCLE_ARTIFACT_ID"
      - name: Retain encrypted v2 context registry
        if: ${{ always() && inputs.experience_mode == 'capture' && inputs.incremental_evidence_shadow == true && steps.context-registry-shadow.outputs.context_registry_encrypted_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-context-registry-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.context-registry-shadow.outputs.context_registry_encrypted_path }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: inputs.experience_mode == 'review'
        with:
          name: product-experience-review-${{ steps.experience.outputs.source_digest }}
          path: candidate/artifacts/sounding-line/product-experience-submission/review.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: inputs.experience_mode == 'verify'
        with:
          name: product-experience-activation-${{ steps.experience.outputs.source_digest }}
          path: candidate/artifacts/sounding-line/product-experience-submission/activation.json
          retention-days: 90
      - name: Retain exact checkout receipt after every outcome
        if: ${{ always() && hashFiles('candidate.checkout.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-checkout-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate.checkout.json
          if-no-files-found: error
          retention-days: 90
  final-check:
    name: Sounding Line / Focused verification
    needs: campaign-custody
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.experience_mode == 'ordinary' && !inputs.experience_diagnostic)) && (github.event_name != 'pull_request_target' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.campaign-custody.outputs.verification_job_minutes || '0') || ((github.event.pull_request.number == 776 || inputs.pr_number == '776') && 120 || (github.event.pull_request.number == 721 || inputs.pr_number == '721') && 90 || 45) }}
    outputs:
      current_observation: ${{ steps.route.outputs.private_failure_publication_nonce != '' && steps.ordinary-verifier.outputs.current_admission_observation_publish == steps.route.outputs.private_failure_publication_nonce }}
      current_observation_nonce: ${{ steps.route.outputs.private_failure_publication_nonce }}
    steps:
      - name: Bind the event to exact source identities
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "candidate=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "repository=${{ github.event.pull_request.head.repo.full_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ inputs.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "candidate=${{ inputs.candidate_sha }}" >> "$GITHUB_OUTPUT"
            echo "repository=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: ${{ steps.source.outputs.base }}
          path: authority
          fetch-depth: 1
          sparse-checkout: |
            scripts
            testing
            Development_Docs/Testing/Product_Experience/Engineering/pr776-controller-reconciliation-20261025
          fetch-tags: false
          show-progress: true
      - name: Observe immutable original evidence context
        if: ${{ !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776' || github.event.pull_request.number == 805 || inputs.pr_number == '805') }}
        timeout-minutes: 1
        working-directory: authority
        run: node scripts/sounding-line/native-evidence-context.mjs
      - name: Set up ordinary checkout runtime
        if: ${{ !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout exact ordinary ancestry and installed reader closure
        if: ${{ !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ steps.source.outputs.base }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate }}
        run: node authority/scripts/sounding-line/ordinary-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Set up protected checkout runtime
        if: ${{ github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout selected complete consumer history
        if: ${{ github.event.pull_request.number == 721 || inputs.pr_number == '721' }}
        timeout-minutes: 21
        env:
          BASE_SHA: ${{ steps.source.outputs.base }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Checkout PR776 complete history and explicit reader closure
        if: ${{ github.event.pull_request.number == 776 || inputs.pr_number == '776' }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ steps.source.outputs.base }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --pr 776
      - uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Route through trusted protected-main classification
        id: route
        working-directory: authority
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.source.outputs.base }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from "node:fs";
          import { randomUUID } from "node:crypto";
          import { buildPlan } from "./scripts/sounding-line/ordinary.mjs";

          appendFileSync(process.env.GITHUB_OUTPUT, `private_failure_publication_nonce=${randomUUID()}\n`);
          try {
            const plan = await buildPlan({
              root: "../candidate",
              baseSha: process.env.BASE_SHA,
              candidateSha: process.env.CANDIDATE_SHA,
              mode: "ordinary",
              experienceEvidenceRequired: false,
            });
            if (typeof plan.browserRequired !== "boolean")
              throw new Error("SOUNDING_LINE_BROWSER_PROVISIONING_INDETERMINATE");
            appendFileSync(process.env.GITHUB_OUTPUT, `kind=ordinary\nbrowser_required=${plan.browserRequired}\n`);
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            if (message.startsWith("SOUNDING_LINE_PRODUCT_AND_CONTROL_PLANE_MIXED:"))
              throw new Error(`SOUNDING_LINE_CANDIDATE_CLASSIFICATION_FAILURE:${message}`);
            if (!message.startsWith("SOUNDING_LINE_CONTROL_PLANE_CHANGE_REQUIRES_RELEASE_MODE:")) throw error;
            appendFileSync(process.env.GITHUB_OUTPUT, "kind=control-plane\n");
          }
          EOF
      - run: npm ci --ignore-scripts
        working-directory: candidate
      - run: npx --no-install prisma generate --schema prisma/schema.sqlite.prisma
        working-directory: candidate
      - name: Provision Chromium when trusted browser proof is selected
        if: steps.route.outputs.kind == 'ordinary' && steps.route.outputs.browser_required == 'true'
        run: npx --no-install playwright install --with-deps chromium
        working-directory: candidate
      - name: Run the trusted focused verifier against the exact candidate tree
        id: ordinary-verifier
        if: steps.route.outputs.kind == 'ordinary'
        env:
          GH_TOKEN: ${{ github.token }}
          SOUNDING_LINE_EVIDENCE_PURPOSE: PROTECTED_FINAL_VERIFICATION
          SOUNDING_LINE_VERIFICATION_JOB_MINUTES: ${{ needs.campaign-custody.outputs.verification_job_minutes }}
          SOUNDING_LINE_VERIFICATION_CAPACITY_GRANT: ${{ needs.campaign-custody.outputs.verification_capacity_grant }}
          SOUNDING_LINE_VERIFICATION_CAPACITY_ID: ${{ needs.campaign-custody.outputs.verification_capacity_id }}
          SOUNDING_LINE_PRIVATE_FAILURE_PUBLICATION_NONCE: ${{ steps.route.outputs.private_failure_publication_nonce }}
          SOUNDING_LINE_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          SOUNDING_LINE_BASE_SHA: ${{ steps.source.outputs.base }}
          SOUNDING_LINE_EXCEPTION_PHASE: ${{ needs.campaign-custody.outputs.phase }}
        run: node authority/scripts/sounding-line/ordinary-supervised.mjs --mode ordinary --workspace candidate --base ${{ steps.source.outputs.base }} --candidate ${{ steps.source.outputs.candidate }}
      - name: Retain verification supervision after every outcome
        if: ${{ always() && steps.route.outputs.kind == 'ordinary' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-verification-supervision-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            authority/artifacts/sounding-line/verification-supervision/session-*/initial.json
            authority/artifacts/sounding-line/verification-supervision/session-*/preflight.json
            authority/artifacts/sounding-line/verification-supervision/session-*/terminal.json
            authority/artifacts/sounding-line/verification-supervision/session-*/controller-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain completed whole obligations after any verifier outcome
        id: completed-evidence-artifact
        if: ${{ always() && steps.route.outputs.kind == 'ordinary' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-completed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority/artifacts/sounding-line/completed-evidence/checkpoint-*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retain encrypted browser failure diagnostics
        id: browser-failure-artifact
        if: ${{ always() && steps.route.outputs.kind == 'ordinary' && steps.route.outputs.private_failure_publication_nonce != '' && steps.ordinary-verifier.outputs.private_browser_failure_publish == steps.route.outputs.private_failure_publication_nonce && steps.ordinary-verifier.outputs.private_browser_failure_paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.ordinary-verifier.outputs.private_browser_failure_paths }}
          if-no-files-found: error
          retention-days: 90
      - name: Bind control-plane validation to the exact candidate tree
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: |
          git merge-base --is-ancestor ${{ steps.source.outputs.base }} ${{ steps.source.outputs.candidate }}
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.candidate }}"
      - name: Run focused Sounding Line regression for the control-plane candidate
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: npm run test:sounding-line
      - name: Typecheck the control-plane candidate
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: npm run typecheck
      - name: Verify rendered experience adversarial fixtures
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run experience:test:browser
      - name: Lint the control-plane candidate
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: npx --no-install eslint scripts/sounding-line tests/sounding-line scripts/features
      - name: Scan the control-plane candidate for private content
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: npm run private-content:scan
      - name: Validate the control-plane candidate documentation
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: npm run docs:validate
      - name: Test the control-plane candidate feature records
        if: steps.route.outputs.kind == 'control-plane'
        working-directory: candidate
        run: npm run features:test
      - uses: actions/upload-artifact@v4
        if: always() && steps.route.outputs.kind == 'ordinary'
        with:
          name: sounding-line-ordinary-${{ steps.source.outputs.candidate }}
          path: |
            candidate/artifacts/sounding-line/ordinary-decision.json
            candidate/artifacts/sounding-line/r14-observation.encrypted
          if-no-files-found: error
      - name: Retain the validated current-admission encrypted observation
        if: ${{ always() && steps.route.outputs.kind == 'ordinary' && steps.route.outputs.private_failure_publication_nonce != '' && steps.ordinary-verifier.outputs.current_admission_observation_publish == steps.route.outputs.private_failure_publication_nonce }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-current-admission-observation-${{ steps.source.outputs.candidate }}
          path: candidate/artifacts/sounding-line/current-admission-observation.encrypted
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact checkout receipt after every outcome
        if: ${{ always() && hashFiles('candidate.checkout.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-checkout-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate.checkout.json
          if-no-files-found: error
          retention-days: 90
  mainline-decision:
    name: Sounding Line / Mainline Decision
    needs: [campaign-custody, final-check]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.experience_mode == 'ordinary' && !inputs.experience_diagnostic)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: Require successful protected verification and custody
        env:
          CUSTODY_RESULT: ${{ needs.campaign-custody.result }}
          VERIFICATION_RESULT: ${{ needs.final-check.result }}
        run: test "$CUSTODY_RESULT" = success && test "$VERIFICATION_RESULT" = success
      - name: Require the trusted workflow base before executing write authority
        env:
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: test "$REQUESTED_BASE" = "$TRUSTED_WORKFLOW_SHA"
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          path: authority
          fetch-depth: 1
          sparse-checkout: |
            scripts
            testing
            Development_Docs/Testing/Product_Experience/Engineering/pr776-controller-reconciliation-20261025
          fetch-tags: false
          show-progress: true
          persist-credentials: false
      - name: Set up ordinary checkout runtime
        if: ${{ needs.campaign-custody.outputs.campaign == 'true' && !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout exact ordinary ancestry and installed reader closure
        if: ${{ needs.campaign-custody.outputs.campaign == 'true' && !(github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/ordinary-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Set up protected checkout runtime
        if: ${{ needs.campaign-custody.outputs.campaign == 'true' && (github.event.pull_request.number == 721 || inputs.pr_number == '721' || github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - name: Checkout selected complete consumer history
        if: ${{ needs.campaign-custody.outputs.campaign == 'true' && (github.event.pull_request.number == 721 || inputs.pr_number == '721') }}
        timeout-minutes: 21
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Checkout PR776 complete history and explicit reader closure
        if: ${{ needs.campaign-custody.outputs.campaign == 'true' && (github.event.pull_request.number == 776 || inputs.pr_number == '776') }}
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: node authority/scripts/sounding-line/experience-selected-checkout.mjs --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --pr 776
      - uses: actions/setup-node@v4
        with:
          node-version-file: authority/.nvmrc
      - uses: actions/download-artifact@v4
        if: needs.campaign-custody.outputs.campaign == 'true'
        with:
          name: sounding-line-ordinary-${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          path: decision
      - name: Download the validated current-admission cipher from this run
        if: needs.campaign-custody.outputs.campaign == 'true' && needs.final-check.outputs.current_observation == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sounding-line-current-admission-observation-${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          path: decision
      - name: Revalidate the exact ready transaction
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node authority/scripts/sounding-line/protected-merge-transaction.mjs --operation gate --pr "$PR_NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA" --run "${{ github.run_id }}"
      - name: Seal exact qualification without claiming whole-run success early
        if: needs.campaign-custody.outputs.campaign == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          SOUNDING_LINE_CURRENT_OBSERVATION_PUBLICATION_NONCE: ${{ needs.final-check.outputs.current_observation_nonce }}
        run: node authority/scripts/sounding-line/experience-exception.mjs --operation seal --workspace candidate --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" --decision decision/ordinary-decision.json
      - name: Retain exact checkout receipt after every outcome
        if: ${{ always() && hashFiles('candidate.checkout.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-checkout-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate.checkout.json
          if-no-files-found: error
          retention-days: 90
