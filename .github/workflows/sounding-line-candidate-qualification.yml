name: Sounding Line candidate qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen candidate commit SHA
        required: true
        type: string
      qualified_base_sha:
        description: Exact protected-main base SHA
        required: true
        type: string
      gate:
        description: Governed gate
        required: true
        default: mainline
        type: choice
        options: [mainline, release-candidate]

permissions:
  contents: read

jobs:
  qualify:
    name: Sounding Line / Mainline Decision
    runs-on: ubuntu-latest
    steps:
      - name: Require protected-main workflow authority
        shell: bash
        run: |
          [[ "${{ github.ref }}" == "refs/heads/main" ]] || { echo TRUSTED_WORKFLOW_MUST_RUN_FROM_MAIN; exit 1; }
      - name: Check out trusted protected-main authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: authority
          fetch-depth: 0
      - name: Check out frozen candidate subject
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
      - name: Install one trusted dependency set
        working-directory: authority
        run: npm ci
      - name: Make candidate dependency resolution read-only from trusted install
        shell: bash
        run: ln -s ../authority/node_modules candidate/node_modules
      - name: Verify distinct trusted authority and frozen subject identities
        id: identities
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate_sha }}"
          base="${{ inputs.qualified_base_sha }}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo CANDIDATE_SHA_INVALID; exit 1; }
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo BASE_SHA_INVALID; exit 1; }
          [[ "$(git -C candidate rev-parse HEAD)" == "$candidate" ]] || { echo CANDIDATE_HEAD_MISMATCH; exit 1; }
          git -C candidate cat-file -e "$base^{commit}"
          authority_sha="$(git -C authority rev-parse HEAD)"
          [[ "$authority_sha" != "$candidate" ]] || { echo CANDIDATE_CANNOT_BE_AUTHORITY; exit 1; }
          echo "authority_sha=$authority_sha" >> "$GITHUB_OUTPUT"
          echo "authority_tree=$(git -C authority rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$(git -C candidate rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Build trusted plan over candidate diff
        shell: bash
        run: |
          set -euo pipefail
          changed_args=()
          while IFS= read -r file; do changed_args+=(--changed-path "$file"); done < <(git -C candidate diff --name-only "${{ inputs.qualified_base_sha }}...${{ inputs.candidate_sha }}")
          node authority/scripts/sounding-line/candidate-qualification-cli.mjs \
            --authority-root authority --candidate-root candidate \
            --authority-source-sha "${{ steps.identities.outputs.authority_sha }}" \
            --authority-source-tree "${{ steps.identities.outputs.authority_tree }}" \
            --candidate-head-sha "${{ inputs.candidate_sha }}" \
            --candidate-tree-sha "${{ steps.identities.outputs.candidate_tree }}" \
            --qualified-base-sha "${{ inputs.qualified_base_sha }}" --gate "${{ inputs.gate }}" \
            "${changed_args[@]}" --out sounding-line-candidate-plan.json
      - name: Execute candidate contents with trusted controls and finalize
        run: node authority/scripts/sounding-line/candidate-qualification-runner.mjs --plan sounding-line-candidate-plan.json --candidate-root candidate --out sounding-line-candidate-finalization.json
      - name: Upload authoritative candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: sounding-line-candidate-finalization
          path: |
            sounding-line-candidate-plan.json
            sounding-line-candidate-finalization.json
