name: Sounding Line governed worker

on:
  workflow_call:
    inputs:
      suite:
        description: Sealed-plan suite identifier
        required: true
        type: string
      gate:
        description: Sealed-plan gate identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: Sounding Line / Governed worker
    runs-on: windows-latest
    # The serial two-browser accessibility family has a measured 105-minute
    # governed budget; retain setup, cleanup, and receipt-upload headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-plan
          path: ${{ runner.temp }}/sounding-line-plan
      - run: npm run db:generate
      # This is a seeded baseline for a worker-local disposable runtime.
      - run: npx prisma migrate deploy --schema prisma/schema.sqlite.prisma
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npm run db:seed
        env: { DATABASE_URL: "file:./dev.db" }
      - name: Install browser engines required by the sealed suite
        shell: pwsh
        env:
          SOUNDING_LINE_PLAN: ${{ runner.temp }}/sounding-line-plan/sounding-line-plan.json
          SOUNDING_LINE_SUITE: ${{ inputs.suite }}
        run: |
          $plan = Get-Content -Raw $env:SOUNDING_LINE_PLAN | ConvertFrom-Json
          $node = @($plan.nodes | Where-Object { $_.id -eq $env:SOUNDING_LINE_SUITE })
          if ($node.Count -ne 1) { throw "GOVERNED_BROWSER_ENGINE_PLAN_NODE_INVALID" }
          $engines = if ($env:SOUNDING_LINE_SUITE -like 'browser.*') {
            @('chromium', 'webkit')
          } elseif (@($node[0].resources) -contains 'browser-chromium') {
            @('chromium')
          } elseif (@($node[0].resources) -contains 'browser-webkit') {
            @('webkit')
          } else {
            @()
          }
          if ($engines.Count -gt 0) { npx playwright install @engines }
      - env:
          SOUNDING_LINE_PLAN: ${{ runner.temp }}/sounding-line-plan/sounding-line-plan.json
        run: node scripts/sounding-line/authority.mjs ${{ inputs.gate }} --execute-only --plan-in "$env:SOUNDING_LINE_PLAN" --suite ${{ inputs.suite }} --receipt-out sounding-line-worker-evidence.json
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          {
            name: "sounding-line-worker-evidence-${{ inputs.suite }}",
            path: sounding-line-worker-evidence.json,
            retention-days: 14,
          }
      - if: always()
        name: Verify governed worker receipt
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath sounding-line-worker-evidence.json -PathType Leaf)) {
            throw "GOVERNED_WORKER_RECEIPT_MISSING"
          }
          $evidence = Get-Content -Raw sounding-line-worker-evidence.json | ConvertFrom-Json
          $receipts = @($evidence.receipts)
          if ($receipts.Count -ne 1 -or $receipts[0].suiteId -ne '${{ inputs.suite }}') {
            throw "GOVERNED_WORKER_RECEIPT_BOUNDARY_INVALID"
          }
          if ($receipts[0].result -ne 'PASSED' -or [int]$receipts[0].exitCode -ne 0 -or $receipts[0].cleanupState -ne 'CLEAN') {
            throw "GOVERNED_WORKER_RECEIPT_FAILED"
          }
