name: Sounding Line governed worker

on:
  workflow_call:
    inputs:
      suite:
        description: Sealed-plan suite identifier
        required: true
        type: string
      gate:
        description: Sealed-plan gate identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: Sounding Line / Governed worker
    runs-on: windows-latest
    # The serial two-browser accessibility family has a measured 105-minute
    # governed budget; retain setup, cleanup, and receipt-upload headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - name: Restore dependencies with timing
        shell: pwsh
        run: |
          $startedAt = [DateTimeOffset]::UtcNow
          & npm ci
          $exitCode = $LASTEXITCODE
          $finishedAt = [DateTimeOffset]::UtcNow
          [ordered]@{
            version = 1
            runnerBootstrapMs = $null
            runnerBootstrapStatus = 'UNAVAILABLE_FROM_WORKER'
            checkoutMs = $null
            checkoutStatus = 'UNAVAILABLE_FROM_WORKER'
            dependencyRestoreMs = [int](($finishedAt - $startedAt).TotalMilliseconds)
          } | ConvertTo-Json | Set-Content -LiteralPath 'sounding-line-worker-throughput.json' -Encoding utf8
          if ($exitCode -ne 0) { throw 'GOVERNED_DEPENDENCY_RESTORE_FAILED' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sounding-line-plan
          path: ${{ runner.temp }}/sounding-line-plan
      - name: Prepare only sealed-node resources
        shell: pwsh
        env:
          SOUNDING_LINE_PLAN: ${{ runner.temp }}/sounding-line-plan/sounding-line-plan.json
          SOUNDING_LINE_SUITE: ${{ inputs.suite }}
        run: |
          $setupStartedAt = [DateTimeOffset]::UtcNow
          $preparationPath = 'sounding-line-worker-preparation.json'
          $previousThroughput = if (Test-Path -LiteralPath 'sounding-line-worker-throughput.json' -PathType Leaf) {
            Get-Content -Raw 'sounding-line-worker-throughput.json' | ConvertFrom-Json
          } else { $null }
          & node scripts/sounding-line/worker-preparation.mjs --plan "$env:SOUNDING_LINE_PLAN" --suite "$env:SOUNDING_LINE_SUITE" --out $preparationPath
          if ($LASTEXITCODE -ne 0) { throw "GOVERNED_WORKER_PREPARATION_FAILED" }
          $preparation = Get-Content -Raw $preparationPath | ConvertFrom-Json
          $timings = [ordered]@{ clientGenerateMs = 0; databaseMigrationMs = 0; databaseSeedMs = 0; browserRestoreMs = 0 }
          function Invoke-TimedPreparation([string]$Name, [scriptblock]$Action) {
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            & $Action
            $exitCode = $LASTEXITCODE
            $watch.Stop()
            $timings[$Name] = [int]$watch.ElapsedMilliseconds
            if ($exitCode -ne 0) { throw "GOVERNED_RESOURCE_PREPARATION_FAILED:$Name" }
          }
          if ($preparation.actions.prismaGenerate) {
            Invoke-TimedPreparation 'clientGenerateMs' { & npm run db:generate }
          }
          if ($preparation.actions.databaseMigration -or $preparation.actions.databaseSeed) {
            $env:DATABASE_URL = 'file:./dev.db'
          }
          if ($preparation.actions.databaseMigration) {
            Invoke-TimedPreparation 'databaseMigrationMs' { & npx prisma migrate deploy --schema prisma/schema.sqlite.prisma }
          }
          if ($preparation.actions.databaseSeed) {
            Invoke-TimedPreparation 'databaseSeedMs' { & npm run db:seed }
          }
          $engines = @($preparation.actions.browserEngines)
          if ($engines.Count -gt 0) {
            Invoke-TimedPreparation 'browserRestoreMs' { & npx playwright install @engines }
          }
          $setupFinishedAt = [DateTimeOffset]::UtcNow
          [ordered]@{
            version = 1
            suiteId = $env:SOUNDING_LINE_SUITE
            githubQueueMs = $null
            githubQueueStatus = 'UNAVAILABLE_FROM_HOST'
            bootstrapStartedAt = $setupStartedAt.ToString('o')
            bootstrapMs = [int](($setupFinishedAt - $setupStartedAt).TotalMilliseconds)
            runnerBootstrapMs = $previousThroughput.runnerBootstrapMs
            runnerBootstrapStatus = $previousThroughput.runnerBootstrapStatus
            checkoutMs = $previousThroughput.checkoutMs
            checkoutStatus = $previousThroughput.checkoutStatus
            dependencyRestoreMs = $previousThroughput.dependencyRestoreMs
            clientGenerateMs = $timings.clientGenerateMs
            databaseMigrationMs = $timings.databaseMigrationMs
            databaseSeedMs = $timings.databaseSeedMs
            browserRestoreMs = $timings.browserRestoreMs
            serverReadyMs = 0
            preparation = $preparation
          } | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath 'sounding-line-worker-throughput.json' -Encoding utf8
      - env:
          SOUNDING_LINE_PLAN: ${{ runner.temp }}/sounding-line-plan/sounding-line-plan.json
        run: node scripts/sounding-line/authority.mjs ${{ inputs.gate }} --execute-only --plan-in "$env:SOUNDING_LINE_PLAN" --suite ${{ inputs.suite }} --receipt-out sounding-line-worker-evidence.json
      - name: Bind setup and execution timing to worker evidence
        if: always()
        shell: pwsh
        run: |
          if ((Test-Path -LiteralPath sounding-line-worker-evidence.json -PathType Leaf) -and (Test-Path -LiteralPath sounding-line-worker-throughput.json -PathType Leaf)) {
            $evidence = Get-Content -Raw sounding-line-worker-evidence.json | ConvertFrom-Json
            $throughput = Get-Content -Raw sounding-line-worker-throughput.json | ConvertFrom-Json
            $throughput.suiteExecutionMs = if (@($evidence.receipts).Count -eq 1) { [int]$evidence.receipts[0].durationMs } else { $null }
            $throughput.teardownMs = 0
            $throughput.artifactUploadMs = $null
            $throughput.overallWorkerMs = [int]$throughput.bootstrapMs + [int]($throughput.suiteExecutionMs ?? 0)
            $evidence | Add-Member -NotePropertyName throughput -NotePropertyValue $throughput -Force
            $evidence | ConvertTo-Json -Depth 16 | Set-Content -LiteralPath sounding-line-worker-evidence.json -Encoding utf8
          }
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: "sounding-line-worker-evidence-${{ inputs.suite }}"
          path: |
            sounding-line-worker-evidence.json
            sounding-line-worker-throughput.json
            sounding-line-worker-preparation.json
          retention-days: 14
      - if: always()
        name: Verify governed worker receipt
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath sounding-line-worker-evidence.json -PathType Leaf)) {
            throw "GOVERNED_WORKER_RECEIPT_MISSING"
          }
          $evidence = Get-Content -Raw sounding-line-worker-evidence.json | ConvertFrom-Json
          $receipts = @($evidence.receipts)
          if ($receipts.Count -ne 1 -or $receipts[0].suiteId -ne '${{ inputs.suite }}') {
            throw "GOVERNED_WORKER_RECEIPT_BOUNDARY_INVALID"
          }
          if ($receipts[0].result -ne 'PASSED' -or [int]$receipts[0].exitCode -ne 0 -or $receipts[0].cleanupState -ne 'CLEAN') {
            throw "GOVERNED_WORKER_RECEIPT_FAILED"
          }
