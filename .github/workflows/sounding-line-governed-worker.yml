name: Sounding Line governed worker

on:
  workflow_call:
    inputs:
      suite:
        description: Sealed-plan suite identifier
        required: true
        type: string
      empty_wave:
        description: Explicit empty-wave marker; never represents governed test evidence
        required: false
        default: false
        type: boolean
      gate:
        description: Sealed-plan gate identifier
        required: true
        type: string
      candidate_sha:
        description: Exact sealed source identity represented by the plan
        required: true
        type: string
      plan_artifact:
        description: Sealed plan artifact for this qualified candidate
        required: false
        default: sounding-line-plan
        type: string
      plan_path:
        description: Relative sealed plan path inside the downloaded plan artifact
        required: false
        default: sounding-line-plan.json
        type: string
      prepared_artifact:
        description: Verified prepared dependency artifact for this candidate
        required: false
        default: sounding-line-prepared-dependency
        type: string
      prepared_path:
        description: Relative prepared dependency-layer path inside the artifact
        required: false
        default: ""
        type: string
      prepared_producer:
        description: Exact trusted producer identity bound into the dependency manifest
        required: false
        default: ""
        type: string
      execution_sha:
        description: Candidate SHA or sealed predicted integration commit to execute
        required: false
        default: ""
        type: string
      integration_artifact:
        description: Optional Git bundle containing the sealed predicted integration commit
        required: false
        default: ""
        type: string
      integration_bundle_path:
        description: Relative bundle path inside the integration artifact
        required: false
        default: integration.bundle
        type: string
      receipt_artifact:
        description: Optional unique artifact name for this logical worker receipt
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: Sounding Line / Governed worker
    runs-on: windows-latest
    # The serial two-browser accessibility family has a measured 105-minute
    # governed budget; retain setup, cleanup, and receipt-upload headroom.
    timeout-minutes: 120
    steps:
      - name: Complete explicit empty wave without evidence
        if: ${{ inputs.empty_wave }}
        shell: pwsh
        env:
          SOUNDING_LINE_SUITE: ${{ inputs.suite }}
        run: |
          if ($env:SOUNDING_LINE_SUITE -ne '__SOUNDING_LINE_EMPTY_WAVE__') {
            throw 'GOVERNED_EMPTY_WAVE_MARKER_INVALID'
          }
          'SOUNDING_LINE_EMPTY_WAVE_COMPLETED'
      - if: ${{ !inputs.empty_wave }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # workflow_call otherwise resolves the mutable default-branch ref.
          # Each worker must execute the same frozen candidate that the plan
          # sealed, including when protected main advances while workers start.
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - name: Restore sealed predicted integration commit
        if: ${{ !inputs.empty_wave && inputs.integration_artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.integration_artifact }}
          path: ${{ runner.temp }}/sounding-line-integration
      - name: Checkout sealed execution identity
        if: ${{ !inputs.empty_wave }}
        shell: pwsh
        env:
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_EXECUTION_SHA: ${{ inputs.execution_sha }}
          SOUNDING_LINE_INTEGRATION_ARTIFACT: ${{ inputs.integration_artifact }}
          SOUNDING_LINE_INTEGRATION_BUNDLE_PATH: ${{ inputs.integration_bundle_path }}
        run: |
          $execution = if ($env:SOUNDING_LINE_EXECUTION_SHA) { $env:SOUNDING_LINE_EXECUTION_SHA } else { $env:SOUNDING_LINE_CANDIDATE_SHA }
          if ($execution -notmatch '^[0-9a-f]{40}$') { throw 'GOVERNED_WORKER_EXECUTION_SHA_INVALID' }
          if ($env:SOUNDING_LINE_INTEGRATION_ARTIFACT) {
            $bundle = Join-Path (Join-Path $env:RUNNER_TEMP 'sounding-line-integration') $env:SOUNDING_LINE_INTEGRATION_BUNDLE_PATH
            if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw 'GOVERNED_INTEGRATION_BUNDLE_MISSING' }
            git fetch $bundle $execution
            if ($LASTEXITCODE -ne 0) { throw 'GOVERNED_INTEGRATION_BUNDLE_FETCH_FAILED' }
          }
          git checkout --detach $execution
          if ($LASTEXITCODE -ne 0 -or (git rev-parse HEAD).Trim() -ne $execution) { throw 'GOVERNED_WORKER_EXECUTION_CHECKOUT_MISMATCH' }
      - name: Verify sealed candidate checkout
        if: ${{ !inputs.empty_wave }}
        shell: pwsh
        env:
          SOUNDING_LINE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOUNDING_LINE_EXECUTION_SHA: ${{ inputs.execution_sha }}
        run: |
          if ($env:SOUNDING_LINE_CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'GOVERNED_WORKER_CANDIDATE_SHA_INVALID' }
          $execution = if ($env:SOUNDING_LINE_EXECUTION_SHA) { $env:SOUNDING_LINE_EXECUTION_SHA } else { $env:SOUNDING_LINE_CANDIDATE_SHA }
          if ((git rev-parse HEAD).Trim() -ne $execution) { throw 'GOVERNED_WORKER_CANDIDATE_CHECKOUT_MISMATCH' }
      - if: ${{ !inputs.empty_wave }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - id: dependency-identity
        if: ${{ !inputs.empty_wave }}
        shell: pwsh
        run: |
          $identity = node scripts/sounding-line/v14/prepared-layer-artifact.mjs cache-key | ConvertFrom-Json
          "key=$($identity.key)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: dependency-cache-restore
        if: ${{ !inputs.empty_wave }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            node_modules
            sounding-line-dependency-cache/dependency-manifest.json
          key: ${{ steps.dependency-identity.outputs.key }}
      - name: Restore verified digest-keyed dependency cache with timing
        if: ${{ !inputs.empty_wave }}
        shell: pwsh
        env:
          SOUNDING_LINE_PREPARED_CACHE_KEY: ${{ steps.dependency-identity.outputs.key }}
          CACHE_HIT: ${{ steps.dependency-cache-restore.outputs.cache-hit }}
        run: |
          $startedAt = [DateTimeOffset]::UtcNow
          if ($env:CACHE_HIT -ne 'true') { throw 'GOVERNED_DEPENDENCY_CACHE_MISS' }
          & node scripts/sounding-line/v14/prepared-layer-artifact.mjs verify --source node_modules --manifest sounding-line-dependency-cache/dependency-manifest.json
          $exitCode = $LASTEXITCODE
          $finishedAt = [DateTimeOffset]::UtcNow
          [ordered]@{
            version = 1
            runnerBootstrapMs = $null
            runnerBootstrapStatus = 'UNAVAILABLE_FROM_WORKER'
            checkoutMs = $null
            checkoutStatus = 'UNAVAILABLE_FROM_WORKER'
            dependencyRestoreMs = [int](($finishedAt - $startedAt).TotalMilliseconds)
          } | ConvertTo-Json | Set-Content -LiteralPath 'sounding-line-worker-throughput.json' -Encoding utf8
          if ($exitCode -ne 0) { throw 'GOVERNED_DEPENDENCY_LAYER_RESTORE_FAILED' }
      - if: ${{ !inputs.empty_wave }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.plan_artifact }}
          path: ${{ runner.temp }}/sounding-line-plan
      - name: Prepare only sealed-node resources
        if: ${{ !inputs.empty_wave }}
        shell: pwsh
        env:
          SOUNDING_LINE_PLAN: ${{ runner.temp }}/sounding-line-plan/${{ inputs.plan_path }}
          SOUNDING_LINE_SUITE: ${{ inputs.suite }}
        run: |
          $setupStartedAt = [DateTimeOffset]::UtcNow
          $preparationPath = 'sounding-line-worker-preparation.json'
          $previousThroughput = if (Test-Path -LiteralPath 'sounding-line-worker-throughput.json' -PathType Leaf) {
            Get-Content -Raw 'sounding-line-worker-throughput.json' | ConvertFrom-Json
          } else { $null }
          & node scripts/sounding-line/worker-preparation.mjs --plan "$env:SOUNDING_LINE_PLAN" --suite "$env:SOUNDING_LINE_SUITE" --out $preparationPath
          if ($LASTEXITCODE -ne 0) { throw "GOVERNED_WORKER_PREPARATION_FAILED" }
          $preparation = Get-Content -Raw $preparationPath | ConvertFrom-Json
          $timings = [ordered]@{ clientGenerateMs = 0; databaseMigrationMs = 0; databaseSeedMs = 0; browserRestoreMs = 0 }
          function Invoke-TimedPreparation([string]$Name, [scriptblock]$Action) {
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            & $Action
            $exitCode = $LASTEXITCODE
            $watch.Stop()
            $timings[$Name] = [int]$watch.ElapsedMilliseconds
            if ($exitCode -ne 0) { throw "GOVERNED_RESOURCE_PREPARATION_FAILED:$Name" }
          }
          $isolatedBrowserRuntimeOwnsDatabase = $preparation.preparationOwner -eq 'ISOLATED_BROWSER_RUNTIME'
          if ($preparation.actions.prismaGenerate -and -not $isolatedBrowserRuntimeOwnsDatabase) {
            Invoke-TimedPreparation 'clientGenerateMs' { & npm run db:generate }
          }
          if (($preparation.actions.databaseMigration -or $preparation.actions.databaseSeed) -and -not $isolatedBrowserRuntimeOwnsDatabase) {
            $env:DATABASE_URL = 'file:./dev.db'
          }
          if ($preparation.actions.databaseMigration -and -not $isolatedBrowserRuntimeOwnsDatabase) {
            Invoke-TimedPreparation 'databaseMigrationMs' { & npx prisma migrate deploy --schema prisma/schema.sqlite.prisma }
          }
          if ($preparation.actions.databaseSeed -and -not $isolatedBrowserRuntimeOwnsDatabase) {
            Invoke-TimedPreparation 'databaseSeedMs' { & npm run db:seed }
          }
          $engines = @($preparation.actions.browserEngines)
          if ($engines.Count -gt 0) {
            Invoke-TimedPreparation 'browserRestoreMs' { & npx playwright install @engines }
          }
          $setupFinishedAt = [DateTimeOffset]::UtcNow
          [ordered]@{
            version = 1
            suiteId = $env:SOUNDING_LINE_SUITE
            githubQueueMs = $null
            githubQueueStatus = 'UNAVAILABLE_FROM_HOST'
            bootstrapStartedAt = $setupStartedAt.ToString('o')
            bootstrapMs = [int](($setupFinishedAt - $setupStartedAt).TotalMilliseconds)
            runnerBootstrapMs = $previousThroughput.runnerBootstrapMs
            runnerBootstrapStatus = $previousThroughput.runnerBootstrapStatus
            checkoutMs = $previousThroughput.checkoutMs
            checkoutStatus = $previousThroughput.checkoutStatus
            dependencyRestoreMs = $previousThroughput.dependencyRestoreMs
            clientGenerateMs = $timings.clientGenerateMs
            databaseMigrationMs = $timings.databaseMigrationMs
            databaseSeedMs = $timings.databaseSeedMs
            browserRestoreMs = $timings.browserRestoreMs
            serverReadyMs = 0
            preparation = $preparation
          } | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath 'sounding-line-worker-throughput.json' -Encoding utf8
      - if: ${{ !inputs.empty_wave }}
        env:
          SOUNDING_LINE_PLAN: ${{ runner.temp }}/sounding-line-plan/${{ inputs.plan_path }}
          SOUNDING_LINE_GATE: ${{ inputs.gate }}
          SOUNDING_LINE_SUITE: ${{ inputs.suite }}
          SOUNDING_LINE_SEALED_SOURCE_SHA: ${{ inputs.candidate_sha }}
        shell: pwsh
        run: |
          # Reusable workflows inherit the trusted-main dispatch SHA. The sealed
          # plan is instead source-bound to the exact frozen candidate identity.
          $env:GITHUB_SHA = $env:SOUNDING_LINE_SEALED_SOURCE_SHA
          node scripts/sounding-line/authority.mjs "$env:SOUNDING_LINE_GATE" --execute-only --plan-in "$env:SOUNDING_LINE_PLAN" --suite "$env:SOUNDING_LINE_SUITE" --receipt-out sounding-line-worker-evidence.json
      - name: Bind setup and execution timing to worker evidence
        if: ${{ !inputs.empty_wave && always() }}
        shell: pwsh
        run: |
          if ((Test-Path -LiteralPath sounding-line-worker-evidence.json -PathType Leaf) -and (Test-Path -LiteralPath sounding-line-worker-throughput.json -PathType Leaf)) {
            $evidence = Get-Content -Raw sounding-line-worker-evidence.json | ConvertFrom-Json
            $throughput = Get-Content -Raw sounding-line-worker-throughput.json | ConvertFrom-Json
            $suiteExecutionMs = if (@($evidence.receipts).Count -eq 1) { [int]$evidence.receipts[0].durationMs } else { $null }
            $throughput | Add-Member -NotePropertyName suiteExecutionMs -NotePropertyValue $suiteExecutionMs -Force
            $throughput | Add-Member -NotePropertyName teardownMs -NotePropertyValue 0 -Force
            $throughput | Add-Member -NotePropertyName artifactUploadMs -NotePropertyValue $null -Force
            $throughput | Add-Member -NotePropertyName overallWorkerMs -NotePropertyValue ([int]$throughput.bootstrapMs + [int]($suiteExecutionMs ?? 0)) -Force
            $evidence | Add-Member -NotePropertyName throughput -NotePropertyValue $throughput -Force
            $evidence | ConvertTo-Json -Depth 16 | Set-Content -LiteralPath sounding-line-worker-evidence.json -Encoding utf8
          }
      - if: ${{ !inputs.empty_wave && always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: "${{ inputs.receipt_artifact || format('sounding-line-worker-evidence-{0}', inputs.suite) }}"
          path: |
            sounding-line-worker-evidence.json
            sounding-line-worker-throughput.json
            sounding-line-worker-preparation.json
          retention-days: 14
      - if: ${{ !inputs.empty_wave && always() }}
        name: Verify governed worker receipt
        shell: pwsh
        env:
          SOUNDING_LINE_SUITE: ${{ inputs.suite }}
        run: |
          if (-not (Test-Path -LiteralPath sounding-line-worker-evidence.json -PathType Leaf)) {
            throw "GOVERNED_WORKER_RECEIPT_MISSING"
          }
          $evidence = Get-Content -Raw sounding-line-worker-evidence.json | ConvertFrom-Json
          $receipts = @($evidence.receipts)
          if ($receipts.Count -ne 1 -or $receipts[0].suiteId -ne $env:SOUNDING_LINE_SUITE) {
            throw "GOVERNED_WORKER_RECEIPT_BOUNDARY_INVALID"
          }
          if ($receipts[0].result -ne 'PASSED' -or [int]$receipts[0].exitCode -ne 0 -or $receipts[0].cleanupState -ne 'CLEAN') {
            throw "GOVERNED_WORKER_RECEIPT_FAILED"
          }
