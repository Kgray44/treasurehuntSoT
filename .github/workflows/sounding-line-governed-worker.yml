name: Sounding Line governed worker

on:
  workflow_call:
    inputs:
      suite:
        description: Sealed-plan suite identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: Sounding Line / Governed worker
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      # This is a seeded baseline for a worker-local disposable runtime.
      - run: npx prisma migrate deploy --schema prisma/schema.sqlite.prisma
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npm run db:seed
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npx playwright install chromium
      - continue-on-error: true
        run: node scripts/sounding-line/authority.mjs mainline --execute-only --suite ${{ inputs.suite }} --receipt-out sounding-line-worker-evidence.json
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          {
            name: "sounding-line-worker-evidence-${{ inputs.suite }}",
            path: sounding-line-worker-evidence.json,
            retention-days: 14,
          }
